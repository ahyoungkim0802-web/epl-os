<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPL OS v0.2 — 개별진도 운영 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ebe9e4;--surface:#f7f6f3;--surface-2:#ffffff;--ink:#1c2128;--muted:#676c74;--line:#d6d2ca;--line-2:#e6e3dd;
  --navy:#1b2a41;--on-navy:#f2efe8;--brass:#a8843f;--brass-ink:#7e6127;--brass-soft:#f1eadb;
  --paid:#5b4b8a;--paid-soft:#e9e3f4;--good:#3b7a5a;--good-soft:#e3efe8;--warn:#9a6a1f;--warn-soft:#f3e8d1;--bad:#a94438;--bad-soft:#f4e1de;--info:#4f6a8a;--info-soft:#e3e9f0;
  --title:#1b2a41;--r:8px;--r-sm:5px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paid-soft:#2d2742;--bg:#10161f;--surface:#171f2a;--surface-2:#1d2735;--ink:#e6e4df;--muted:#98a0aa;--line:#2b3644;--line-2:#232d3a;--title:#e6e4df;--brass:#c6a35a;--brass-ink:#d9bb78;--brass-soft:#2a2519;--good:#7fbf9c;--good-soft:#1c2c24;--warn:#d1a55a;--warn-soft:#2c2416;--bad:#e08a7f;--bad-soft:#33201d;--info:#8fa9c8;--info-soft:#1e2733;}
}
:root[data-theme="dark"]{--bg:#10161f;--surface:#171f2a;--surface-2:#1d2735;--ink:#e6e4df;--muted:#98a0aa;--line:#2b3644;--line-2:#232d3a;--title:#e6e4df;--brass:#c6a35a;--brass-ink:#d9bb78;--brass-soft:#2a2519;--good:#7fbf9c;--good-soft:#1c2c24;--warn:#d1a55a;--warn-soft:#2c2416;--bad:#e08a7f;--bad-soft:#33201d;--info:#8fa9c8;--info-soft:#1e2733;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:var(--on-navy)}
.top .in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:22px;letter-spacing:-.01em;color:var(--on-navy);text-decoration:none;white-space:nowrap}
.brand small{font-family:'IBM Plex Sans KR','Pretendard',system-ui,sans-serif;font-weight:400;font-size:12px;opacity:.7;margin-left:8px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{color:var(--on-navy);opacity:.72;text-decoration:none;padding:6px 10px;border-radius:var(--r-sm);font-size:14px}
nav a.on{opacity:1;background:rgba(255,255,255,.12)}
.qk input[type=text],.qk input[type=number],.qk select{padding:5px 8px}
nav a:hover{opacity:1}
main{max-width:1120px;margin:0 auto;padding:22px 20px 70px}
h1{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:26px;line-height:1.2;margin:0 0 4px;color:var(--title)}
h2{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:18px;margin:0 0 10px;color:var(--title)}
h3{font-size:15px;font-weight:600;margin:14px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.bar .sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;max-width:100%}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.b-good{background:var(--good-soft);color:var(--good)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-muted{background:var(--line-2);color:var(--muted)}.b-brass{background:var(--brass-soft);color:var(--brass-ink)}
.btn{font:inherit;font-size:14px;font-weight:500;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.4}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.b{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.s{padding:4px 10px;font-size:13px}
.btn.d{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);max-width:100%}
input[type=number]{width:84px}
input[type=text]{min-width:120px}
textarea{width:100%;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.st{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st .time{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:22px;font-weight:500;color:var(--title);line-height:1.1}
.st .time small{display:block;font-family:'IBM Plex Sans KR','Pretendard',system-ui,sans-serif;font-size:12px;color:var(--muted);margin-top:4px}
.st .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.st .who .nm{font-size:17px;font-weight:600;color:var(--ink);text-decoration:none}
.st .who .ar{color:var(--muted);font-size:13px}
.st .who .sp{flex:1}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.slot{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;min-height:64px}
.slot .k{font-size:12px;color:var(--muted)}
.slot .u{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;color:var(--brass-ink);line-height:1.15}
.slot .u.small{font-size:15px;font-family:inherit;font-weight:500}
.slot .bk{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{font-size:13px;color:var(--muted)}
.confirm{border-left:3px solid var(--brass);padding:12px 16px;background:var(--brass-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;margin:12px 0}
.confirm .big{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:19px;color:var(--title);margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:var(--r-sm);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.srow{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line-2)}
.srow:first-of-type{border-top:0}
.srow .n{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:20px;color:var(--brass-ink);font-weight:600;line-height:1.2}
.srow .ttl{font-weight:600;margin-bottom:6px}
.srow .auto{color:var(--muted);font-size:13px;margin-left:6px}
.radios{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.pick-h{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;border-bottom:1px solid var(--line-2);padding-bottom:4px}
.pick-bk{display:block;width:100%;text-align:left;font:inherit;font-size:13px;padding:5px 8px;margin:2px 0;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--muted);cursor:pointer}
.pick-bk:hover{border-color:var(--brass);color:var(--ink);background:var(--surface-2)}
.pick-bk.mine{color:var(--ink);font-weight:600;background:var(--surface-2);border-color:var(--line)}
.pick-bk.used{opacity:.45}
.line .lbl{min-width:150px}
.srow .ttl{margin-bottom:4px}
.chip-opt{cursor:pointer}
.chip-opt input{position:absolute;opacity:0;width:0;height:0}
.chip-opt span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;background:var(--surface-2);color:var(--ink);line-height:1.3}
.chip-opt input:checked+span{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.chip-opt input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
details.more{display:inline-block}
details.more>summary{list-style:none;cursor:pointer;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:inline-block;background:var(--surface-2)}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{color:var(--ink)}
details.more>*:not(summary){margin-top:6px}
.radios label{display:flex;align-items:center;gap:5px;font-size:14px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs a{font-size:14px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);color:var(--ink);text-decoration:none}
.tabs a.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.chain{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.chain .bk{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:6px 10px;font-size:13px}
.chain .bk.off{opacity:.5}
.chain .arr{color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font:inherit;text-decoration:underline}
a{color:var(--info)}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 8px;font-size:13px;background:var(--surface-2)}
.hist span.done{border-color:var(--good);color:var(--good)}
.hist span.cur{border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.ban{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;margin-bottom:12px}
.spark{display:block;max-width:100%;height:auto}
.bar-track{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;min-width:80px}
.bar-fill{height:100%;background:var(--brass)}
.metric{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric .m{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.metric .m .v{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;color:var(--title);line-height:1.1}
.metric .m .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.metric .m .d{font-size:12px;color:var(--muted);margin-top:4px}
.notes .n1{padding:10px 0;border-top:1px solid var(--line-2)}
.notes .n1:first-child{border-top:0}
.notes .meta{font-size:12px;color:var(--muted);margin-bottom:3px}
.rep{white-space:pre-line;line-height:1.7}
.rep h3{margin:12px 0 4px}
.gmap{width:100%;border-collapse:collapse;font-size:13px;border:2px solid var(--title);background:var(--surface-2)}
.gmap th{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:15px;text-align:center;padding:10px;border-bottom:2px solid var(--title);border-left:1px solid var(--line);color:var(--title)}
.gmap th.lv{font-family:inherit;font-size:11px;letter-spacing:.14em;color:var(--muted);text-align:left;font-weight:500;padding-left:14px}
.gmap td{border:1px solid var(--line-2);padding:8px 10px;vertical-align:middle}
.gmap td.lvcell{width:150px;border-left:6px solid var(--navy);vertical-align:top;padding:12px;background:var(--surface)}
.gmap .lvcell .no{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:26px;font-weight:600;color:var(--title);line-height:1}
.gmap .lvcell .nm{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:18px;font-weight:600;color:var(--ink);margin-top:4px}
.gmap .lvcell .tag{font-size:12px;color:var(--muted);margin-top:2px}
.gmap td.sk{width:104px;font-size:11px;letter-spacing:.1em;color:var(--muted);padding-left:14px;white-space:nowrap}
.gmap td.cell{cursor:pointer;min-width:150px}
.gmap td.cell.st-DONE{background:var(--line-2);color:var(--ink)}
.gmap td.cell .mk{float:right;margin-left:8px}
.gmap td.cell.st-DONE .mk{color:var(--good)}
.gmap td.cell.st-ACTIVE{outline:2px solid var(--brass);outline-offset:-2px;background:var(--brass-soft);font-weight:600;color:var(--ink)}
.gmap td.cell.st-ACTIVE .mk{color:var(--brass-ink);font-size:11px;font-weight:500}
.gmap td.cell.st-TODO{color:var(--muted)}
.gmap td.cell.st-MASTER{cursor:pointer;color:var(--ink)}
.gmap td.cell.st-MASTER:hover{outline:2px solid var(--muted);outline-offset:-2px}
.gmap td.cell.st-EDIT{outline:2px solid var(--brass)!important;outline-offset:-2px;background:var(--brass-soft)}
.gmap td.cell .plus{display:inline-block;font-size:12px;color:var(--brass-ink);border:1px dashed var(--brass);border-radius:999px;padding:2px 10px;background:var(--surface-2)}
.gmap td.cell .pen{color:var(--muted);font-size:12px;opacity:.6}
.gmap td.cell.st-MASTER:hover .pen{opacity:1;color:var(--brass-ink)}
.gmap td.cell.st-EMPTY{background:repeating-linear-gradient(45deg,transparent,transparent 6px,var(--line-2) 6px,var(--line-2) 7px);cursor:default}
.gmap td.cell:not(.st-EMPTY):not(.st-MASTER):hover{outline:2px solid var(--muted);outline-offset:-2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface-2);font-size:13px}
.chip b{color:var(--brass-ink);margin-right:6px;font-weight:600}
.pbar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;margin:8px 0}
.pbar div{height:100%;background:var(--brass)}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;border:1px solid var(--line)}
.lg-done{background:var(--line-2)}.lg-act{border-color:var(--brass);background:var(--brass-soft)}.lg-todo{background:var(--surface-2)}
.rcard{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;max-width:760px;margin:0 auto 20px;color:var(--ink)}
.rc-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--title);padding-bottom:10px;margin-bottom:14px}
.rc-brand{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;color:var(--title)}
.rc-course{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-top:2px}
.rc-ym{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:18px;color:var(--brass-ink)}
.rc-student{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.rc-name{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:26px;font-weight:600}
.rc-areas{width:100%;border-collapse:collapse;margin-bottom:10px}
.rc-areas td{padding:6px 4px;border-bottom:1px solid var(--line-2);font-size:14px}
.rc-areas td.rc-stars{text-align:right;color:var(--brass-ink);letter-spacing:2px;font-size:15px}
.rc-facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0 14px}
.rc-sec{margin-top:12px;break-inside:avoid}
.rc-sec h3{margin:0 0 4px;font-size:14px;color:var(--title)}
.rc-body{white-space:pre-line;line-height:1.75;font-size:14px}
.rc-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:18px;padding-top:8px;font-size:12px;color:var(--muted)}
.tt td,.tt th{text-align:center;padding:4px 6px}
.tt .tt-slot{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;color:var(--title);white-space:nowrap}
.tt .tt-cell{min-width:96px;height:30px;cursor:pointer;border-left:1px solid var(--line-2)}
.tt .tt-cell:hover{background:var(--brass-soft)}
.tt .tt-target{outline:1px dashed var(--brass);outline-offset:-2px}
.tt .tt-dup{background:var(--bad-soft)}
.tt .tt-name{display:inline-block;color:var(--ink);text-decoration:none;padding:1px 6px;border-radius:var(--r-sm)}
.tt .tt-name.on{background:var(--navy);color:var(--on-navy)}
.tt .tt-empty{color:var(--line)}
.print-only{display:none}
.rp-layout{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.rp-layout{grid-template-columns:1fr}}
.rp-form{background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:16px}
.rp-form .f{color:rgba(255,255,255,.75);margin-bottom:8px}
.rp-form input,.rp-form select,.rp-form textarea{width:100%;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--on-navy)}
.rp-form textarea{min-height:64px}
.rp-form .note{color:rgba(255,255,255,.6)}
.rp-form .rp-grp{font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.6);margin:14px 0 6px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.rp-form .rp-grp:first-child{border-top:0;margin-top:0;padding-top:0}
.rp-form .rp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.rp-form .rp-row select{width:100px}
.rp-form details summary{color:rgba(255,255,255,.7)}
.rpcard{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;color:var(--ink)}
#modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;place-items:center;z-index:50;padding:20px}
#modal.on{display:grid}
#modal .mbox{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:20px 22px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);white-space:pre-line;font-size:14px;line-height:1.55}
#modal .mbar{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#captureHost{position:fixed;left:-20000px;top:0;width:794px;background:#fff;z-index:-1}
#captureHost .rpcard{width:794px;min-height:1123px;border:0;border-radius:0;display:flex;flex-direction:column;background:#fff;color:#1a1f2b}
#captureHost .rpcard .rp-foot{margin-top:auto}
.rp-head{background:var(--navy);color:var(--on-navy);padding:22px 26px;display:flex;justify-content:space-between;align-items:center}
.rp-brand{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:26px;font-weight:600}

function defaultTrack(s){const trs=activeTracks(s.id);return trs.find(t=>t.id===s.default_track_id&&t.delivery_mode==='ACADEMY')||trs.find(t=>t.delivery_mode==='ACADEMY'&&t.category==='GRAMMAR')||trs.find(t=>t.delivery_mode==='ACADEMY')||null;}

// --- alerts ---
function ruleFor(code){return (S.authority_rules||[]).find(r=>r.code===code)||null;}
function applyAuthority(al){const r=ruleFor(al.rule_code);al.authority_level=r?r.level:'TEACHER';al.due_at=r?addDays(al.created_at||todayISO(),Math.max(1,Math.ceil(num(r.deadline_hours,24)/24))):null;al.action_text=r?r.action_text:'';al.manual_id=r?(r.manual_id||null):null;al.criterion=r?r.criterion:'';return al;}
function raiseAlert(a){
  const dup=a.source_event_id?null:S.alerts.find(x=>x.status!=='RESOLVED'&&x.student_id===a.student_id&&x.rule_code===a.rule_code&&(x.track_id||null)===(a.track_id||null));
  if(dup){dup.message=a.message;dup.action=a.action;return null;}
  const al=Object.assign({id:uid('al'),track_id:null,status:'OPEN',created_at:todayISO(),resolved_at:null,handled_by:null,handled_at:null,approval_id:null,source_event_id:null},a);
  applyAuthority(al);S.alerts.push(al);return al;
}
function handleAlert(id,teacherId,note,date){const a=byId(S.alerts,id);if(!a)return null;a.status='RESOLVED';a.resolved_at=date||todayISO();a.handled_by=teacherId||null;a.handled_at=a.resolved_at;if(note)a.handle_note=note;const ev=a.source_event_id?byId(S.events,a.source_event_id):null;if(ev){ev.status='DONE';ev.resolved_at=a.resolved_at;}return a;}
// --- events (1탭 입력: 결석 · 문의 · 불만 · 휴원 · 퇴원) ---
function addEvent(sid,type,date,teacherId,note){
  const s=studentOf(sid);if(!s||!EVENT_TYPES[type])return null;date=date||todayISO();
  const ev={id:uid('ev'),student_id:sid,type,date,teacher_id:teacherId||null,note:(note||'').trim(),status:'OPEN',makeup_date:null,resolved_at:null};S.events.push(ev);
  const r=ruleFor(type);const al=raiseAlert({student_id:sid,track_id:null,rule_code:type,severity:type==='COMPLAINT'||type==='WITHDRAW'?'ACTION':type==='ABSENCE'?'INFO':'WARN',message:EVENT_TYPES[type]+(ev.note?' · '+ev.note:'')+' ('+date+')',action:r?r.criterion:'',created_at:date,source_event_id:ev.id,teacher_id:teacherId||null});
  ev.alert_id=al?al.id:null;return ev;
}
// --- approvals (보고 후 결정 · 원장 결정) ---
function requestApproval(alertId,teacherId,note,date){
  const a=byId(S.alerts,alertId);if(!a||a.status==='RESOLVED')return null;date=date||todayISO();
  const ap={id:uid('ap'),alert_id:a.id,student_id:a.student_id,level:a.authority_level==='DIRECTOR'?'DIRECTOR':'REPORT',requested_by:teacherId||null,requested_at:date,note:(note||'').trim(),due_at:a.due_at,decision:null,decision_note:'',decided_at:null};
  S.approvals.push(ap);a.status='REPORTED';a.approval_id=ap.id;return ap;
}
function decideApproval(apId,decision,note,directorId,date){
  const ap=byId(S.approvals,apId);if(!ap||ap.decision)return null;date=date||todayISO();const a=byId(S.alerts,ap.alert_id);
  ap.decision=decision;ap.decision_note=(note||'').trim();ap.decided_at=date;ap.decided_by=directorId||null;
  if(!a)return ap;
  if(decision==='RETURNED'){a.status='OPEN';a.authority_level='TEACHER';a.action_text='원장 되돌림: '+(ap.decision_note||'강사 판단으로 처리');return ap;}
  a.status='RESOLVED';a.resolved_at=date;a.handled_by=directorId||null;a.handled_at=date;a.handle_note=ap.decision_note;
  const ev=a.source_event_id?byId(S.events,a.source_event_id):null;if(ev){ev.status='DONE';ev.resolved_at=date;}
  if(decision==='APPROVED'&&ev){const st=studentOf(ev.student_id);if(st&&ev.type==='WITHDRAW'){st.status='WITHDRAWN';st.withdrawn_at=date;st.withdraw_reason=ev.note;}if(st&&ev.type==='PAUSE'){st.status='PAUSED';st.pause_from=date;}}
  return ap;
}
// --- 완료 기준 (세션 기록 + 알림장 발송) ---
function expectedOn(s,date){return s.status==='ACTIVE'&&s.schedules.some(x=>x.weekday===wdOf(date))&&(!s.enrolled_at||s.enrolled_at<=date);}
function completionOf(s,date){
  if(S.events.some(e=>e.student_id===s.id&&e.type==='ABSENCE'&&e.date===date))return 'ABSENT';
  const ss=S.sessions.filter(x=>x.student_id===s.id&&x.session_date===date);if(!ss.length)return 'NO_SESSION';return ss.some(x=>x.sent)?'DONE':'NOT_SENT';
}
function incompleteList(from,to,loc){const out=[];for(let d=from;d<=to;d=addDays(d,1)){for(const s of S.students){if(loc&&s.location_id!==loc)continue;if(!expectedOn(s,d))continue;const c=completionOf(s,d);if(c==='NO_SESSION'||c==='NOT_SENT')out.push({date:d,student:s,kind:c});}}return out;}
// --- 주간 대시보드 ---
function weekStartOf(iso){const d=new Date(iso+'T00:00:00');const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return isoLocal(d);}
function median(arr){const a=arr.filter(x=>x!=null).sort((x,y)=>x-y);if(!a.length)return null;const m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function weekMetrics(loc,ws){
  const we=addDays(ws,6);const inW=d=>d&&d>=ws&&d<=we;const sts=S.students.filter(s=>!loc||s.location_id===loc);const ids=new Set(sts.map(s=>s.id));
  const active=sts.filter(s=>s.status==='ACTIVE').length;const enrolled=sts.filter(s=>inW(s.enrolled_at)).length;const withdrawn=sts.filter(s=>inW(s.withdrawn_at)).length;
  const abs=S.events.filter(e=>ids.has(e.student_id)&&e.type==='ABSENCE'&&inW(e.date));const absDone=abs.filter(e=>e.makeup_date&&daysBetween(e.date,e.makeup_date)<=14).length;
  let expected=0,done=0;for(let d=ws;d<=we;d=addDays(d,1)){if(d>todayISO())break;for(const s of sts){if(!expectedOn(s,d))continue;const c=completionOf(s,d);if(c==='ABSENT')continue;expected++;if(c==='DONE')done++;}}
  const sess=S.sessions.filter(x=>ids.has(x.student_id)&&inW(x.session_date));let units=0;const wr=[];for(const x of sess)for(const a of x.activities){if(a.activity_type==='INDIVIDUAL_PROGRESS'&&a.status==='COMPLETED')units++;if(a.rubric&&rubricAvg(a.rubric)!=null)wr.push(rubricAvg(a.rubric));}
  const levelMoves=S.tracks.filter(t=>ids.has(t.student_id)&&t.status==='COMPLETED'&&inW(t.ended_at)).length;
  const ars=sts.filter(s=>s.status==='ACTIVE'&&s.ar_level).map(s=>s.ar_level);
  const inq=S.events.filter(e=>ids.has(e.student_id)&&(e.type==='INQUIRY'||e.type==='COMPLAINT')&&inW(e.date));
  const open=S.alerts.filter(a=>ids.has(a.student_id)&&a.status!=='RESOLVED');const overdue=open.filter(a=>a.due_at&&a.due_at<todayISO()).length;
  const mean=a=>a.length?Math.round(a.reduce((p,c)=>p+c,0)/a.length*10)/10:null;
  return{ws,we,active,enrolled,withdrawn,absences:abs.length,makeupRate:abs.length?Math.round(absDone/abs.length*100):null,expected,completed:done,completeRate:expected?Math.round(done/expected*100):null,units,levelMoves,arAvg:mean(ars),writingAvg:mean(wr),inquiries:inq.filter(e=>e.type==='INQUIRY').length,complaints:inq.filter(e=>e.type==='COMPLAINT').length,openAlerts:open.length,overdue};
}
function weekBaseline(loc,ws){const prev=[];for(let i=1;i<=4;i++)prev.push(weekMetrics(loc,addDays(ws,-7*i)));const pick=k=>median(prev.map(m=>m[k]));return{active:pick('active'),makeupRate:pick('makeupRate'),completeRate:pick('completeRate'),units:pick('units'),arAvg:pick('arAvg'),writingAvg:pick('writingAvg'),inquiries:pick('inquiries'),complaints:pick('complaints')};}
function weekFlags(m,b){
  const f={};
  if(b.active!=null&&Math.abs(m.active-b.active)>=2)f.active='재원 '+(m.active-b.active>0?'+':'')+(m.active-b.active);
  if(m.makeupRate!=null&&b.makeupRate!=null&&m.makeupRate<b.makeupRate-10)f.makeup='보강 처리율 하락';
  if(m.completeRate!=null&&(m.completeRate<90||(b.completeRate!=null&&m.completeRate<b.completeRate-10)))f.complete='완료율 '+m.completeRate+'%';
  if(b.units!=null&&b.units>0&&m.units<b.units*0.85)f.perf='진행 Unit 감소';
  if(b.arAvg!=null&&m.arAvg!=null&&m.arAvg<b.arAvg-0.2)f.perf='AR 평균 하락';
  const base=b.inquiries==null?0:b.inquiries;const basec=b.complaints==null?0:b.complaints;
  if(m.inquiries+m.complaints>=Math.max(2,(base+basec)*2)&&m.inquiries+m.complaints>0)f.inq='문의·불만 증가';
  if(m.complaints>0)f.inq='불만 '+m.complaints+'건';
  if(m.overdue>0)f.overdue='기한 초과 예외 '+m.overdue;
  return f;
}
// --- manuals ---
function manualOf(id){return byId(S.manuals,id);}

function resolveAlert(id,date){const a=byId(S.alerts,id);if(a&&a.status!=='RESOLVED'){a.status='RESOLVED';a.resolved_at=date||todayISO();}}

// --- curriculum state transitions ---
function createTest(t,attempt,status,date){
  const ct={id:uid('ct'),student_id:t.student_id,track_id:t.id,book_id:t.book_id,attempt_no:attempt,status,scheduled_date:null,score:null,total:null,pct:null,pass_score_snapshot:passScoreOf(bookOf(t)),taken_at:null,graded_by:null,created_at:date||todayISO()};
  S.completion_tests.push(ct);return ct;
}
function newTrack(sid,cat,bookId,curUnitId,mode,date){
  const b=byId(S.books,bookId);const nx=curUnitId?nextUnitOf(b,curUnitId):firstUnit(b);
  const t={id:uid('tr'),student_id:sid,category:cat,book_id:bookId,current_unit_id:curUnitId||null,next_unit_id:nx?nx.id:null,delivery_mode:mode,status:'IN_PROGRESS',repeat_count:0,hw_miss_streak:0,writing_miss_streak:0,vocab_retest_streak:0,started_at:date||todayISO(),ended_at:null,active:true};
  S.tracks.push(t);
  if(!t.next_unit_id)completeBook(t,date);
  return t;
}
function completeBook(t,date){
  const b=bookOf(t);t.next_unit_id=null;
  if(b.completion_test_required){t.status='TEST_REQUIRED';createTest(t,1,'READY_FOR_TEST',date);}
  else moveToNextBook(t,date);
}
const gridOf=b=>(b&&Array.isArray(b.grid)?b.grid:[]).slice().sort((x,y)=>x.level-y.level||x.season-y.season);
const cellKey=(l,cat,se)=>l+'-'+cat+'-'+se;
function mapCells(cat){const cells=[];for(const L of levelsOf())for(const se of SEASONS){const books=S.books.filter(b=>b.category===cat&&gridOf(b).some(c=>c.level===L.no&&c.season===se)).sort((a,b)=>(a.alt||0)-(b.alt||0));if(books.length)cells.push({level:L.no,season:se,key:cellKey(L.no,cat,se),books});}return cells;}
function nextBookOf(b){
  if(!b)return null;if(b.next_book_id)return byId(S.books,b.next_book_id);
  const g=gridOf(b);if(!g.length)return null;const lastC=g[g.length-1];
  const cells=mapCells(b.category);const i=cells.findIndex(c=>c.level===lastC.level&&c.season===lastC.season);
  for(let j=i+1;j<cells.length;j++){const cands=cells[j].books.filter(x=>x.id!==b.id&&x.active!==false);if(cands.length)return cands.find(x=>(x.alt||0)===(b.alt||0))||cands[0];}
  return null;
}
function moveToNextBook(t,date){
  const b=bookOf(t);const nb=nextBookOf(b);
  if(!nb){t.status='PATH_END';raiseAlert({student_id:t.student_id,track_id:t.id,rule_code:'PATH_END',severity:'ACTION',message:b.book_name+' 완료 · 다음 교재가 설정되지 않음',action:'Admin: Curriculum Path에서 next_book 설정',created_at:date||todayISO()});return null;}
  t.status='COMPLETED';t.active=false;t.ended_at=date||todayISO();
  return newTrack(t.student_id,t.category,nb.id,null,t.delivery_mode,date);
}
// --- growth map per student ---
function cellStatus(s,cell){
  const sid=s.id;const trs=S.tracks.filter(t=>t.student_id===sid&&cell.books.some(b=>b.id===t.book_id));
  if(trs.some(t=>t.active))return 'ACTIVE';
  if(trs.some(t=>t.status==='COMPLETED')||(s.map_done&&s.map_done[cell.key]))return 'DONE';
  return 'TODO';
}
function mapStats(s){let done=0,active=0,total=0;const per={};for(const cat of CATS){for(const c of mapCells(cat)){total++;const st=cellStatus(s,c);if(st==='DONE')done++;else if(st==='ACTIVE')active++;}}return{done,active,total,todo:total-done-active,pct:total?Math.round(done/total*100):0};}
function currentCellOf(s,cat){const cells=mapCells(cat);const t=activeTracks(s.id).find(x=>x.category===cat&&gridOf(bookOf(x)).length);if(!t)return null;const g=gridOf(bookOf(t));const c=g[0];return cells.find(x=>x.level===c.level&&x.season===c.season)||null;}
function startMapBook(sid,bookId,date){
  const s=studentOf(sid);const b=byId(S.books,bookId);if(!s||!b)return null;date=date||todayISO();
  for(const t of activeTracks(sid))if(t.category===b.category&&t.book_id!==b.id)endTrack(t,date);
  const cells=mapCells(b.category);const g=gridOf(b);const first=g[0];s.map_done=s.map_done||{};
  if(first){const idx=cells.findIndex(c=>c.level===first.level&&c.season===first.season);for(let i=0;i<idx;i++){if(cellStatus(s,cells[i])!=='DONE')s.map_done[cells[i].key]=date;}}
  for(const c of g)delete s.map_done[cellKey(c.level,b.category,c.season)];
  const existing=activeTracks(sid).find(t=>t.book_id===b.id);if(existing)return existing;
  const mode=(b.category==='READING_HW'||b.category==='VOCAB')?'HOME':'ACADEMY';
  const t=addTrack(sid,b.id,null,mode,date);if(t&&mode==='ACADEMY'&&!defaultTrack(s))s.default_track_id=t.id;return t;
}
// --- assessments (AR · NELT) ---
function assessmentsOf(sid,kind){return S.assessments.filter(a=>a.student_id===sid&&(!kind||a.kind===kind)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));}
function latestAssessment(sid,kind){const l=assessmentsOf(sid,kind);return l[l.length-1]||null;}
function refreshAR(s){const a=latestAssessment(s.id,'AR');if(a&&Number.isFinite(Number(a.score)))s.ar_level=Number(a.score);}
function addAssessment(sid,kind,date,score,level,detail,note){const a={id:uid('as'),student_id:sid,kind:kind||'기타',date:date||todayISO(),score:(score===''||score==null)?null:(Number.isFinite(Number(score))?Number(score):String(score)),level:(level||'').trim(),detail:(detail||'').trim(),note:(note||'').trim()};S.assessments.push(a);const s=studentOf(sid);if(s&&a.kind==='AR')refreshAR(s);persist();return a;}
function delAssessment(id){const a=byId(S.assessments,id);if(!a)return;S.assessments=S.assessments.filter(x=>x.id!==id);const s=studentOf(a.student_id);if(s&&a.kind==='AR')refreshAR(s);persist();}
function advanceUnit(t,unit,date){
  const b=bookOf(t);t.current_unit_id=unit.id;t.repeat_count=0;
  const nx=nextUnitOf(b,unit.id);
  if(nx)t.next_unit_id=nx.id;else completeBook(t,date);
}
function addTrack(sid,bookId,curUnitId,mode,date){const b=byId(S.books,bookId);if(!b)return null;return newTrack(sid,b.category,bookId,curUnitId,mode,date);}
function updateTrackState(t,curUnitId,mode,date){
  if(mode)t.delivery_mode=mode;
  if((t.current_unit_id||null)!==(curUnitId||null)){
    const b=bookOf(t);t.current_unit_id=curUnitId||null;const nx=curUnitId?nextUnitOf(b,curUnitId):firstUnit(b);t.next_unit_id=nx?nx.id:null;t.repeat_count=0;
    if(!t.next_unit_id&&t.status==='IN_PROGRESS')completeBook(t,date);
    else if(t.next_unit_id&&(t.status==='TEST_REQUIRED'||t.status==='PATH_END')){
      t.status='IN_PROGRESS';
      S.completion_tests=S.completion_tests.filter(x=>!(x.track_id===t.id&&(x.status==='READY_FOR_TEST'||x.status==='TEST_SCHEDULED'||x.status==='RETEST_REQUIRED')));
      for(const a of S.alerts)if(a.track_id===t.id&&a.rule_code==='PATH_END'&&a.status!=='RESOLVED'){a.status='RESOLVED';a.resolved_at=date||todayISO();}
    }
  }
  return t;
}
function endTrack(t,date){t.active=false;t.ended_at=date||todayISO();if(t.status!=='COMPLETED')t.status='CHANGED';}
function overrideNext(t,unitId,reason,teacherId,date){
  if(!unitId||unitId===t.next_unit_id)return false;
  S.overrides.push({id:uid('ov'),student_id:t.student_id,track_id:t.id,session_id:null,system_next_unit_id:t.next_unit_id,override_unit_id:unitId,reason:reason||'',teacher_id:teacherId||null,created_at:date||todayISO()});
  t.next_unit_id=unitId;t.repeat_count=0;if(t.status!=='IN_PROGRESS')t.status='IN_PROGRESS';return true;
}

// --- session save = LOG → STATE → NEXT → EXCEPTION in one transaction ---
function saveSession(d){
  const R=S.rules;
  const sess={id:uid('se'),student_id:d.student_id,teacher_id:d.teacher_id,location_id:d.location_id,session_date:d.session_date,original_book_id:d.original_book_id||null,original_book_title:d.original_book_title||'',quiz_score:d.quiz_score,quiz_total:d.quiz_total,teacher_note:d.teacher_note||'',attitude:d.attitude==null?null:num(d.attitude),recording_url:d.recording_url||'',homework_notice:'',daily_comment:'',sent:false,activities:[]};
  const ipDone=[];
  for(const a of d.activities){
    if(a.activity_type==='HOMEWORK_CHECK'&&!a.track_id&&a.custom_name){sess.activities.push({activity_type:'HOMEWORK_CHECK',track_id:null,book_id:null,unit_id:null,custom_name:String(a.custom_name).trim(),status:a.status||'COMPLETED',score:null,total:null,pct:null,result:'NA',lesson_note:''});continue;}
    const t=byId(S.tracks,a.track_id);if(!t||!t.active)continue;
    const b=bookOf(t);

      const act={activity_type:a.activity_type,track_id:t.id,book_id:t.book_id,unit_id:a.unit_id||t.next_unit_id||t.current_unit_id||null,status:a.status||'COMPLETED',score:null,total:null,pct:null,result:'NA',lesson_note:a.lesson_note||''};
      if(t.category==='WRITING'&&a.activity_type==='INDIVIDUAL_PROGRESS'){if(a.rubric&&Object.values(a.rubric).some(v=>v!=null))act.rubric={acc:a.rubric.acc==null?null:num(a.rubric.acc),idea:a.rubric.idea==null?null:num(a.rubric.idea),expr:a.rubric.expr==null?null:num(a.rubric.expr)};if(a.evidence&&(a.evidence.sentences||a.evidence.errors||(a.evidence.ideas&&a.evidence.ideas.length)||a.evidence.own))act.evidence=a.evidence;if(a.work)act.work=String(a.work).trim();}
      if(a.activity_type==='HOMEWORK_CHECK'){if(act.status==='NOT_DONE')t.hw_miss_streak=(t.hw_miss_streak||0)+1;else if(act.status==='COMPLETED')t.hw_miss_streak=0;}
      if(a.activity_type==='INDIVIDUAL_PROGRESS')ipDone.push({book:b,unit_id:act.unit_id,track:t,status:act.status});
      sess.activities.push(act);continue;
    }
    const unitId=a.unit_id||t.next_unit_id;if(!unitId)continue;
    if(a.activity_type==='VOCAB_TEST'&&a.kind==='REVIEW'){const sc=(a.score===''||a.score==null)?null:num(a.score),tt=(a.total===''||a.total==null)?null:num(a.total);const pc=pct1(sc,tt);const res=pc==null?'NA':pc>=num(R.VOCAB_THRESHOLD.vocab_pass,90)?'PASS':pc>=num(R.VOCAB_THRESHOLD.vocab_check,80)?'CHECK':'RETEST';
      sess.activities.push({activity_type:'VOCAB_TEST',kind:'REVIEW',range:(a.range||'').trim(),track_id:t.id,book_id:t.book_id,unit_id:t.current_unit_id||t.next_unit_id,status:'COMPLETED',score:sc,total:tt,pct:pc,result:res,lesson_note:''});continue;}
    if(a.activity_type==='VOCAB_TEST'&&unitId!==t.next_unit_id){const us=unitsOf(b);const si=us.findIndex(u=>u.id===unitId),ni=us.findIndex(u=>u.id===t.next_unit_id);
      if(si>=0&&si<ni){const sc=(a.score===''||a.score==null)?null:num(a.score),tt=(a.total===''||a.total==null)?null:num(a.total);const pc=pct1(sc,tt);const res=pc==null?'NA':pc>=num(R.VOCAB_THRESHOLD.vocab_pass,90)?'PASS':pc>=num(R.VOCAB_THRESHOLD.vocab_check,80)?'CHECK':'RETEST';
        sess.activities.push({activity_type:'VOCAB_TEST',track_id:t.id,book_id:t.book_id,unit_id:unitId,status:'COMPLETED',score:sc,total:tt,pct:pc,result:res,lesson_note:'이전 Unit 재시험'});continue;}}
    if(unitId!==t.next_unit_id){
      S.overrides.push({id:uid('ov'),student_id:t.student_id,track_id:t.id,session_id:sess.id,system_next_unit_id:t.next_unit_id,override_unit_id:unitId,reason:a.override_reason||'',teacher_id:d.teacher_id,created_at:d.session_date});
      t.next_unit_id=unitId;t.repeat_count=0;
    }
    const unit=unitById(b,unitId);if(!unit)continue;
    const act={activity_type:a.activity_type,track_id:t.id,book_id:t.book_id,unit_id:unitId,status:a.status||'COMPLETED',score:null,total:null,pct:null,result:'NA',lesson_note:a.lesson_note||''};
    if(t.category==='WRITING'&&a.activity_type==='INDIVIDUAL_PROGRESS'){if(a.rubric&&Object.values(a.rubric).some(v=>v!=null))act.rubric={acc:a.rubric.acc==null?null:num(a.rubric.acc),idea:a.rubric.idea==null?null:num(a.rubric.idea),expr:a.rubric.expr==null?null:num(a.rubric.expr)};if(a.evidence&&(a.evidence.sentences||a.evidence.errors||(a.evidence.ideas&&a.evidence.ideas.length)||a.evidence.own))act.evidence=a.evidence;if(a.work)act.work=String(a.work).trim();}
    if(a.activity_type==='INDIVIDUAL_PROGRESS')ipDone.push({book:b,unit_id:unitId,track:t,status:act.status});
    if(a.activity_type==='VOCAB_TEST'){
      act.score=(a.score===''||a.score==null)?null:num(a.score);act.total=(a.total===''||a.total==null)?null:num(a.total);act.pct=pct1(act.score,act.total);act.status='COMPLETED';
      if(act.pct==null)act.result='NA';
      else if(act.pct>=num(R.VOCAB_THRESHOLD.vocab_pass,90))act.result='PASS';
      else if(act.pct>=num(R.VOCAB_THRESHOLD.vocab_check,80))act.result='CHECK';
      else act.result='RETEST';
      if(act.result==='PASS'||(act.result==='CHECK'&&R.VOCAB_CHECK_MODE.mode!=='REPEAT'))advanceUnit(t,unit,d.session_date);
      else if(act.result!=='NA')t.repeat_count+=1;
      if(act.result==='RETEST')t.vocab_retest_streak=(t.vocab_retest_streak||0)+1;else if(act.result!=='NA')t.vocab_retest_streak=0;
    }else{
      if(act.status==='COMPLETED'){
        advanceUnit(t,unit,d.session_date);
        if(a.activity_type==='HOMEWORK_CHECK')t.hw_miss_streak=0;
        if(a.activity_type==='WRITING')t.writing_miss_streak=0;
      }else{
        t.repeat_count+=1;
        if(a.activity_type==='HOMEWORK_CHECK'&&act.status==='NOT_DONE')t.hw_miss_streak=(t.hw_miss_streak||0)+1;
        if(a.activity_type==='HOMEWORK_CHECK'&&act.status==='REPEAT')t.hw_miss_streak=0;
        if(a.activity_type==='WRITING'&&act.status==='NOT_DONE')t.writing_miss_streak=(t.writing_miss_streak||0)+1;
      }
    }
    sess.activities.push(act);
  }
  S.sessions.push(sess);
  const newAlerts=evaluateStudent(d.student_id,d.session_date);
  sess.homework_notice=genHomeworkNotice(sess,ipDone);
  sess.daily_comment=genComment(sess);
  persist();
  return {session:sess,newAlerts};
}

function scheduleTest(id,date){const ct=byId(S.completion_tests,id);if(!ct)return;ct.scheduled_date=date;ct.status='TEST_SCHEDULED';persist();}
function gradeTest(id,score,total,teacherId,date){
  const ct=byId(S.completion_tests,id);if(!ct)return null;const t=byId(S.tracks,ct.track_id);const b=byId(S.books,ct.book_id);
  ct.score=num(score);ct.total=num(total);ct.pct=pct1(ct.score,ct.total);ct.taken_at=date||todayISO();ct.graded_by=teacherId||null;

  }

  raiseAlert({student_id:t.student_id,track_id:t.id,rule_code:'TEST_FAIL',severity:'ACTION',message:b.book_name+' · Final Test '+ct.pct+'% (기준 '+ct.pass_score_snapshot+'%)',action:'취약 영역 복습 후 재시험',created_at:ct.taken_at});

}

  const n=S.completion_tests.filter(x=>x.track_id===t.id).length;const nt=createTest(t,n+1,'RETEST_REQUIRED',date);t.status='RETEST_REQUIRED';persist();return nt;
}

// --- exception engine ---
const COMPUTED_RULES=['HW_MISS','UNIT_REPEAT','VOCAB_RETEST','QUIZ_LOW','STAGNATION','WRITING_MISS','DECLINE','OVERRIDE_REPEAT'];
const rubricAvg=r=>{if(!r)return null;const v=[r.acc,r.idea,r.expr].filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null;};
function evaluateStudent(sid,date){
  const R=S.rules;const active=[];const created=[];const today=date||todayISO();
  const add=(rule,track_id,severity,message,action)=>{active.push(rule+'|'+(track_id||''));const al=raiseAlert({student_id:sid,track_id:track_id||null,rule_code:rule,severity,message,action,created_at:today});if(al)created.push(al);};
  const trs=activeTracks(sid);const sess=sessionsOf(sid);
  for(const t of trs){
    const b=bookOf(t);if(!b)continue;
    if(t.delivery_mode==='HOME'&&(t.hw_miss_streak||0)>=num(R.HW_MISS.streak,2))add('HW_MISS',t.id,'WARN',b.book_name+' · '+(t.category==='VOCAB'?'온라인 학습':'숙제')+' 미완료 '+t.hw_miss_streak+'회 연속','학부모 연락 · 숙제 루틴 확인');
    if(t.next_unit_id){const n=unitAttempts(t,t.next_unit_id);if(n>=num(R.UNIT_REPEAT.count,3))add('UNIT_REPEAT',t.id,'ACTION',b.book_name+' · '+unitLong(b,t.next_unit_id)+' 반복 '+n+'회','Teacher Check Required');}
    if(t.category==='VOCAB'&&(t.vocab_retest_streak||0)>=num(R.VOCAB_RETEST.streak,2))add('VOCAB_RETEST',t.id,'WARN',b.book_name+' · RETEST '+t.vocab_retest_streak+'회 연속','단어 학습 방식 점검');
    if(t.category==='WRITING'&&(t.writing_miss_streak||0)>=num(R.WRITING_MISS.streak,3))add('WRITING_MISS',t.id,'WARN',b.book_name+' · Writing 미완료 '+t.writing_miss_streak+'회 연속','Writing 시간 확보');
    const expected=b.expected_sessions?num(b.expected_sessions):Math.ceil(unitsOf(b).length*num(R.STAGNATION.multiplier,1.5));
    const used=trackSessions(t);
    if(expected>0&&used>expected)add('STAGNATION',t.id,'WARN',b.book_name+' · 세션 '+used+'회 (기준 '+expected+'회 초과)','진도 점검');
  }
  const w=num(R.DECLINE.window,5);
  if(sess.length>=2*w){
    const rec=sess.slice(-w).map(sessionPct).filter(x=>x!=null),prev=sess.slice(-2*w,-w).map(sessionPct).filter(x=>x!=null);
    if(rec.length&&prev.length){const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;const drop=avg(prev)-avg(rec);if(drop>=num(R.DECLINE.drop_pp,15))add('DECLINE',null,'INFO','최근 '+w+'세션 평균 정답률 '+Math.round(drop)+'%p 하락','원인 확인');}
  }
  const since=addDays(today,-num(R.OVERRIDE_REPEAT.days,30));
  const ov=S.overrides.filter(o=>o.student_id===sid&&o.created_at>=since).length;
  if(ov>=num(R.OVERRIDE_REPEAT.count,3))add('OVERRIDE_REPEAT',null,'INFO',num(R.OVERRIDE_REPEAT.days,30)+'일 내 Override '+ov+'회','Admin: Curriculum Rule 검토');
  for(const a of S.alerts){
    if(a.student_id!==sid||a.status==='RESOLVED'||!COMPUTED_RULES.includes(a.rule_code))continue;
    if(!active.includes(a.rule_code+'|'+(a.track_id||''))){a.status='RESOLVED';a.resolved_at=today;}
  }
  return created;
}
function runAllRules(date){let n=0;for(const st of S.students){if(st.status!=='ACTIVE')continue;n+=evaluateStudent(st.id,date).length;}persist();return n;}

// --- curriculum admin ---
function regenUnits(b,n){
  const us=unitsOf(b);n=Math.max(1,Math.floor(num(n,us.length)));
  if(n>us.length){for(let i=us.length+1;i<=n;i++)b.units.push({id:b.id+'_u'+i,seq_no:i,unit_name:b.unit_label+' '+i,is_final:false});}
  else if(n<us.length){
    const rm=us.slice(n).map(u=>u.id);
    if(S.tracks.some(t=>t.active&&t.book_id===b.id&&(rm.includes(t.current_unit_id)||rm.includes(t.next_unit_id))))return false;
    b.units=b.units.filter(u=>!rm.includes(u.id));
  }
  const all=unitsOf(b);all.forEach((u,i)=>{u.is_final=i===all.length-1;});return true;
}
function chainOf(cat){
  const bs=S.books.filter(b=>b.category===cat);const targets=new Set(bs.map(b=>b.next_book_id).filter(Boolean));
  const roots=bs.filter(b=>!targets.has(b.id));const chains=[];
  for(const r of roots){const c=[];let cur=r;const seen=new Set();while(cur&&!seen.has(cur.id)){seen.add(cur.id);c.push(cur);cur=cur.next_book_id?byId(S.books,cur.next_book_id):null;}chains.push(c);}
  return chains;
}

// --- notices (숙제 안내 · 알림장) ---
function fillTemplate(tpl,vars){
  return String(tpl||'').split('\n').map(line=>{
    let hasVar=false,allEmpty=true;
    const out=line.replace(/\{([^{}]+)\}/g,(m,k)=>{hasVar=true;const v=vars[k.trim()];const str=v==null?'':String(v);if(str.trim()!=='')allEmpty=false;return str;});
    if(hasVar&&allEmpty)return null;
    return out.replace(/ {2,}/g,' ').replace(/ +$/,'');
  }).filter(l=>l!==null).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function hwLine(b,unitId,nextUnitId){const tpl=(b.hw_template==null?HW_DEFAULT[b.category]:b.hw_template)||'';if(!tpl.trim())return '';return fillTemplate(tpl,{교재:b.book_name,단원:unitId?unitLong(b,unitId):'',다음단원:nextUnitId?unitLong(b,nextUnitId):''});}
function genHomeworkNotice(sess,ipDone){

  if(!ipDone){ipDone=[];for(const a of sess.activities){if(a.activity_type!=='INDIVIDUAL_PROGRESS')continue;const b=byId(S.books,a.book_id);if(b)ipDone.push({book:b,unit_id:a.unit_id,track:byId(S.tracks,a.track_id),status:a.status});}}
  for(const x of ipDone){if(!x.book||seen.has(x.book.id))continue;seen.add(x.book.id);const t=x.track;if(x.status==='REVIEW'){if((x.book.hw_template==null?HW_DEFAULT[x.book.category]:x.book.hw_template)||'')lines.push('✔ '+x.book.book_name+' 오늘 복습·오답 내용 정리해 오세요');continue;}lines.push(hwLine(x.book,x.unit_id,t&&t.active?t.next_unit_id:null));}
  for(const t of activeTracks(sess.student_id)){if(t.delivery_mode!=='HOME')continue;const b=bookOf(t);if(!b||seen.has(b.id))continue;seen.add(b.id);lines.push(hwLine(b,t.next_unit_id,t.next_unit_id));}

function unitsDoneOf(t){const b=bookOf(t);const us=unitsOf(b);if(!t.current_unit_id)return 0;const i=us.findIndex(u=>u.id===t.current_unit_id);return i<0?0:i+1;}

function scheduledDaysIn(s,ym){
  const from=s.enrolled_at&&s.enrolled_at>ym+'-01'?s.enrolled_at:ym+'-01';const today=todayISO();
  let n=0;for(let d=1;d<=31;d++){const iso=ym+'-'+String(d).padStart(2,'0');if(ymOf(iso)!==ym||new Date(iso+'T00:00:00').getDate()!==d)continue;if(iso<from||iso>today)continue;if(s.schedules.some(x=>x.weekday===wdOf(iso)))n++;}
  return n;
}
function monthFacts(sid,ym){
  const s=studentOf(sid);const sess=sessionsOf(sid).filter(x=>ymOf(x.session_date)===ym);
  const wr=[];const wacc=[];const hwBook={done:0,total:0},online={done:0,total:0};
  const vt=[];const adv={};const hwDone={done:0,total:0};let review=0;
  for(const x of sess)for(const a of x.activities){
    if(a.activity_type==='VOCAB_TEST'&&a.pct!=null)vt.push(a);
    if(a.activity_type==='INDIVIDUAL_PROGRESS'&&a.rubric&&rubricAvg(a.rubric)!=null){wr.push(rubricAvg(a.rubric));if(a.rubric.acc!=null)wacc.push(a.rubric.acc);}
    if(a.activity_type==='HOMEWORK_CHECK'){const bk=byId(S.books,a.book_id);const tgt=(bk&&bk.category==='VOCAB')?online:hwBook;tgt.total++;if(a.status==='COMPLETED'||a.status==='REPEAT')tgt.done++;}
    if(a.activity_type==='INDIVIDUAL_PROGRESS'){const b=byId(S.books,a.book_id);const k=b?b.book_name:'?';adv[k]=adv[k]||{done:0,sessions:0};adv[k].sessions++;if(a.status==='COMPLETED')adv[k].done++;if(a.status==='REVIEW')review++;}
    if(a.activity_type==='HOMEWORK_CHECK'){hwDone.total++;if(a.status==='COMPLETED'||a.status==='REPEAT')hwDone.done++;}
  }
  const att=sess.filter(x=>x.attitude).map(x=>x.attitude);
  const mean=a=>a.length?Math.round(a.reduce((p,c)=>p+c,0)/a.length*10)/10:null;
  return{ym,sessions:sess.length,scheduled:scheduledDaysIn(s,ym),books:sess.filter(x=>x.original_book_title||x.original_book_id).length,
    writingAvg:mean(wr),writingN:wr.length,writingAcc:mean(wacc),hwBook,online,vocabAvg:mean(vt.map(a=>a.pct)),vocabN:vt.length,vocabPass:vt.filter(a=>a.result==='PASS').length,vocabRetest:vt.filter(a=>a.result==='RETEST').length,
    attitudeAvg:mean(att),hw:hwDone,adv,review,
    alerts:S.alerts.filter(a=>a.student_id===sid&&ymOf(a.created_at)===ym),tests:S.completion_tests.filter(x=>x.student_id===sid&&x.taken_at&&ymOf(x.taken_at)===ym),assessments:S.assessments.filter(a=>a.student_id===sid&&ymOf(a.date)===ym),
    notes:S.chart_notes.filter(n=>n.student_id===sid&&ymOf(n.date)===ym)};
}

const stars5=v=>v==null?null:Math.max(1,Math.min(5,Math.round(v)));
const bandPct=(p,cuts)=>p==null?null:(p>=cuts[0]?5:p>=cuts[1]?4:p>=cuts[2]?3:p>=cuts[3]?2:1);
function autoAreaScores(sid,ym){
  const f=monthFacts(sid,ym);const ipDone=Object.values(f.adv).reduce((n,v)=>n+v.done,0),ipSess=Object.values(f.adv).reduce((n,v)=>n+v.sessions,0);
  const byName=name=>{const n=String(name||'').replace(/\s+/g,'');
    if(/온라인/.test(n))return f.online.total?bandPct(f.online.done/f.online.total*100,[90,75,60,40]):null;
    if(/숙제|homework/i.test(n))return f.hwBook.total?bandPct(f.hwBook.done/f.hwBook.total*100,[90,75,60,40]):(f.hw.total?bandPct(f.hw.done/f.hw.total*100,[90,75,60,40]):null);
    if(/태도|attitude/i.test(n))return stars5(f.attitudeAvg);
    if(/문장구성|구조|structure|문장력/i.test(n))return stars5(f.writingAcc!=null?f.writingAcc:f.writingAvg);
    if(/라이팅|writing|글쓰기/i.test(n))return stars5(f.writingAvg);
    if(/단어|voca|vocab|어휘/i.test(n))return bandPct(f.vocabAvg,[90,80,70,60]);
    if(/원서|읽기|reading|독서/i.test(n))return f.sessions?bandPct(f.books/f.sessions*100,[95,80,60,40]):null;
    if(/진도|progress|교재/i.test(n))return ipSess?bandPct(ipDone/ipSess*100,[80,60,40,20]):null;
    return null;};
  const out={};for(const name of (S.meta.report_areas||DEFAULT_REPORT_AREAS))out[name]=byName(name);return out;
}
function prevYm(ym){const y=Number(ym.slice(0,4)),m=Number(ym.slice(5,7));return m===1?(y-1)+'-12':y+'-'+String(m-1).padStart(2,'0');}
function areaLevelsOf(sid,ym){const r=reportOf(sid,ym);const auto=autoAreaScores(sid,ym);const names=S.meta.report_areas||DEFAULT_REPORT_AREAS;const out={};for(const name of names){const cur=r&&(r.areas||[]).find(a=>a.name===name);out[name]=normLevel(cur&&cur.level?cur.level:(cur&&cur.score!=null?levelOf(cur.score):(auto[name]!=null?levelOf(auto[name]):'보통')));}return out;}
function monthCompare(sid,ym){
  const pm=prevYm(ym);const a=monthFacts(sid,pm);const b=monthFacts(sid,ym);if(!a.sessions)return null;
  const pct=o=>o.total?Math.round(o.done/o.total*100):null;
  const items=[
    ['숙제 완료율',pct(a.hwBook),pct(b.hwBook),'%'],['온라인 학습',pct(a.online),pct(b.online),'%'],['수업태도',a.attitudeAvg,b.attitudeAvg,'/5'],
    ['문장구성 (문장력)',a.writingAcc!=null?a.writingAcc:a.writingAvg,b.writingAcc!=null?b.writingAcc:b.writingAvg,'/5'],['단어 Test 평균',a.vocabAvg,b.vocabAvg,'%']
  ].filter(([,p,c])=>p!=null||c!=null).map(([label,p,c,unit])=>{const d=(p!=null&&c!=null)?Math.round((c-p)*10)/10:null;return{label,prev:p,cur:c,unit,delta:d,dir:d==null?'na':d>0?'up':d<0?'down':'same'};});
  const la=areaLevelsOf(sid,pm),lb=areaLevelsOf(sid,ym);const areas=Object.keys(lb).map(name=>({name,prev:la[name]||null,cur:lb[name]||null,dir:(!la[name]||!lb[name])?'na':levelScore(lb[name])>levelScore(la[name])?'up':levelScore(lb[name])<levelScore(la[name])?'down':'same'}));
  return{pm,items,areas};
}
const ARROW={up:'▲',down:'▼',same:'—',na:''};
function fmtDelta(x){if(x.delta==null)return '';return (x.delta>0?'+':'')+x.delta+(x.unit==='%'||x.unit==='회'||x.unit==='권'||x.unit==='개'?x.unit:'');}
function reportFactLines(sid,ym){
  const f=monthFacts(sid,ym);const s=studentOf(sid);const L=[];

  if(f.books)L.push('원서 '+f.books+'권 읽음: '+sessionsOf(sid).filter(x=>ymOf(x.session_date)===ym&&(x.original_book_title||x.original_book_id)).map(x=>x.original_book_title||nameOf(S.original_books,x.original_book_id)).join(', '));
  for(const [k,v] of Object.entries(f.adv))L.push(k+': Unit '+v.done+'개 완료 (세션 '+v.sessions+'회)');

  if(f.vocabN)L.push('단어 Test '+f.vocabN+'회 평균 '+f.vocabAvg+'% (통과 '+f.vocabPass+', 재시험 '+f.vocabRetest+')');
  if(f.writingN)L.push('라이팅 루브릭 평균 '+f.writingAvg+'/5 ('+f.writingN+'회 채점)');
  const works=[];for(const x of sessionsOf(sid).filter(x=>ymOf(x.session_date)===ym))for(const a of x.activities)if(a.work)works.push(a.work);if(works.length)L.push('쓴 글: '+works.join(', '));
  if(f.hw.total)L.push('숙제 완료 '+f.hw.done+'/'+f.hw.total+'회');
  if(f.attitudeAvg!=null)L.push('수업태도 평균 '+f.attitudeAvg+'/5');
  for(const ct of f.tests)L.push('Completion Test: '+((byId(S.books,ct.book_id)||{}).book_name||'')+' '+ct.pct+'% '+(ct.status==='PASS'?'PASS':'FAIL'));
  for(const a of f.assessments)L.push(a.kind+' '+(a.score!=null?a.score:'')+' '+(a.level||'')+' ('+a.date+')');
  for(const a of f.alerts)L.push('예외: '+(RULE_L[a.rule_code]||a.rule_code)+' — '+a.message+' ('+(a.status==='RESOLVED'?'해결':'미해결')+')');
  for(const n of f.notes)L.push('강사 기록('+n.kind+' '+n.date+'): '+n.text);
  const trs=activeTracks(sid);if(trs.length)L.push('현재 위치: '+trs.map(t=>{const b=bookOf(t);return b.book_name+' '+(t.next_unit_id?'다음 '+unitLong(b,t.next_unit_id):TRACK_ST[t.status]);}).join(' / '));
  if(s&&s.ar_level)L.push('현재 AR '+s.ar_level);
  return L;

function parseCell(key){const m=/^(\d)-(READING_HW|GRAMMAR|WRITING|VOCAB)-(\d)$/.exec(key||'');return m?{level:Number(m[1]),cat:m[2],season:Number(m[3]),key}:null;}
function booksAtCell(c){return S.books.filter(b=>b.category===c.cat&&gridOf(b).some(x=>x.level===c.level&&x.season===c.season)).sort((a,b)=>(a.alt||0)-(b.alt||0));}
function addBookToCell(b,c){if(!b.grid)b.grid=[];if(!b.grid.some(x=>x.level===c.level&&x.season===c.season)){const others=booksAtCell(c).filter(x=>x.id!==b.id);if(!gridOf(b).length)b.alt=others.length;b.grid.push({level:c.level,season:c.season});}if(b.category==='WRITING'&&b.writing_target==null)b.writing_target=WRITING_TARGET_BY_LEVEL[c.level]||8;}
function removeBookFromCell(b,c){b.grid=(b.grid||[]).filter(x=>!(x.level===c.level&&x.season===c.season));}
function createBookInCell(c,name,n,test){const ids=new Set(S.books.map(b=>b.id));let id='b_'+slug(name);let k=2;while(ids.has(id))id='b_'+slug(name)+'_'+(k++);const b=mkBook(id,c.cat,name,'L'+c.level,'Unit',Math.max(1,num(n,12)),!!test,null,null,null,null);S.books.push(b);addBookToCell(b,c);return b;}
// --- 시간표 (강사 × 15분 슬롯) ---
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?Number(m[1])*60+Number(m[2]):null;};
const toTime=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function slotsOf(loc){const a=toMin(loc.slot_start||'14:00'),b=toMin(loc.slot_end||'18:30'),st=Math.max(5,num(loc.slot_min,15));const out=[];for(let m=a;m<=b;m+=st)out.push(toTime(m));return out;}
function teachersOf(locId){return S.teachers.filter(t=>t.role!=='DIRECTOR'&&t.role!=='STAFF'&&(!t.location_id||t.location_id===locId));}
function timetable(locId,wd){
  const loc=locOf(locId);const slots=slotsOf(loc);const teachers=teachersOf(locId);const cells={};for(const t of teachers)cells[t.id]={};
  const unassigned=[];const conflicts=[];
  for(const s of S.students){if(s.status!=='ACTIVE'||s.location_id!==locId)continue;const sc=s.schedules.find(x=>x.weekday===wd);if(!sc)continue;
    if(!sc.ip_time||!sc.teacher_id||!cells[sc.teacher_id]){unassigned.push({s,sc});continue;}
    const key=sc.ip_time;(cells[sc.teacher_id][key]=cells[sc.teacher_id][key]||[]).push({s,sc});if(cells[sc.teacher_id][key].length>1)conflicts.push(key+' '+nameOf(S.teachers,sc.teacher_id));}
  const counts={};for(const t of teachers)counts[t.id]=Object.values(cells[t.id]).reduce((n,a)=>n+a.length,0);
  return{loc,slots,teachers,cells,unassigned,conflicts:[...new Set(conflicts)],counts};
}
function assignSlot(sid,wd,teacherId,ipTime){const s=studentOf(sid);if(!s)return null;let sc=s.schedules.find(x=>x.weekday===wd);const loc=locOf(s.location_id);if(!sc){sc={weekday:wd,time:null,ip_time:null,teacher_id:null};s.schedules.push(sc);}
  sc.teacher_id=teacherId||null;sc.ip_time=ipTime||null;if(sc.ip_time&&(!sc.time||sc._auto_time)){sc.time=toTime(Math.max(0,toMin(sc.ip_time)-num(loc&&loc.lead_min,45)));sc._auto_time=true;}return sc;}
function clearSlot(sid,wd){const s=studentOf(sid);if(!s)return;const sc=s.schedules.find(x=>x.weekday===wd);if(sc){sc.ip_time=null;sc.teacher_id=null;}}
function hourLoad(locId,wd){const out={};for(const s of S.students){if(s.status!=='ACTIVE'||s.location_id!==locId)continue;const sc=s.schedules.find(x=>x.weekday===wd);if(!sc||!sc.ip_time)continue;const hr=Math.floor(toMin(sc.ip_time)/60);out[hr]=(out[hr]||0)+1;}return out;}
function autoAssign(locId,wd,redo){
  const loc=locOf(locId);if(!loc)return{assigned:0,failed:[]};const slots=slotsOf(loc);const teachers=teachersOf(locId);if(!teachers.length)return{assigned:0,failed:[],reason:'강사 없음'};
  const cap=Math.max(1,num(loc.max_per_hour,8));const lead=num(loc.lead_min,45);const maxWait=lead+60;
  const all=S.students.filter(s=>s.status==='ACTIVE'&&s.location_id===locId).map(s=>({s,sc:s.schedules.find(x=>x.weekday===wd)})).filter(x=>x.sc&&x.sc.time);
  if(redo)for(const x of all){x.sc.ip_time=null;x.sc.teacher_id=null;}
  const todo=all.filter(x=>!x.sc.ip_time||!x.sc.teacher_id).sort((a,b)=>toMin(a.sc.time)-toMin(b.sc.time)||a.s.name.localeCompare(b.s.name,'ko'));
  const busy={};const hour={};for(const x of all)if(x.sc.ip_time&&x.sc.teacher_id){busy[x.sc.teacher_id+'@'+x.sc.ip_time]=true;const hr=Math.floor(toMin(x.sc.ip_time)/60);hour[hr]=(hour[hr]||0)+1;}
  let assigned=0;const failed=[];
  for(const x of todo){const arr=toMin(x.sc.time);let done=false;
    for(const sl of slots){const m=toMin(sl);if(m<arr+lead)continue;if(m>arr+maxWait)break;const hr=Math.floor(m/60);if((hour[hr]||0)>=cap)continue;
      const pref=teachers.find(t=>t.id===x.s.homeroom_teacher_id);const order=pref?[pref,...teachers.filter(t=>t.id!==pref.id)]:teachers;
      const t=order.find(t=>!busy[t.id+'@'+sl]);if(!t)continue;
      x.sc.ip_time=sl;x.sc.teacher_id=t.id;busy[t.id+'@'+sl]=true;hour[hr]=(hour[hr]||0)+1;assigned++;done=true;break;}
    if(!done)failed.push(x.s.name+' (등원 '+x.sc.time+')');}
  return{assigned,failed,cap};
}
function freeSlots(locId,wd){const tt=timetable(locId,wd);const out=[];for(const t of tt.teachers)for(const sl of tt.slots)if(!tt.cells[t.id][sl])out.push({teacher:t,slot:sl});return out;}

// --- 랭킹 (세션 기록에서 파생되는 포인트 · 성장 맵 티어) ---
function tierOf(s){const trs=activeTracks(s.id);let best=null;const def=defaultTrack(s);const order=def?[def,...trs.filter(t=>t.id!==def.id)]:trs;for(const t of order){const g=gridOf(bookOf(t));if(g.length){best=g[0].level;break;}}if(best==null)for(const t of trs){const g=gridOf(bookOf(t));if(g.length)best=Math.max(best||0,g[0].level);}return best?levelsOf().find(L=>L.no===best):null;}
const POINT_L={unit:'Unit 완료',hw:'숙제',online:'온라인 학습',vocab:'단어 통과',test:'성취테스트 PASS',attitude:'수업태도 ★5',book:'원서 읽기',writing:'작품'};
function sessionPoints(x){
  const P=S.meta.points||{};const d={unit:0,hw:0,online:0,vocab:0,test:0,attitude:0,book:0,writing:0};
  if(x.original_book_title||x.original_book_id)d.book+=num(P.book_read,5);if(x.attitude===5)d.attitude+=num(P.attitude5,2);
  for(const a of x.activities){const bk=byId(S.books,a.book_id);
    if(a.activity_type==='INDIVIDUAL_PROGRESS'){if(a.status==='COMPLETED'||a.status==='REPEAT')d.unit+=num(P.unit_done,10);if(a.work)d.writing+=num(P.writing_piece,5);}
    if(a.activity_type==='HOMEWORK_CHECK'&&(a.status==='COMPLETED'||a.status==='REPEAT')){if(bk&&bk.category==='VOCAB')d.online+=num(P.online_done,2);else d.hw+=num(P.hw_done,3);}
    if(a.activity_type==='VOCAB_TEST'){if(a.result==='PASS')d.vocab+=num(P.vocab_pass,5);else if(a.result==='CHECK')d.vocab+=num(P.vocab_check,2);}}
  for(const ct of S.completion_tests)if(ct.student_id===x.student_id&&ct.status==='PASS'&&ct.taken_at===x.session_date)d.test+=num(P.test_pass,50);
  d.total=Object.values(d).reduce((a,b)=>a+b,0);return d;
}
function pointsText(d){return Object.keys(POINT_L).filter(k=>d[k]).map(k=>POINT_L[k]+' '+d[k]).join(' · ');}
function pointsOf(sid,ym){
  const d={unit:0,hw:0,online:0,vocab:0,test:0,attitude:0,book:0,writing:0};
  for(const x of sessionsOf(sid)){if(ymOf(x.session_date)!==ym)continue;const e=sessionPoints(x);for(const k of Object.keys(d))d[k]+=e[k];}
  d.total=Object.values(d).reduce((a,b)=>a+b,0);return d;
}
function rankingOf(ym,loc){const rows=S.students.filter(s=>s.status==='ACTIVE'&&(!loc||s.location_id===loc)).map(s=>({s,tier:tierOf(s),p:pointsOf(s.id,ym),prev:pointsOf(s.id,ymOf(addDays(ym+'-01',-1))).total})).sort((a,b)=>b.p.total-a.p.total||a.s.name.localeCompare(b.s.name,'ko'));let r=0,last=null;rows.forEach((x,i)=>{if(x.p.total!==last){r=i+1;last=x.p.total;}x.rank=r;});return rows;}
function viewRank(q){
  const cur=todayISO().slice(0,7);const months=[...new Set([...S.sessions.map(x=>ymOf(x.session_date)),cur])].sort().reverse();const ym=q.ym&&months.includes(q.ym)?q.ym:(months[0]||cur);const loc=q.loc||'';
  const rows=rankingOf(ym,loc);const P=S.meta.points||{};const rs=(S.meta.tools||{}).rank_system;

// --- 데스크 랭크 보드 (기존 EPL RANK SYSTEM 화면 재현) ---
function posOf(s){const trs=activeTracks(s.id);const def=defaultTrack(s);const order=def?[def,...trs.filter(t=>t.id!==def.id)]:trs;for(const t of order){const g=gridOf(bookOf(t));if(g.length)return{level:g[0].level,season:g[0].season};}let best=null;for(const t of trs){const g=gridOf(bookOf(t));if(g.length&&(!best||g[0].level>best.level))best={level:g[0].level,season:g[0].season};}return best;}
function recentRankUps(days){const since=addDays(todayISO(),-(days||14));const out=[];for(const s of S.students){if(s.status!=='ACTIVE')continue;const now=posOf(s);if(!now)continue;const ended=S.tracks.filter(t=>t.student_id===s.id&&!t.active&&t.status==='COMPLETED'&&t.ended_at&&t.ended_at>=since);for(const t of ended){const g=gridOf(bookOf(t));if(g.length&&g[0].level<now.level){out.push({s,from:g[0].level,to:now.level,date:t.ended_at});break;}}}return out.sort((a,b)=>b.date.localeCompare(a.date));}
function viewBoard(q){
  const loc=q.loc||'';const rows=S.students.filter(s=>s.status==='ACTIVE'&&(!loc||s.location_id===loc)).map(s=>({s,pos:posOf(s)})).filter(x=>x.pos);
  const ups=recentRankUps(14);const upIds=new Set(ups.map(u=>u.s.id));const icons={1:'✦',2:'▣',3:'✎',4:'◆',5:'♛'};const cls={1:'t1',2:'t2',3:'t3',4:'t4',5:'t5'};
  const tier=L=>{const list=rows.filter(x=>x.pos.level===L.no).sort((a,b)=>b.pos.season-a.pos.season||a.s.name.localeCompare(b.s.name,'ko'));
    return '<div class="bd-tier '+cls[L.no]+'"><div class="bd-tl"><div class="bd-no">'+String(L.no).padStart(2,'0')+'</div><div class="bd-ic">'+icons[L.no]+'</div><div class="bd-nm">'+h(L.name.toUpperCase())+'</div></div><div class="bd-cards">'+(list.length?list.map(x=>'<div class="bd-card'+(upIds.has(x.s.id)?' up':'')+'"><div class="bd-ring">'+icons[L.no]+'</div><div class="bd-name">'+h(x.s.name)+'</div><div class="bd-pos">'+x.pos.level+'-'+x.pos.season+'</div></div>').join(''):Array.from({length:4}).map(()=>'<div class="bd-card empty"><div class="bd-ring">'+icons[L.no]+'</div></div>').join(''))+'</div></div>';};
  const up=ups[0];
  return '<div class="bd"><div class="bd-top"><div class="bd-live">● LIVE · '+h(nameOf(S.locations,loc)||'전체')+' · <span id="bd_clock">'+new Date().toTimeString().slice(0,5)+'</span></div><div class="bd-title"><span class="bd-crown">♛</span> EPL <span class="bd-white">RANK SYSTEM</span></div><div class="bd-sub">READ · BUILD · EXPRESS · CREATE · INSPIRE</div></div>'+
  levelsOf().slice().reverse().map(tier).join('')+
  '<div class="bd-foot"><div class="bd-ticker">🏆 <span class="bd-rl">RECENT RANK-UP</span> '+(up?'<b>'+h(up.s.name)+'</b> 학생이 <b>'+h((levelsOf().find(L=>L.no===up.to)||{}).name||'').toUpperCase()+'</b> 등급으로 승급했습니다':'이번 2주 승급 없음 — 다음 승급자를 기다립니다')+'</div><div class="bd-brand">EPL · EMPOWER · PRACTICE · LITERACY</div></div>'+
  '<div class="bd-ctl noprint"><a href="#/board" class="'+(loc?'':'on')+'">전체</a>'+S.locations.map(l=>'<a href="#/board?loc='+l.id+'" class="'+(loc===l.id?'on':'')+'">'+h(l.name)+'</a>').join('')+'<a href="#/rank">포인트 랭킹</a><a href="#/home">OS로 돌아가기</a></div></div>';
}

// --- 라이팅 사진 (IndexedDB, 기기 로컬 · DB 전환 시 Storage로 이전) ---
const PENDING_PHOTOS={};
function photoDB(){return new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return res(null);const r=indexedDB.open('epl_photos',1);r.onupgradeneeded=()=>{r.result.createObjectStore('photos');};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});}
async function putPhoto(id,blob){const db=await photoDB();if(!db)return false;return new Promise(res=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);});}
async function getPhoto(id){const db=await photoDB();if(!db)return null;return new Promise(res=>{const tx=db.transaction('photos','readonly');const q=tx.objectStore('photos').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}
function shrinkImage(file,max){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,(max||1200)/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);res(b||file);},'image/jpeg',0.82);};img.onerror=()=>res(file);img.src=url;});}
async function hydratePhotos(){const els=document.querySelectorAll('img[data-photo]');for(const el of els){const id=el.dataset.photo;if(!id||el.src)continue;const b=await getPhoto(id);if(b)el.src=URL.createObjectURL(b);else el.alt='사진 없음(다른 기기에 저장됨)';}}
const photoTag=(id,cls)=>id?'<img data-photo="'+h(id)+'" class="'+(cls||'wphoto')+'" alt="오늘 쓴 글">':'';

function reviewDue(t){const b=bookOf(t);const n=num(b.review_every,0);if(!n||!t.current_unit_id)return null;const u=unitById(b,t.current_unit_id);if(!u||u.seq_no%n!==0)return null;const from=u.seq_no-n+1,to=u.seq_no;const range=b.unit_label+' '+from+'-'+to;const done=S.sessions.some(x=>x.student_id===t.student_id&&x.activities.some(a=>a.track_id===t.id&&a.kind==='REVIEW'&&a.range===range));return done?null:range;}

function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2800);}
function opt(list,val,label,valOf){label=label||(x=>x.name);valOf=valOf||(x=>x.id);return list.map(x=>'<option value="'+h(valOf(x))+'"'+(valOf(x)===val?' selected':'')+'>'+h(label(x))+'</option>').join('');}
const badge=(cls,txt)=>'<span class="badge '+cls+'">'+h(txt)+'</span>';
function qstr(o){return Object.entries(o).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');}
const ACT_KEY={HOMEWORK_CHECK:'HW',INDIVIDUAL_PROGRESS:'IP',VOCAB_TEST:'VT',WRITING:'WR'};
const MARK={COMPLETED:'✓',REPEAT:'✓↻',PARTIAL:'△',NOT_DONE:'✗',REVIEW:'↺'};
function actSummary(a){const b=byId(S.books,a.book_id);const u=a.custom_name?a.custom_name:a.kind==='REVIEW'?'Review('+(a.range||'')+')':(b?unitShort(b,a.unit_id):'—');const k=ACT_KEY[a.activity_type]||a.activity_type;if(a.activity_type==='VOCAB_TEST')return k+' '+u+' '+(a.pct!=null?a.pct+'% '+a.result:'—');return k+' '+u+' '+(MARK[a.status]||'')+(a.lesson_note?' '+a.lesson_note:'');}
function lastActivity(sid,tid){const ss=sessionsOf(sid);for(let i=ss.length-1;i>=0;i--){const a=ss[i].activities.find(x=>x.track_id===tid);if(a)return a;}return null;}
function slotData(sid){

}

const notFound=(w)=>'<div class="empty">'+h(w)+'을(를) 찾을 수 없습니다.</div>';
const stars=n=>n?'★'.repeat(n)+'☆'.repeat(Math.max(0,5-n)):'';

function bookOptionsGrouped(val){return CATS.map(c=>{const bs=S.books.filter(b=>b.category===c&&b.active);if(!bs.length)return '';return '<optgroup label="'+CAT_L[c]+'">'+opt(bs,val,b=>b.book_name)+'</optgroup>';}).join('');}
function unitOptions(b,val,withNone){return (withNone?'<option value="">시작 전 (Unit 1부터)</option>':'')+opt(unitsOf(b),val,u=>u.unit_name);}
function nextUnitOptions(b,nextId){return opt(unitsOf(b),nextId||'',u=>u.unit_name)+'<option value="__done"'+(nextId?'':' selected')+'>교재 완료 (Completion Test 대기)</option>';}
function bookDatalist(){const titles=new Set(S.original_books.filter(b=>b.active!==false).map(b=>b.title));for(const s of S.sessions)if(s.original_book_title)titles.add(s.original_book_title);return '<datalist id="bookList">'+[...titles].sort().map(t=>'<option value="'+h(t)+'">').join('')+'</datalist>';}

  '<tr><td>원서 · AR</td><td colspan="4">AR <b>'+h(s.ar_level)+'</b>'+(lastAR?' <span class="note">('+h(lastAR.date)+' 테스트)</span>':'')+(lastNELT?' · NELT '+h(lastNELT.level||'')+' '+h(lastNELT.score!=null?lastNELT.score:'')+' <span class="note">('+h(lastNELT.date)+')</span>':'')+(last?' · 최근 원서 '+h(last.original_book_title||nameOf(S.original_books,last.original_book_id)||'—')+' ('+h(last.session_date)+')':'')+'</td></tr>'+
