  const v=(x,suf)=>x==null?'—':x+(suf||'');
  const rows=[
    ['재원생 (신규 · 퇴원)',d=>cell(d,d.m.active+' <span class="note">(+'+d.m.enrolled+' / −'+d.m.withdrawn+')</span>','active',d.b.active)],
    ['출석 · 보강 처리율',d=>cell(d,v(d.m.makeupRate,'%')+' <span class="note">결석 '+d.m.absences+'</span>','makeup',d.b.makeupRate==null?null:d.b.makeupRate+'%')],
    ['세션 기록 · 알림장 완료율',d=>cell(d,v(d.m.completeRate,'%')+' <span class="note">'+d.m.completed+'/'+d.m.expected+'</span>','complete',d.b.completeRate==null?null:d.b.completeRate+'%')],
    ['학습 성과',d=>cell(d,'Unit '+d.m.units+' · 교재 완료 '+d.m.levelMoves+'<div class="note">AR '+v(d.m.arAvg)+' · 라이팅 '+v(d.m.writingAvg)+'</div>','perf',d.b.units==null?null:'Unit '+d.b.units)],
    ['학부모 문의 · 불만',d=>cell(d,d.m.inquiries+' · '+d.m.complaints,'inq',(d.b.inquiries==null&&d.b.complaints==null)?null:(d.b.inquiries||0)+' · '+(d.b.complaints||0))],
    ['예외 미처리 · 기한 초과',d=>cell(d,d.m.openAlerts+' · '+d.m.overdue,'overdue',null)]
  ];
  const flagsAll=data.flatMap(d=>Object.values(d.f));
  return '<div class="bar"><div><h1>주간 대시보드</h1><p class="sub" style="margin:0">'+h(ws)+' ~ '+h(addDays(ws,6))+' · 평소 범위 = 직전 4주 중앙값 · 범위를 벗어난 칸만 색이 붙습니다.</p></div><span class="sp"></span><label class="f">주<input type="date" class="hq" data-k="week" value="'+ws+'"></label><a class="btn" href="#/dashboard?week='+addDays(ws,-7)+'">◀ 지난주</a><a class="btn" href="#/dashboard?week='+addDays(ws,7)+'">다음주 ▶</a></div>'+
  (flagsAll.length?'<div class="ban">이번 주 봐야 할 것: '+flagsAll.map(h).join(' · ')+'</div>':'<div class="panel" style="border-color:var(--good)"><span class="badge b-good">평소 범위</span> <span class="note">숫자가 모두 평소 범위 안입니다. 승인함만 확인하면 됩니다.</span></div>')+
  '<div class="panel tw"><table class="t"><thead><tr><th></th>'+cols.map(c=>'<th>'+h(c.name)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(([label,fn])=>'<tr><td><b>'+label+'</b></td>'+data.map(fn).join('')+'</tr>').join('')+'</tbody></table></div>'+
  '<div class="bar"><a class="btn p" href="#/approvals">승인 대기함 '+S.approvals.filter(a=>!a.decision).length+'</a><a class="btn" href="#/alerts?f=INCOMPLETE">완료 기준 미충족</a><a class="btn" href="#/alerts">예외 처리함</a><a class="btn" href="#/reports">월간 리포트</a></div>'+
  directorLists(q.loc||'');
}
// 원장 리스트: 숙제 미제출 누적 · 테스트 재검사 시기
function directorLists(loc){
  const RD=S.rules.HW_MISS_DIRECTOR||{count:3,days:30};const hw=hwMissReport(num(RD.days,30),loc);const due=testDueReport(loc);const RT=S.rules.TEST_DUE||{};
  const hwRows=hw.map(r=>'<tr><td><a href="#/student/'+r.s.id+'"><b>'+h(r.s.name)+'</b></a><div class="note">'+h(nameOf(S.locations,r.s.location_id))+' · '+h(nameOf(S.teachers,r.s.homeroom_teacher_id))+'</div></td><td><b style="color:var(--bad)">'+r.miss.length+'회</b></td><td class="note">'+r.miss.slice(-5).map(m=>h(m.date.slice(5))+' '+h(m.book)).join(' · ')+(r.miss.length>5?' …':'')+'</td><td>'+(r.alert?(r.alert.status==='REPORTED'?badge('b-brass','보고됨'):badge('b-warn','담임 처리 중')):badge('b-muted','규칙 평가 전'))+'</td></tr>').join('');
  const dueRows=due.map(d=>'<tr><td><a href="#/student/'+d.s.id+'"><b>'+h(d.s.name)+'</b></a><div class="note">'+h(nameOf(S.locations,d.s.location_id))+' · '+h(nameOf(S.teachers,d.s.homeroom_teacher_id))+'</div></td><td>'+badge(d.kind==='RTP'?'b-brass':'b-info',d.kind)+'</td><td>'+(d.last?h(d.last)+' <span class="note">('+d.monthsAgo+'개월 전)</span>':'<span class="note">기록 없음 · 등원 '+h(d.s.enrolled_at||'')+'</span>')+'</td></tr>').join('');
  return '<div class="grid g2"><div class="panel"><h2>숙제 미제출 '+num(RD.count,3)+'회 이상 <span class="note">최근 '+num(RD.days,30)+'일 · '+hw.length+'명</span></h2>'+(hw.length?'<div class="tw"><table class="t"><thead><tr><th>학생</th><th>횟수</th><th>최근 미제출</th><th>상태</th></tr></thead><tbody>'+hwRows+'</tbody></table></div>':'<p class="note">해당 학생 없음.</p>')+'<p class="note" style="margin-top:8px">기준은 설정 → 판정·예외 기준(HW_MISS_DIRECTOR)에서 바꿉니다. 담임에게는 "숙제 미제출 누적 (원장 보고)" 예외로 올라가고, 담임이 통화 후 보고하면 결정함에 들어옵니다.</p></div>'+
  '<div class="panel"><h2>RTP · NELT 재검사 시기 <span class="note">RTP '+num(RT.rtp_months,3)+'개월 · NELT '+num(RT.nelt_months,3)+'개월 · '+due.length+'건</span></h2>'+(due.length?'<div class="tw" style="max-height:320px;overflow:auto"><table class="t"><thead><tr><th>학생</th><th>테스트</th><th>마지막 테스트</th></tr></thead><tbody>'+dueRows+'</tbody></table></div>':'<p class="note">재검사 시기가 된 학생이 없습니다.</p>')+'<p class="note" style="margin-top:8px">담임의 오늘 화면과 할 일에 같은 알림이 뜹니다. 학생 상세 → 평가 기록에 결과를 입력하면 자동으로 해결됩니다. RTP는 AR 기록도 같은 레벨테스트로 봅니다.</p></div></div>';
}


// --- 교재 지급 · 재고 (담당 선생님별) ---
const ISSUE_ST={PLANNED:'안내 예정',ISSUED:'지급 (결제 안내 대기)',NOTIFIED:'결제 안내함',PAID:'입금 확인'};
const ISSUE_BG={PLANNED:'var(--warn-soft)',ISSUED:'var(--surface-2)',NOTIFIED:'var(--brass-soft)',PAID:'var(--paid-soft)'};
function payNotice(it){const s=studentOf(it.student_id),b=byId(S.books,it.book_id);return fillTemplate(S.meta.pay_template||DEFAULT_PAY_TEMPLATE,{학원:S.meta.academy_name||'EPL 영어학원',학생:s?s.name:'',교재:(b?b.book_name:'')+(it.qty>1?' '+it.qty+'권':''),금액:it.price!=null?won(it.price*it.qty):'',계좌:S.meta.bank_account||'',지급일:fmtDateK(it.date)});}
const won=n=>n==null||n===''?'':Number(n).toLocaleString()+'원';
function issuesOf(sid,bookId){return S.issues.filter(i=>i.student_id===sid&&(!bookId||i.book_id===bookId));}
function studentNeeds(sid){return activeTracks(sid).map(t=>({t,b:bookOf(t)})).filter(x=>x.b&&!S.issues.some(i=>i.student_id===sid&&i.book_id===x.b.id&&i.status!=='PLANNED'));}
function issueNeeds(loc){const out=[];for(const s of S.students){if(s.status!=='ACTIVE'||(loc&&s.location_id!==loc))continue;for(const t of activeTracks(s.id)){const b=bookOf(t);if(!b)continue;if(S.issues.some(i=>i.student_id===s.id&&i.book_id===b.id&&i.status!=='PLANNED'))continue;out.push({s,t,b,planned:S.issues.find(i=>i.student_id===s.id&&i.book_id===b.id&&i.status==='PLANNED')||null});}}return out.sort((a,b)=>(a.s.homeroom_teacher_id||'').localeCompare(b.s.homeroom_teacher_id||'')||a.s.name.localeCompare(b.s.name,'ko'));}
function stockOf(bookId,teacherId){const r=S.stock.find(x=>x.book_id===bookId&&(x.teacher_id||'')===(teacherId||''));return r?num(r.qty,0):0;}
function setStock(bookId,teacherId,qty){let r=S.stock.find(x=>x.book_id===bookId&&(x.teacher_id||'')===(teacherId||''));if(!r){r={book_id:bookId,teacher_id:teacherId||'',qty:0};S.stock.push(r);}r.qty=num(qty,0);return r;}
function issueBook(sid,bookId,teacherId,status,qty,price,date,note){const s=studentOf(sid),b=byId(S.books,bookId);if(!s||!b)return null;
  let it=S.issues.find(i=>i.student_id===sid&&i.book_id===bookId&&i.status==='PLANNED');
  if(!it){it={id:uid('is'),student_id:sid,book_id:bookId,teacher_id:teacherId||s.homeroom_teacher_id||null,date:date||todayISO(),qty:Math.max(1,num(qty,1)),price:price==null||price===''?(b.price!=null?b.price:null):num(price),status:'PLANNED',note:note||''};S.issues.push(it);}
  else{if(teacherId)it.teacher_id=teacherId;it.date=date||it.date;it.qty=Math.max(1,num(qty,it.qty));if(price!=null&&price!=='')it.price=num(price);if(note)it.note=note;}
  if(status!=='PLANNED'&&it.status==='PLANNED'){const holder=it.teacher_id||'';const cur=stockOf(bookId,holder);if(cur>0||S.stock.some(x=>x.book_id===bookId&&(x.teacher_id||'')===holder))setStock(bookId,holder,cur-it.qty);}
  it.status=status||'PLANNED';return it;}
function viewBooks(q){
  const tab=q.tab||'need';const loc=q.loc||'';const me=currentUser();const tch=q.tch||'';
  const teachers=S.teachers.filter(t=>t.role!=='DIRECTOR');const holders=[...teachers,{id:'',name:'공용'}];

  const tabs='<div class="tabs" style="margin:0">'+[['need','지급 대기'],['pay','결제 안내 (실장)'],['stock','재고'],['log','지급 기록 (월별)']].map(([k,l])=>'<a href="#/books?tab='+k+(loc?'&loc='+loc:'')+(tch?'&tch='+tch:'')+'" class="'+(tab===k?'on':'')+'">'+l+(k==='need'?' '+issueNeeds(loc).length:k==='pay'?' '+S.issues.filter(i=>i.status==='ISSUED'||i.status==='NOTIFIED').length:'')+'</a>').join('')+'</div>';
  let body='';
  if(tab==='need'){const needs=issueNeeds(loc).filter(x=>!tch||x.s.homeroom_teacher_id===tch);
    body=needs.length?'<div class="tw"><table class="t"><thead><tr><th>담임</th><th>학생</th><th>교재</th><th>시작</th><th>담당 재고</th><th>수량 · 가격 · 지급일</th><th></th></tr></thead><tbody>'+needs.map(x=>{const hid=x.s.homeroom_teacher_id||'';const st=stockOf(x.b.id,hid),sh=stockOf(x.b.id,'');const k=x.s.id+'_'+x.b.id;return '<tr'+(x.planned?' style="background:var(--warn-soft,rgba(200,140,40,.08))"':'')+'><td>'+h(nameOf(S.teachers,x.s.homeroom_teacher_id))+'</td><td><a href="#/student/'+x.s.id+'"><b>'+h(x.s.name)+'</b></a>'+(x.planned?'<div class="note">안내 예정 '+h(x.planned.date)+'</div>':'')+'</td><td>'+h(x.b.book_name)+'<div class="note">'+CAT_S[x.b.category]+(x.b.price!=null?' · '+won(x.b.price):'')+'</div></td><td class="note">'+h(x.t.started_at||'')+'</td><td>'+(st>0?badge('b-good',st+'권'):sh>0?badge('b-muted','공용 '+sh+'권'):badge('b-bad','없음'))+'</td><td style="white-space:nowrap"><input type="number" id="iq_'+k+'" value="'+(x.planned?x.planned.qty:1)+'" min="1" style="width:52px"> <input type="number" id="ip_'+k+'" value="'+h(x.planned&&x.planned.price!=null?x.planned.price:(x.b.price!=null?x.b.price:''))+'" placeholder="가격" step="500" style="width:80px"> <input type="date" id="id_'+k+'" value="'+todayISO()+'"></td><td style="white-space:nowrap">'+(x.planned?'':'<button class="btn s" data-act="issue" data-sid="'+x.s.id+'" data-book="'+x.b.id+'" data-st="PLANNED">안내 예정</button> ')+'<button class="btn s p" data-act="issue" data-sid="'+x.s.id+'" data-book="'+x.b.id+'" data-st="ISSUED">지급</button></td></tr>';}).join('')+'</tbody></table></div><div class="bar" style="margin-top:10px"><button class="btn" data-act="issueAllExisting" data-loc="'+loc+'" data-tch="'+tch+'">이 목록 전부 "이미 받음"으로 정리 ('+needs.length+'건)</button><span class="note">처음 시작할 때 한 번 — 예전에 이미 준 교재를 재고 차감 없이 지급 완료로 표시합니다.</span></div><p class="note">학생에게 교재가 설정되면 자동으로 여기에 올라오고, 지급을 누르면 담당 선생님 재고에서 빠지고 <b>결제 안내</b> 탭(실장)으로 넘어갑니다. 가격은 교재 편집(커리큘럼)에서 기본값을 넣어 두면 자동으로 채워집니다.</p>':'<div class="empty">지급할 교재가 없습니다. 모든 재원생이 교재를 받았습니다.</div>';}
  else if(tab==='pay'){const its=S.issues.filter(i=>(i.status==='ISSUED'||i.status==='NOTIFIED')).map(i=>({i,s:studentOf(i.student_id),b:byId(S.books,i.book_id)})).filter(x=>x.s&&(!loc||x.s.location_id===loc)&&(!tch||x.s.homeroom_teacher_id===tch)).sort((a,b)=>(a.i.status===b.i.status?0:a.i.status==='ISSUED'?-1:1)||(a.i.date||'').localeCompare(b.i.date||''));
    const wait=its.filter(x=>x.i.status==='ISSUED'),sent=its.filter(x=>x.i.status==='NOTIFIED');const sum=its.reduce((n,x)=>n+(x.i.price||0)*x.i.qty,0);

// ===== 5. actions, router, init =====
function route(){const raw=location.hash.replace(/^#\/?/,'')||'home';const i=raw.indexOf('?');const path=i<0?raw:raw.slice(0,i);const qs=i<0?'':raw.slice(i+1);const parts=path.split('/');const q={};if(qs)for(const kv of qs.split('&')){const j=kv.indexOf('=');const k=j<0?kv:kv.slice(0,j);const v=j<0?'':kv.slice(j+1);try{q[decodeURIComponent(k)]=decodeURIComponent(v);}catch(e){q[k]=v;}}return{name:parts[0]||'home',id:parts[1]||null,q};}
function nav(name,id,q){const hash='#/'+name+(id?'/'+id:'')+(q&&Object.keys(q).length?'?'+qstr(q):'');if(location.hash===hash)render();else location.hash=hash;}
function applyTheme(){const t=(S.meta&&S.meta.theme)||'auto';if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;}
function attachPhotos(sess,acts){for(const a of acts){if(!a.photo_blob)continue;const act=sess.activities.find(x=>x.track_id===a.track_id&&x.activity_type==='INDIVIDUAL_PROGRESS');if(!act)continue;const id=sess.id+':'+a.track_id;act.photo_id=id;putPhoto(id,a.photo_blob).then(ok=>{if(!ok)toast('사진 저장 실패');});}for(const k of Object.keys(PENDING_PHOTOS))delete PENDING_PHOTOS[k];persist();}
function readSchedules(prev){const days=[...document.querySelectorAll('.wd:checked')].map(x=>Number(x.value));const time=($('#sf_time')&&$('#sf_time').value)||'14:00';return days.map(weekday=>{const old=(prev||[]).find(x=>x.weekday===weekday)||{};return{weekday,time,ip_time:old.ip_time||null,teacher_id:old.teacher_id||null};});}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);toast('복사됨');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('복사됨');}catch(e){toast('복사하지 못했습니다. 직접 선택해 복사하세요.');}
  document.body.removeChild(ta);
}
function noticeTextOf(x){const ta=$('#nt_cm_'+x.id);return ta?ta.value:x.daily_comment;}
function noticeRows(date,loc){return S.sessions.filter(x=>x.session_date===date&&(!loc||x.location_id===loc)).map(x=>({x,s:studentOf(x.student_id)})).filter(r=>r.s).sort((a,b)=>{const ta=(a.s.schedules.find(y=>y.weekday===wdOf(date))||{}).time||'99',tb=(b.s.schedules.find(y=>y.weekday===wdOf(date))||{}).time||'99';return ta.localeCompare(tb)||a.s.name.localeCompare(b.s.name,'ko');});}


// --- in-page dialogs (native confirm/alert are blocked inside the artifact viewer) ---
function ask(msg,opts){opts=opts||{};return new Promise(res=>{let m=$('#modal');if(!m){m=document.createElement('div');m.id='modal';document.body.appendChild(m);}
  m.innerHTML='<div class="mbox" role="dialog" aria-modal="true"><div>'+h(msg)+'</div><div class="mbar">'+(opts.alert?'':'<button class="btn" id="mdNo">취소</button>')+'<button class="btn p" id="mdOk">'+(opts.alert?'확인':'계속')+'</button></div></div>';
  m.classList.add('on');const done=v=>{m.classList.remove('on');m.innerHTML='';document.removeEventListener('keydown',kd);res(v);};const kd=e=>{if(e.key==='Escape')done(false);if(e.key==='Enter')done(true);};document.addEventListener('keydown',kd);
  $('#mdOk').onclick=()=>done(true);const no=$('#mdNo');if(no)no.onclick=()=>done(false);m.onclick=e=>{if(e.target===m)done(false);};setTimeout(()=>$('#mdOk').focus(),30);});}
function say(msg){return ask(msg,{alert:true});}
const ACT={
  addStudent(){
    const name=$('#sf_name').value.trim();if(!name){toast('이름을 입력하세요.');$('#sf_name').focus();return;}
    const enr=($('#sf_enr')&&$('#sf_enr').value)||todayISO();const ar=num($('#sf_ar').value,0);
    const s={id:uid('s'),name,grade:($('#sf_grade')&&$('#sf_grade').value.trim())||'',guardian_phone:($('#sf_phone')&&$('#sf_phone').value.trim())||'',location_id:$('#sf_loc').value,ar_level:ar,enrolled_at:enr,homeroom_teacher_id:$('#sf_tch').value,status:'ACTIVE',default_track_id:null,map_done:{},schedules:readSchedules()};
    S.students.push(s);if(ar>0)S.assessments.push({id:uid('as'),student_id:s.id,kind:'AR',date:enr,score:ar,level:'',detail:'',note:'입회 시 입력'});
    let n=0;for(const cat of CATS){const sel=$('#sf_b_'+cat);if(!sel||!sel.value)continue;const b=byId(S.books,sel.value);if(!b)continue;const u=Math.max(1,Math.floor(num($('#sf_u_'+cat)&&$('#sf_u_'+cat).value,1)));const us=unitsOf(b);const nextU=us[Math.min(u,us.length)-1];const cur=nextU?prevUnitOf(b,nextU.id):null;const t=addTrack(s.id,b.id,cur?cur.id:null,defaultMode(cat),enr);if(t&&t.delivery_mode==='ACADEMY'&&!s.default_track_id)s.default_track_id=t.id;n++;}
    persist();toast('학생 추가'+(n?' · 교재 '+n+'권 설정됨':''));nav('student',s.id,n?{}:{edit:'tracks'});
  },
  saveStudent(el){

  async saveTracks(el){

    for(const row of rows){const ov=row.querySelector('.tf_ov');if(ov&&ov.value&&!row.querySelector('.tf_reason').value.trim()){toast('Override 이유를 입력하세요.');row.querySelector('.tf_reason').focus();return;}}
    const toCur=(b,v)=>v==='__done'?(lastUnit(b)?lastUnit(b).id:null):(v?(prevUnitOf(b,v)?prevUnitOf(b,v).id:null):null);
    for(const row of rows){const t=byId(S.tracks,row.dataset.tid);if(!t||!t.active||row.querySelector('.tf_end').checked)continue;if(row.querySelector('.tf_unit').value==='__done'&&t.next_unit_id){if(!await ask(bookOf(t).book_name+'을(를) "교재 완료"로 저장하면 Completion Test 대기 상태가 됩니다. 계속할까요?'))return;}}
    for(const row of news){const bookId=row.querySelector('.tf_book').value;const b=bookId?byId(S.books,bookId):null;if(b&&row.querySelector('.tf_unit').value==='__done'){if(!await ask(b.book_name+'을(를) "교재 완료"로 시작하면 바로 Completion Test 대기 상태가 됩니다. 계속할까요?'))return;}}
    const newIds={};

      const t=byId(S.tracks,row.dataset.tid);if(!t||!t.active)continue;
      if(row.querySelector('.tf_end').checked){endTrack(t,date);continue;}
      const unit=toCur(bookOf(t),row.querySelector('.tf_unit').value);const mode=t.category==='VOCAB'?'HOME':row.querySelector('.tf_mode').value;
      updateTrackState(t,unit,mode,date);
      const ov=row.querySelector('.tf_ov');if(ov&&ov.value&&t.active)overrideNext(t,ov.value,row.querySelector('.tf_reason').value.trim(),null,date);
    }
    for(const row of news){
      const bookId=row.querySelector('.tf_book').value;if(!bookId)continue;const b=byId(S.books,bookId);if(!b)continue;
      if(activeTracks(sid).some(t=>t.book_id===bookId)){toast(b.book_name+'은(는) 이미 진행 중입니다.');continue;}
      const unit=toCur(b,row.querySelector('.tf_unit').value);const mode=b.category==='VOCAB'?'HOME':row.querySelector('.tf_mode').value;

  async saveJpg(el){
    const st=$('#jpg_status');const say=m=>{if(st)st.textContent=m;};const src=$('#reportCard');if(!src){toast('리포트 카드가 없습니다.');return;}
    el.disabled=true;say('이미지를 만드는 중…');
    try{
      if(!window.html2canvas){await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('html2canvas 로드 실패'));document.head.appendChild(sc);});}
      let host=$('#captureHost');if(!host){host=document.createElement('div');host.id='captureHost';document.body.appendChild(host);}
      host.innerHTML='';const clone=src.cloneNode(true);clone.id='';host.appendChild(clone);
      const imgs=[...clone.querySelectorAll('img[data-photo]')];for(const im of imgs){const o=src.querySelector('img[data-photo="'+im.dataset.photo+'"]');if(o&&o.src)im.src=o.src;}
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;await new Promise(r=>setTimeout(r,60));
      const W=794,H=1123,SC=2;
      const c1=await html2canvas(clone,{scale:SC,backgroundColor:'#ffffff',useCORS:true,logging:false,width:W,windowWidth:W});
      const out=document.createElement('canvas');out.width=W*SC;out.height=H*SC;const g=out.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,out.width,out.height);
      const r=Math.min(1,out.height/c1.height);const dw=c1.width*r,dh=c1.height*r;g.drawImage(c1,0,0,c1.width,c1.height,(out.width-dw)/2,0,dw,dh);
      const s=studentOf(el.dataset.id);const name=(S.meta.academy_name||'EPL')+'_'+(s?s.name:'')+'_'+el.dataset.ym+'_리포트.jpg';
      const blob=await new Promise(res=>out.toBlob(res,'image/jpeg',0.92));host.innerHTML='';
      const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
      if(dl){try{await dl.save({filename:name,data:blob});}catch(e2){const c=e2&&e2.code;if(c==='declined'){say('저장을 취소했습니다.');return;}if(c==='rate_limited'){say('잠시 후 다시 눌러 주세요.');return;}throw e2;}}
      else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
      say('저장됨 · '+name+(r<1?' (내용이 길어 A4에 맞게 '+Math.round(r*100)+'%로 축소)':''));toast('JPG 저장');
    }catch(e){console.error(e);say('이미지 저장 실패: '+(e&&e.message||''));}
    finally{el.disabled=false;}
  },
  async aiPolish(el){
    const sid=el.dataset.id,ym=el.dataset.ym;const st=$('#ai_status');const memos={memo_s:$('#rp_ms').value.trim(),memo_i:$('#rp_mi').value.trim(),memo_p:$('#rp_mp').value.trim()};
    if(!memos.memo_s&&!memos.memo_i&&!memos.memo_p&&!await ask('메모가 비어 있습니다. 이 달의 기록만으로 작성할까요?'))return;
    if(st)st.textContent='AI가 이 달의 기록과 메모를 읽고 있습니다…';el.disabled=true;
    try{
      const sample=(window.claude&&window.claude.use)?await window.claude.use('sample'):null;
      if(!sample){if(st)st.textContent='이 화면에서는 AI 호출을 쓸 수 없습니다. 아래 "프롬프트 복사"로 바깥 Claude에 붙여넣어 주세요.';return;}
      const prompt=buildReportPrompt(sid,ym,memos);let out=null;
      try{out=await sample.json(prompt,{modelTier:'default',cache:false});}catch(e1){const r=await sample(prompt,{modelTier:'default',cache:false});out=parseReportJson(r&&r.text);}
      if(out&&typeof out==='object'&&!out.strengths&&(out.dev||out.parent))out={strengths:out.strengths||'',improve:out.dev||'',parents:out.parent||''};
      if(out&&out.dev!==undefined&&out.improve===undefined)out={strengths:out.strengths||'',improve:out.dev||'',parents:out.parent||out.parents||''};
      if(!out||!(out.strengths||out.improve||out.parents)){if(st)st.textContent='응답에서 세 항목을 찾지 못했습니다. 다시 눌러 보거나 프롬프트 복사를 쓰세요.';return;}
      if(out.strengths)$('#mr_s').value=out.strengths;if(out.improve)$('#mr_i').value=out.improve;if(out.parents)$('#mr_p').value=out.parents;
      if(st)st.textContent='완성됐습니다. 읽어보고 고친 뒤 "리포트 생성 & 저장"을 누르세요.';toast('AI 작성 완료');
    }catch(e){console.error(e);const code=e&&e.code;if(st)st.textContent=code==='not_granted'?'AI 사용 권한이 허용되지 않았습니다. 프롬프트 복사를 쓰세요.':code==='rate_limited'?'잠시 후 다시 시도해 주세요.':'AI 호출에 실패했습니다: '+(e&&e.message||'');}
    finally{el.disabled=false;}
  },

<script>

   EPL OS · GROWTH ARCHIVE 모듈  v0.1  (PHASE 1 데이터 연동 + PHASE 2 교사용 기록 시스템)
   READ → THINK → WRITE → REFLECT → GROW → PUBLISH

   - 세션 입력과 자동 연결: 원서 제목 → 독서 기록, 라이팅 사진·루브릭·작품 제목 → 작품

// ===== 3. 파일 계층 ============================================================
//  저장 위치(file.storage)
//   'db'    : 기존 epl_state 테이블의 행(id = ga:파일id:조각번호, base64 조각) — 추가 설정 없이 바로 동작
//   'cloud' : Supabase Storage 비공개 버킷 'epl-archive' — 버킷이 있으면 자동으로 이쪽을 쓴다 (대용량 권장)
//   'local' : 이 기기 IndexedDB에만 있음 (공유 저장소 미연결 또는 업로드 실패 → 연결되면 자동 업로드)
//  모든 파일은 이 기기 IndexedDB에 캐시되고, 다른 기기는 서버에서 한 번 받아 캐시한다.
const GA_URL_CACHE=new Map();   // file id → {url,exp}  (버킷 서명 URL)
const GA_OBJ_CACHE=new Map();   // file id → object URL (이 기기 blob)
const GA_DB_CHUNK=600*1024;     // 행 하나에 담는 base64 길이 (~450 KB)
const GA_DB_MAX=12*1024*1024;   // db 저장 최대 크기 (PDF)
let GA_BUCKET_OK=null;          // null 모름 · true 버킷 있음 · false 없음(db 저장)
function gaExt(mime){return mime==='application/pdf'?'pdf':mime==='image/png'?'png':mime==='image/webp'?'webp':'jpg';}
function gaKind(mime){return mime==='application/pdf'?'pdf':'image';}
function gaSizeK(n){return n==null?'':n>1024*1024?(Math.round(n/1024/1024*10)/10)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
function gaBlobToB64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(fr.error||new Error('파일 읽기 실패'));fr.readAsDataURL(blob);});}
function gaB64ToBlob(b64,mime){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime||'application/octet-stream'});}
const gaRowPrefix=f=>'ga:'+f.id+':';
// --- Storage 버킷 ---
async function gaBucketPut(file,blob){
  const r=await cloudFetch('/storage/v1/object/'+GA_BUCKET+'/'+file.path,{method:'POST',headers:{'Content-Type':file.mime,'x-upsert':'true'},body:blob});
  if(!r.ok){let t='';try{t=await r.text();}catch(e){}const missing=r.status===404||/bucket/i.test(t);if(missing)GA_BUCKET_OK=false;const err=new Error('버킷 업로드 실패 '+r.status+(t?' · '+t.slice(0,100):''));err.bucketMissing=missing;throw err;}
  GA_BUCKET_OK=true;return true;
}
async function gaSignBatch(files){
  files=files.filter(f=>f&&f.storage==='cloud');if(!files.length||!cloudAuthed())return;
  try{const r=await cloudFetch('/storage/v1/object/sign/'+GA_BUCKET,{method:'POST',body:JSON.stringify({expiresIn:3600,paths:files.map(f=>f.path)})});
    if(!r.ok){if(r.status===404)GA_BUCKET_OK=false;return;}const rows=await r.json();const base=cloudCfg().url.replace(/\/$/,'')+'/storage/v1';
    for(const row of (Array.isArray(rows)?rows:[])){if(!row.signedURL)continue;const f=files.find(x=>x.path===row.path);if(f)GA_URL_CACHE.set(f.id,{url:base+row.signedURL,exp:Date.now()+50*60*1000});}
  }catch(e){console.error(e);}
}
async function gaBucketCheck(force){
  if(!cloudAuthed())return null;if(GA_BUCKET_OK!=null&&!force)return GA_BUCKET_OK;
  try{const r=await cloudFetch('/storage/v1/object/list/'+GA_BUCKET,{method:'POST',body:JSON.stringify({prefix:gaAcademy(),limit:1,offset:0})});GA_BUCKET_OK=r.ok;}catch(e){GA_BUCKET_OK=null;}
  return GA_BUCKET_OK;
}
// --- epl_state 행 저장 (설정 불필요) ---
async function gaDbPut(file,blob){
  if(blob.size>GA_DB_MAX)throw new Error('파일이 너무 큽니다 ('+gaSizeK(blob.size)+'). 12 MB 이하로 올리거나 저장소 설정에서 버킷을 만드세요.');
  const b64=await gaBlobToB64(blob);const total=Math.max(1,Math.ceil(b64.length/GA_DB_CHUNK));
  for(let i=0;i<total;i++){const row={id:gaRowPrefix(file)+String(i).padStart(3,'0'),data:{kind:'archive_file',file_id:file.id,student_id:file.student_id,academy_id:file.academy_id,mime:file.mime,seq:i,total,b64:b64.slice(i*GA_DB_CHUNK,(i+1)*GA_DB_CHUNK)},version:1,updated_at:nowISO(),updated_by:'archive'};
    const r=await cloudFetch('/rest/v1/epl_state?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(row)});
    if(!(r.ok||r.status===201||r.status===204)){let t='';try{t=await r.text();}catch(e){}throw new Error('서버 저장 실패 '+r.status+(t?' · '+t.slice(0,100):''));}}
  file.chunks=total;return true;
}
async function gaDbGet(file){
  const r=await cloudFetch('/rest/v1/epl_state?id=like.'+encodeURIComponent(gaRowPrefix(file)+'*')+'&select=id,data&order=id.asc');
  if(!r.ok)return null;const rows=await r.json();if(!rows.length)return null;rows.sort((a,b)=>num(a.data.seq)-num(b.data.seq));
  try{return gaB64ToBlob(rows.map(x=>x.data.b64||'').join(''),file.mime);}catch(e){console.error(e);return null;}
}
async function gaDbDel(file){try{await cloudFetch('/rest/v1/epl_state?id=like.'+encodeURIComponent(gaRowPrefix(file)+'*'),{method:'DELETE'});}catch(e){console.error(e);}}
// --- 공통 ---
async function gaRemoteSave(file,blob){
  // 버킷이 있으면 버킷, 없으면 epl_state 행. 둘 다 실패하면 throw.
  if(GA_BUCKET_OK!==false){try{await gaBucketPut(file,blob);file.storage='cloud';delete file.pending;return 'cloud';}catch(e){if(!e.bucketMissing)console.error(e);GA_BUCKET_OK=false;}}
  await gaDbPut(file,blob);file.storage='db';delete file.pending;return 'db';
}
async function gaRemoveRemote(file){if(!cloudAuthed()||!file)return;if(file.storage==='db'){await gaDbDel(file);return;}if(file.storage==='cloud'){try{await cloudFetch('/storage/v1/object/'+GA_BUCKET+'/'+file.path,{method:'DELETE'});}catch(e){console.error(e);}}}
async function gaLocalUrl(f){if(GA_OBJ_CACHE.has(f.id))return GA_OBJ_CACHE.get(f.id);const b=await getPhoto(f.local_key||f.id);if(!b)return null;const u=URL.createObjectURL(b);GA_OBJ_CACHE.set(f.id,u);return u;}
async function gaRemoteBlob(f){
  // 다른 기기에서 올린 파일을 서버에서 받아 이 기기에 캐시한다
  if(!cloudAuthed())return null;let b=null,via=null;
  if(f.storage==='db'||f.storage==='local'){b=await gaDbGet(f);if(b)via='db';}
  if(!b&&(f.storage==='cloud'||f.storage==='local')&&GA_BUCKET_OK!==false){await gaSignBatch([Object.assign({},f,{storage:'cloud'})]);const c=GA_URL_CACHE.get(f.id);if(c){try{const r=await fetch(c.url);if(r.ok){b=await r.blob();via='cloud';}}catch(e){}}}
  if(b){await putPhoto(f.local_key||f.id,b);if(f.storage==='local'&&via){f.storage=via;delete f.pending;}}
  return b;
}
async function gaFileUrl(f){
  if(!f)return null;const l=await gaLocalUrl(f);if(l)return l;
  const c=GA_URL_CACHE.get(f.id);if(c&&c.exp>Date.now())return c.url;
  if(!cloudAuthed())return null;
  if(f.storage==='cloud'){await gaSignBatch([f]);const c2=GA_URL_CACHE.get(f.id);if(c2)return c2.url;}
  const b=await gaRemoteBlob(f);if(!b)return null;const u=URL.createObjectURL(b);GA_OBJ_CACHE.set(f.id,u);return u;
}
async function gaSaveFile(sid,blob,mime,name){
  gaEnsure(S);const id=uid('f');const file={id,academy_id:gaAcademy(),student_id:sid,kind:gaKind(mime),mime,size:blob.size,name:name||'',path:gaAcademy()+'/'+gaId(sid)+'/'+id+'.'+gaExt(mime),storage:'local',local_key:id,created_at:nowISO(),created_by:myId(null)};
  const ok=await putPhoto(id,blob);
  if(cloudAuthed()){try{await gaRemoteSave(file,blob);}catch(e){console.error(e);if(!ok)throw new Error('서버 저장과 기기 저장이 모두 실패했습니다. '+e.message);file.pending=true;toast('서버 저장 실패 · 이 기기에 보관, 연결되면 자동으로 올립니다 ('+e.message+')');}}
  else{if(!ok)throw new Error('이 기기에 파일을 저장할 수 없습니다 (브라우저 저장소 차단)');file.pending=true;}
  S.archive_files.push(file);return file;
}
async function gaSyncPending(){
  if(!cloudAuthed()||gaSyncPending._busy||!S.archive_files)return;gaSyncPending._busy=true;let n=0;
  try{for(const f of S.archive_files){if(f.storage==='cloud'||f.storage==='db')continue;const b=await getPhoto(f.local_key||f.id);if(!b)continue;try{await gaRemoteSave(f,b);n++;}catch(e){console.error(e);break;}}
    if(n){persist();toast('아카이브 파일 '+n+'개를 서버에 올렸습니다');if(route().name==='archive')render();}}
  finally{gaSyncPending._busy=false;}
}
async function gaHydrate(){
  const els=[...document.querySelectorAll('[data-gafile]')];if(!els.length)return;const need=[];
  for(const el of els){if(el.dataset.gaDone)continue;const f=gaFile(el.dataset.gafile);if(!f){gaSetUrl(el,null);continue;}
    const l=await gaLocalUrl(f);if(l){gaSetUrl(el,l);continue;}const c=GA_URL_CACHE.get(f.id);if(c&&c.exp>Date.now()){gaSetUrl(el,c.url);continue;}
    if(cloudAuthed())need.push({el,f});else gaSetUrl(el,null);}
  if(!need.length)return;
  const cloudFiles=[...new Map(need.filter(x=>x.f.storage==='cloud').map(x=>[x.f.id,x.f])).values()];await gaSignBatch(cloudFiles);
  for(const {el,f} of need){if(el.dataset.gaDone)continue;const c=GA_URL_CACHE.get(f.id);if(c){gaSetUrl(el,c.url);continue;}
    const b=await gaRemoteBlob(f);if(b){const u=URL.createObjectURL(b);GA_OBJ_CACHE.set(f.id,u);gaSetUrl(el,u);}else gaSetUrl(el,null);}
}
function gaSetUrl(el,url){el.dataset.gaDone='1';if(el.tagName==='IMG'){if(url)el.src=url;else{el.removeAttribute('src');const p=el.closest('.ga-fig');if(p)p.classList.add('ga-missing');}}else{if(url)el.dataset.url=url;else el.classList.add('ga-missing');}}

function gaIngestSession(sess){
  if(!sess||!sess.student_id)return false;gaEnsure(S);let changed=false;const sid=sess.student_id;
  // 4-1 원서 제목 → 독서 기록 (학생+제목당 1건, 읽은 날짜를 누적)
  let reading=null;const title=String(sess.original_book_title||'').trim();
  if(title){const rid='ar_'+gaId(sid)+'_'+(slug(title)||gaId(title)).slice(0,60);reading=gaReading(rid)||S.archive_readings.find(r=>r.student_id===sid&&normName(r.title)===normName(title))||null;
    if(!reading){const cat=gaCatalog(title);reading={id:rid,academy_id:gaAcademy(),student_id:sid,teacher_id:sess.teacher_id||null,location_id:sess.location_id||null,title:cat?cat.title:title,series:cat?(cat.series||''):'',ar_level:cat&&cat.ar_level!=null?cat.ar_level:null,status:'READING',date:sess.session_date,last_date:sess.session_date,done_date:null,dates:[sess.session_date],session_ids:[sess.id],tags:[],response:'',booktalk:'',booktalk_url:sess.recording_url||'',source:'SESSION',created_at:nowISO(),updated_at:nowISO()};S.archive_readings.push(reading);changed=true;}
    else{reading.session_ids=reading.session_ids||[];reading.dates=reading.dates||[];if(!reading.session_ids.includes(sess.id)){reading.session_ids.push(sess.id);changed=true;}if(!reading.dates.includes(sess.session_date)){reading.dates.push(sess.session_date);changed=true;}
      const ds=gaReadingDates(reading);if(reading.date!==ds[0]){reading.date=ds[0];changed=true;}if(reading.last_date!==ds[ds.length-1]){reading.last_date=ds[ds.length-1];changed=true;}
      if(sess.recording_url&&!reading.booktalk_url){reading.booktalk_url=sess.recording_url;changed=true;}if(changed)reading.updated_at=nowISO();}}
  // 4-2 라이팅 활동(사진·작품 제목·루브릭이 있는 것) → 작품 + 학생 원본 버전
  for(const a of (sess.activities||[])){
    if(a.activity_type!=='INDIVIDUAL_PROGRESS')continue;const b=byId(S.books,a.book_id);if(!b||b.category!=='WRITING')continue;
    if(!(a.photo_id||(a.work&&String(a.work).trim())||(a.rubric&&Object.values(a.rubric).some(v=>v!=null))))continue;
    const wid='aw_'+gaId(sess.id)+'_'+gaId(a.track_id||a.book_id);let w=gaWriting(wid);
    if(!w){const unit=a.unit_id?unitShort(b,a.unit_id):'';const wtitle=(a.work&&!/^https?:\/\//i.test(a.work))?String(a.work).trim():(b.book_name+(unit?' · '+unit:''));
      w={id:wid,academy_id:gaAcademy(),student_id:sid,teacher_id:sess.teacher_id||null,location_id:sess.location_id||null,date:sess.session_date,title:wtitle,project:'교재 작문',reading_id:reading?reading.id:null,book_title:reading?reading.title:'',session_id:sess.id,track_id:a.track_id||null,textbook:b.book_name+(unit?' '+unit:''),rubric:a.rubric?Object.assign({},a.rubric):null,checks:(a.evidence&&Array.isArray(a.evidence.ideas))?a.evidence.ideas.slice():[],evidence:a.evidence?Object.assign({},a.evidence):null,feedback:'',growth_comment:'',featured:null,approval:'NONE',approved_by:null,approved_at:null,reviewed_at:null,source:'SESSION',created_at:nowISO(),updated_at:nowISO()};
      S.archive_writings.push(w);gaVersionEnsure(wid,'ORIGINAL');changed=true;}
    else{if(!w.rubric&&a.rubric&&Object.values(a.rubric).some(v=>v!=null)){w.rubric=Object.assign({},a.rubric);changed=true;}if(!w.reading_id&&reading){w.reading_id=reading.id;w.book_title=reading.title;changed=true;}}
    if(a.photo_id){const fid='af_'+gaId(a.photo_id);let f=gaFile(fid)||S.archive_files.find(x=>x.local_key===a.photo_id);
      if(!f){f={id:fid,academy_id:gaAcademy(),student_id:sid,kind:'image',mime:'image/jpeg',size:null,name:'',path:gaAcademy()+'/'+gaId(sid)+'/'+fid+'.jpg',storage:'local',local_key:a.photo_id,pending:true,created_at:nowISO(),created_by:sess.teacher_id||null};S.archive_files.push(f);changed=true;}
      const v=gaVersionEnsure(wid,'ORIGINAL');if(!v.files.includes(f.id)){v.files.push(f.id);changed=true;}}
  }
  return changed;
}
function gaBackfill(){let n=0;for(const x of (S.sessions||[]))if(gaIngestSession(x))n++;return n;}
// 세션이 삭제되면(기록 수정) 그 세션에서 자동 생성된 아카이브 항목을 정리한다 — 교사가 손댄 작품은 남기고 연결만 푼다
function gaOnSessionDeleted(sess){
  if(!sess)return;gaEnsure(S);const sid=sess.student_id;
  for(const w of S.archive_writings.filter(x=>x.session_id===sess.id)){
    const touched=w.reviewed_at||w.featured||(w.approval&&w.approval!=='NONE')||w.feedback||w.growth_comment||gaHasContent(gaVersion(w.id,'REVISED'))||gaHasContent(gaVersion(w.id,'FINAL'));
    if(w.source==='SESSION'&&!touched){const vs=gaVersions(w.id);for(const v of vs)for(const fid of (v.files||[])){const used=S.archive_versions.some(o=>o.writing_id!==w.id&&(o.files||[]).includes(fid));if(!used)S.archive_files=S.archive_files.filter(f=>f.id!==fid);}
      S.archive_versions=S.archive_versions.filter(v=>v.writing_id!==w.id);S.archive_writings=S.archive_writings.filter(x=>x.id!==w.id);}
    else{w.session_id=null;w.updated_at=nowISO();}
  }
  const title=String(sess.original_book_title||'').trim();
  if(title){const r=S.archive_readings.find(x=>x.student_id===sid&&normName(x.title)===normName(title));
    if(r){r.session_ids=(r.session_ids||[]).filter(id=>id!==sess.id);const others=S.sessions.some(x=>x.id!==sess.id&&x.student_id===sid&&x.session_date===sess.session_date&&normName(x.original_book_title)===normName(title));
      if(!others)r.dates=(r.dates||[]).filter(d=>d!==sess.session_date);
      const empty=!(r.dates||[]).length&&!r.response&&!r.booktalk&&!(r.tags||[]).length&&r.status!=='DONE';
      if(empty&&r.source==='SESSION'){S.archive_readings=S.archive_readings.filter(x=>x.id!==r.id);for(const w of S.archive_writings)if(w.reading_id===r.id)w.reading_id=null;}
      else{const ds=gaReadingDates(r);r.date=ds[0]||r.date;r.last_date=ds[ds.length-1]||r.last_date;r.updated_at=nowISO();}}}
}
async function gaUploadLegacy(sess,acts){
  // 세션 입력에서 붙인 사진을 아카이브 파일로도 올린다 (blob이 손에 있는 지금이 유일한 기회)
  let changed=false;
  for(const a of acts){if(!a.photo_blob)continue;const act=sess.activities.find(x=>x.track_id===a.track_id&&x.activity_type==='INDIVIDUAL_PROGRESS');if(!act||!act.photo_id)continue;

  if(changed)persist();
}

function gaViewList(q){

  const tchRaw=q.tch!=null&&q.tch!==''?q.tch:(me&&me.role==='TEACHER'?me.id:'all');const tch=tchRaw==='all'?'':tchRaw;const kw=(q.kw||'').trim().toLowerCase();

function gaReadTags(prefix){const t=[...document.querySelectorAll('.'+prefix+':checked')].map(x=>x.value);const extra=$('#'+prefix+'_new');if(extra&&extra.value.trim())for(const x of extra.value.split(',').map(y=>y.trim()).filter(Boolean))if(!t.includes(x))t.push(x);return t;}
function gaProjectValue(selId,newId){const sel=$('#'+selId);if(!sel)return '';if(sel.value==='__new'){const n=$('#'+newId);return n?n.value.trim():'';}return sel.value;}
async function gaCollectFiles(fileList,sid){
  const out=[];for(const f of fileList){if(!f)continue;const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name||'');if(!isPdf&&!/^image\//.test(f.type||'')){toast('사진 또는 PDF만 올릴 수 있습니다: '+(f.name||''));continue;}
    if(isPdf){if(f.size>GA_MAX_FILE){toast('PDF가 너무 큽니다 (25 MB 이하): '+f.name);continue;}out.push({blob:f,mime:'application/pdf',name:f.name||'document.pdf'});}
    else{const b=await shrinkImage(f,1800);out.push({blob:b,mime:'image/jpeg',name:f.name||'photo.jpg'});}}
  return out;
}
