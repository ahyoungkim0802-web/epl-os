  '<div class="panel"><h2>사건 기록 (결석 · 문의 · 불만 · 휴원 · 퇴원)</h2>'+(()=>{const evs=S.events.filter(e=>e.student_id===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return (evs.length?'<div class="tw"><table class="t"><thead><tr><th>날짜</th><th>종류</th><th>내용</th><th>상태</th><th>담당</th></tr></thead><tbody>'+evs.slice(0,10).map(e=>'<tr><td style="white-space:nowrap">'+h(e.date)+'</td><td>'+badge(e.type==='COMPLAINT'||e.type==='WITHDRAW'?'b-bad':e.type==='ABSENCE'?'b-muted':'b-warn',EVENT_TYPES[e.type])+'</td><td>'+h(e.note)+(e.makeup_date?'<div class="note">보강 '+h(e.makeup_date)+'</div>':'')+'</td><td>'+(e.status==='DONE'?badge('b-good','완료'):'<a href="#/alerts">'+badge('b-warn','처리 중')+'</a>')+'</td><td class="note">'+h(nameOf(S.teachers,e.teacher_id))+'</td></tr>').join('')+'</tbody></table></div>':'<p class="note">기록 없음.</p>')+
  '<div class="row noprint" style="margin-top:10px;border-top:1px solid var(--line-2);padding-top:10px"><label class="f">종류<select id="ev_type">'+Object.entries(EVENT_TYPES).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></label><label class="f">날짜<input type="date" id="ev_date" value="'+todayISO()+'"></label><label class="f">강사<select id="ev_teacher">'+opt(S.teachers,myId(s.homeroom_teacher_id))+'</select></label><label class="f" style="flex:1;min-width:220px">한 줄 (사실만)<input type="text" id="ev_note" style="width:100%" placeholder="예: 독해 숙제 양이 많다는 어머니 전화"></label><button class="btn p" data-act="addEvent" data-id="'+s.id+'">기록</button></div><p class="note" style="margin:6px 0 0">기록하면 결정 권한표에 따라 예외 처리함에 들어갑니다 — 결석·문의는 강사 단독, 불만은 보고, 휴원·퇴원은 원장 결정.</p>';})()+'</div>'+
  '<div class="panel"><h2>평가 기록 (AR · NELT)</h2>'+(asl.length?'<div class="tw"><table class="t"><thead><tr><th>날짜</th><th>종류</th><th>점수 · 지수</th><th>레벨</th><th>영역별 · 메모</th><th></th></tr></thead><tbody>'+asl.map(a=>'<tr><td style="white-space:nowrap">'+h(a.date)+'</td><td>'+badge(a.kind==='AR'?'b-brass':a.kind==='NELT'?'b-info':'b-muted',a.kind)+'</td><td><b>'+h(a.score!=null?a.score:'—')+'</b></td><td>'+h(a.level||'')+'</td><td class="note">'+h([a.detail,a.note].filter(Boolean).join(' · '))+'</td><td><button class="btn s d" data-act="delAssess" data-id="'+a.id+'">삭제</button></td></tr>').join('')+'</tbody></table></div>':'<p class="note">아직 평가 기록이 없습니다. AR 테스트 지수와 NELT 결과를 여기에 쌓으면 차트의 추이가 됩니다.</p>')+
  '<div class="row noprint" style="margin-top:10px;border-top:1px solid var(--line-2);padding-top:10px"><label class="f">종류<select id="as_kind">'+ASSESS_KINDS.map(k=>'<option>'+k+'</option>').join('')+'</select></label><label class="f">날짜<input type="date" id="as_date" value="'+todayISO()+'"></label><label class="f">점수 · 지수<input type="text" id="as_score" placeholder="AR 2.4 / NELT 412" style="width:120px"></label><label class="f">레벨<input type="text" id="as_level" placeholder="NELT Level 4" style="width:120px"></label><label class="f" style="flex:1;min-width:200px">영역별 점수 · 메모<input type="text" id="as_detail" placeholder="Listening 78 · Reading 70 …" style="width:100%"></label><button class="btn p" data-act="addAssess" data-id="'+s.id+'">기록 추가</button></div></div>'+
  '<div class="grid g2"><div class="panel"><h2>성취테스트 상태</h2>'+(testRows?'<table class="t"><tbody>'+testRows+'</tbody></table>':'<p class="note">Completion Test가 있는 교재가 없습니다.</p>')+'</div>'+
  '<div class="panel"><h2>ALERTS</h2>'+(al.length?'<table class="t"><tbody>'+al.map(a=>'<tr><td>'+badge(SEV_CLS[a.severity]||'b-info',RULE_L[a.rule_code]||a.rule_code)+'</td><td>'+h(a.message)+'<div class="note">'+h(a.action)+' · '+h(a.created_at)+'</div></td><td style="white-space:nowrap">'+(a.status==='OPEN'?'<button class="btn s" data-act="ack" data-id="'+a.id+'">확인</button> ':'')+'<button class="btn s" data-act="resolve" data-id="'+a.id+'">해결</button></td></tr>').join('')+'</tbody></table>':'<p class="note">없음 — 정상 진행 중입니다.</p>')+'</div></div>'+
  '<div class="panel"><h2>진도 시트 (RECENT SESSIONS)</h2>'+(sess.length?'<div class="tw"><table class="t"><thead><tr><th>회차</th><th>날짜</th><th>원서</th><th>숙제</th><th>온라인</th><th>교재 · Lesson</th><th>단어 Test</th><th>태도</th><th>숙제 안내</th><th>알림장</th><th>강사</th></tr></thead><tbody>'+sess.slice(0,q.all?999:8).map(sessRow).join('')+'</tbody></table></div>'+(sess.length>8&&!q.all?'<p><a href="#/student/'+s.id+'?all=1">전체 '+sess.length+'회 보기</a></p>':''):'<p class="note">아직 세션 기록이 없습니다.</p>')+'</div>'+
  '<div class="panel"><h2>PROGRESS HISTORY</h2>'+(hist||'<p class="note">교재를 먼저 설정하세요.</p>')+'</div>';
}

// --- Session Entry ---
function seRow(n,title,body){return '<div class="srow"><div class="n">'+n+'</div><div><div class="ttl">'+title+'</div>'+body+'</div></div>';}
function chip(name,v,l,checked){return '<label class="chip-opt"><input type="radio" name="'+name+'" value="'+v+'"'+(checked?' checked':'')+'><span>'+l+'</span></label>';}
function hwRow(i,t,cands,custom){const n='st_hw_'+i;const isC=!t;const vocab=t&&t.category==='VOCAB';const b=t?bookOf(t):null;
  const sel='<select class="hwTrack" data-i="'+i+'">'+opt(cands,t?t.id:'',x=>x.category==='VOCAB'?'온라인 학습':CAT_S[x.category]+' · '+bookOf(x).book_name)+'<option value="__custom"'+(isC?' selected':'')+'>직접 입력…</option></select>';
  const mid=isC?'<input type="text" class="hwName" id="hwName_'+i+'" placeholder="숙제 이름 (예: 독서록 1편)" value="'+h(custom||'')+'" style="min-width:180px">':(vocab?'':'<select class="hwUnit" id="hwUnit_'+i+'" title="숙제로 낸 Unit">'+opt(unitsOf(b),t.next_unit_id||'',u=>u.unit_name)+'</select>');
  return '<div class="hwrow line" data-i="'+i+'">'+sel+mid+'<div class="chips">'+chip(n,'COMPLETED','했음',true)+chip(n,'PARTIAL','일부함',false)+chip(n,'NOT_DONE','안 함',false)+(vocab||isC?'':chip(n,'REPEAT','했지만 한 번 더',false))+'</div><button class="link note" data-act="hwRemove" data-i="'+i+'" style="text-decoration:none">✕</button></div>';}
function ipBody(i,t){
  const b=bookOf(t);const nx=t.next_unit_id;const n='st_ip_'+i;
  if(!nx)return '<div class="line"><span class="lbl">'+h(TRACK_ST[t.status]||t.status)+' <span class="note">(교재 끝 · 복습만 기록)</span></span><input type="hidden" name="'+n+'" value="REVIEW"><input type="text" class="ln" id="ln_'+i+'" placeholder="메모 (예: 오답노트 p.12)"></div>';
  return '<div class="line"><span class="lbl">오늘 <b style="color:var(--brass-ink)">'+h(unitLong(b,nx))+'</b></span><div class="chips">'+chip(n,'COMPLETED','완료',true)+chip(n,'PARTIAL','다 못함',false)+chip(n,'REPEAT','한 번 더',false)+chip(n,'REVIEW','복습·오답',false)+'<label class="chip-opt"><input type="radio" class="ipst" data-i="'+i+'" name="'+n+'" value="OTHER"><span>다른 Unit…</span></label></div><span id="ov_'+i+'" hidden><select id="ipUnit_'+i+'">'+opt(unitsOf(b).filter(u=>u.id!==nx),'',u=>u.unit_name)+'</select> <input type="text" id="ipReason_'+i+'" placeholder="이유 (필수)" style="min-width:120px"></span><input type="text" class="ln" id="ln_'+i+'" placeholder="메모" style="min-width:90px;width:140px"></div>'+rubricRow(i,t);
}
function rubricRow(i,t){
  if(!t||t.category!=='WRITING')return '';
  const b=bookOf(t);const target=num(b.writing_target,8);
  const sel=k=>'<select id="rb_'+k+'_'+i+'" class="rb"><option value="">—</option>'+[5,4,3,2,1].map(v=>'<option value="'+v+'">'+v+'</option>').join('')+'</select>';
  return '<div class="line" style="margin-top:6px"><label class="btn s" style="cursor:pointer">📷 오늘 쓴 글 사진<input type="file" accept="image/*" capture="environment" class="wph" data-i="'+i+'" hidden></label><span id="wph_prev_'+i+'" class="note"></span></div>'+
  '<details class="rbox" data-i="'+i+'" data-target="'+target+'" style="margin-top:6px"><summary class="note" style="cursor:pointer">라이팅 점수 (선택) ▸</summary><div class="row" style="margin-top:6px">'+RUBRIC.map(([k,l])=>'<label class="f">'+l+sel(k)+'</label>').join('')+'<label class="f" style="flex:1;min-width:160px">작품<input type="text" id="wk_'+i+'" placeholder="제목 또는 사진 링크"></label><span id="rbsum_'+i+'" class="note"></span></div>'+
  '<details style="margin-top:6px"><summary class="note" style="cursor:pointer">세어서 계산 (기대 '+target+'문장) · <button class="link" data-act="toggleRubricHelp" data-i="'+i+'">기준</button></summary><div class="row" style="margin-top:6px"><label class="f">총 문장<input type="number" class="rbe" data-i="'+i+'" id="ev_n_'+i+'" min="0"></label><label class="f">오류 문장<input type="number" class="rbe" data-i="'+i+'" id="ev_e_'+i+'" min="0"></label><div class="chips">'+IDEA_CHECKS.map(([k,l])=>'<label class="chip-opt"><input type="checkbox" class="rbe idea" data-i="'+i+'" value="'+k+'"><span>'+l+'</span></label>').join('')+'<label class="chip-opt"><input type="checkbox" class="rbe" data-i="'+i+'" id="ev_own_'+i+'"><span>자기 표현</span></label></div></div>'+rubricHelp(i)+'</details></details>';
}
function rubricHelp(i){
  return '<div id="rbh_'+i+'" hidden style="margin-top:8px"><div class="tw"><table class="t" style="font-size:13px"><thead><tr><th>점수</th>'+RUBRIC.map(([k,l])=>'<th>'+l+'</th>').join('')+'</tr></thead><tbody>'+[5,4,3,2,1].map(v=>'<tr><td><b>'+v+'</b></td>'+RUBRIC.map(([k])=>'<td>'+h(RUBRIC_ANCHORS[k][v-1])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="note" style="margin:6px 0 0">계산 규칙 — 문장력: 오류 문장 ÷ 총 문장 = 0 → 5, 20% 이하 → 4, 50% 이하 → 3, 그 이상 → 2, 전부 오류·2문장 미만 → 1. 사고력: 체크 개수가 점수(0~1개 → 1). 자기표현: 총 문장 ÷ 기대 분량 50% 미만 → 1, 80% 미만 → 2, 100% 미만 → 3, 충족 → 4, 자기 표현 체크 시 +1. 글을 안 쓴 날은 비워 두세요.</p></div>';
}
function ipRowHtml(i,t,cands,defId){
  return '<div class="iprow" data-i="'+i+'" style="margin-bottom:8px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm)"><div class="line" style="margin-bottom:4px"><select class="ipTrack" data-i="'+i+'">'+opt(cands,t.id,x=>CAT_S[x.category]+' · '+bookOf(x).book_name+(x.id===defId?' ★':''))+'</select><button class="link note" data-act="ipRemove" data-i="'+i+'" style="text-decoration:none">✕ 오늘 안 함</button></div><div class="ipBody" id="ipBody_'+i+'">'+ipBody(i,t)+'</div></div>';
}
function viewSession(id,q){
  const s=studentOf(id);if(!s)return notFound('학생');
  const date=q.date||todayISO();const loc=locOf(s.location_id);const order=(loc&&loc.flow_order&&loc.flow_order.length)?loc.flow_order:SLOTS;
  const trs=activeTracks(id);if(!trs.length)return '<h1>세션 입력 · '+h(s.name)+'</h1><div class="empty">교재가 설정되지 않은 학생입니다. <a href="#/student/'+s.id+'?edit=tracks">교재 설정</a>을 먼저 하세요.</div>';
  const sd=slotData(id);let n=0;const rows=[];
  const already=S.sessions.filter(x=>x.student_id===id&&x.session_date===date).length;
  for(const k of order){
    if(k==='BOOK'){n++;rows.push(seRow(n,'원서','<div class="line"><input type="text" id="seBookTitle" list="bookList" placeholder="오늘 읽은 원서" style="min-width:220px"><input type="text" id="seRec" placeholder="북토킹 녹음 링크 (선택)" style="min-width:180px"></div>'+bookDatalist()));}
    else if(k==='HW'){n++;const hc=trs.filter(t=>t.next_unit_id||t.category==='VOCAB');const hwInit=trs.filter(t=>t.category==='VOCAB'||(t.delivery_mode==='HOME'&&t.next_unit_id));rows.push(seRow(n,'숙제 검사','<div id="hwRows" data-sid="'+s.id+'" data-n="'+hwInit.length+'">'+hwInit.map((t,i)=>hwRow(i,t,hc)).join('')+'</div><div class="line"><button class="btn s" data-act="hwAdd">+ 숙제 과목 추가</button><span class="note">학생 교재 중 고르거나 직접 입력</span></div>'));}
    else if(k==='IP'){n++;const cands=sd.ip;let init=[];const first=byId(cands,q.ip)||sd.def||cands[0];if(first)init.push(first);if(order.includes('WR')){for(const t of cands)if(t.category==='WRITING'&&!init.includes(t))init.push(t);}
      rows.push(seRow(n,'오늘 교재',cands.length?'<div id="ipRows" data-sid="'+s.id+'" data-n="'+init.length+'">'+init.map((t,i)=>ipRowHtml(i,t,cands,sd.def?sd.def.id:null)).join('')+'</div><div class="line"><button class="btn s" data-act="ipAdd">+ 교재 하나 더</button><button class="btn s" data-act="toggleQb">+ 새 교재 만들기</button></div><div id="qbHost" hidden>'+quickBookForm(s.id,'session')+'</div>':'<span class="note">학원에서 진행하는 교재가 없습니다 (모든 교재가 숙제 방식). </span><button class="btn s" data-act="toggleQb">+ 새 교재 만들기</button><div id="ipRows" data-sid="'+s.id+'" data-n="0"></div><div id="qbHost" hidden>'+quickBookForm(s.id,'session')+'</div>'));}
    else if(k==='VT'){for(const t of sd.vt){const b=bookOf(t);n++;const rd=reviewDue(t);rows.push(seRow(n,'단어 · '+h(b.book_name),t.next_unit_id?'<div class="line"><select id="vtU_'+t.id+'" class="vtU" data-t="'+t.id+'" title="시험 본 Unit">'+opt(unitsOf(b),rd?'':t.next_unit_id,u=>u.unit_name)+'<option value="__review"'+(rd?' selected':'')+'>리뷰 테스트…</option></select><input type="text" id="vtR_'+t.id+'" placeholder="범위 (예: Unit 1-5)" value="'+h(rd||'')+'" style="width:130px"'+(rd?'':' hidden')+'><span><input type="number" class="vt" data-t="'+t.id+'" id="vt_'+t.id+'" min="0" placeholder="점수"> / <input type="number" class="vt" data-t="'+t.id+'" id="vtT_'+t.id+'" min="1" value="12"></span><span id="vtj_'+t.id+'" class="note">'+(rd?'리뷰 테스트 차례입니다 ('+h(rd)+')':'안 봤으면 비워두기')+'</span></div>':'<span class="note">'+h(TRACK_ST[t.status]||t.status)+'</span>'));}}
  }
  return '<div class="bar"><div><h1>세션 입력 · '+h(s.name)+'</h1><p class="sub" style="margin:0">AR '+h(s.ar_level)+' · '+h(loc?loc.name:'')+' · 순서는 지점 Flow를 따릅니다'+(already?' · '+badge('b-warn','이 날짜에 이미 '+already+'회 입력됨'):'')+'</p></div><span class="sp"></span>'+
  '<label class="f">날짜<input type="date" id="seDate" value="'+date+'"></label><label class="f">강사<select id="seTeacher">'+opt(S.teachers,myId(s.homeroom_teacher_id))+'</select></label></div>'+
  '<div class="panel">'+rows.join('')+seRow(n+1,'수업태도','<div class="line"><div class="chips">'+[5,4,3,2,1].map(v=>'<label class="chip-opt"><input type="radio" name="seAttitude" value="'+v+'"'+(v===5?' checked':'')+'><span>'+'★'.repeat(v)+'☆'.repeat(5-v)+'</span></label>').join('')+'</div></div>')+'<div class="srow"><div class="n"></div><div><input type="text" id="seNote" placeholder="메모 (내부용, 선택)" style="width:100%"></div></div>'+
  '<div class="bar" style="margin-top:14px"><span class="note">기본값은 전부 "완료". 다른 것만 바꾸고 저장하세요.</span><span class="sp"></span><a class="btn" href="#/student/'+s.id+'">취소</a><button class="btn b" data-act="saveSession" data-id="'+s.id+'">저장</button></div></div>';
}
function noticeEditor(x){

  '<div class="panel"><h2>알림장 (학부모 발송용)</h2><textarea id="nt_cm_'+x.id+'" style="min-height:260px">'+h(x.daily_comment)+'</textarea>'+

function sessionConfirm(s,r){
  const sd=slotData(s.id);
  const line=tracks=>tracks.map(t=>{const b=bookOf(t);return b.book_name+' '+(t.next_unit_id?unitShort(b,t.next_unit_id):(TRACK_ST[t.status]||t.status))+(t.next_unit_id&&remainingUnits(t)===1?' (마지막)':'');}).join(' · ');
  const parts=[sd.hw.length?'숙제 '+line(sd.hw):null,sd.ip.length?'교재 '+line(sd.ip):null,sd.vt.length?'단어 '+line(sd.vt):null].filter(Boolean);
  const tests=activeTracks(s.id).filter(t=>t.status==='TEST_REQUIRED');const x=r.session;
  return '<h1>저장됨 · '+h(s.name)+'</h1><p class="sub">'+h(x.session_date)+' 세션이 기록되고 State가 갱신되었습니다. 아래 알림장을 다듬어 복사하거나, 알림장 보드에서 전체를 한 번에 복사하세요.</p>'+
  '<div class="confirm"><div class="big">다음 시간 → '+h(parts.join(' / '))+'</div>'+
  (tests.length?'<div>'+tests.map(t=>badge('b-brass',bookOf(t).book_name+' 완료 → 성취테스트 준비 (교재 시험 화면)')).join(' ')+'</div>':'')+
  (r.newAlerts.length?'<div style="margin-top:6px">'+r.newAlerts.map(a=>badge(SEV_CLS[a.severity]||'b-info','⚠ '+a.message+' → '+a.action)).join(' ')+'</div>':'<div class="note" style="margin-top:6px">새 Alert 없음</div>')+'</div>'+
  noticeEditor(x)+
  '<div class="bar"><a class="btn p" href="#/home?date='+h(x.session_date)+'">Teacher Home</a><a class="btn" href="#/notices?date='+h(x.session_date)+'">알림장 보드</a><a class="btn" href="#/student/'+s.id+'">학생 상세</a></div>';
}
// --- Curriculum Path ---
function bookForm(cat,b){
  const others=S.books.filter(x=>x.category===cat&&(!b||x.id!==b.id));const v=k=>b?h(b[k]==null?'':b[k]):'';
  return '<div class="panel" style="border-color:var(--brass)"><h2>'+(b?'교재 편집 · '+h(b.book_name):'교재 추가 · '+CAT_L[cat])+'</h2>'+(b?'':'<p class="note">종류는 위 탭('+CAT_L[cat]+')을 따릅니다. 맵 Level·Season을 고르면 그 칸에 들어가고, "맵 밖"으로 두면 목록에만 있는 교재가 됩니다(세션 입력에서 학생에게 붙일 수 있음).</p>')+'<div class="row">'+
  '<label class="f">교재명<input type="text" id="bf_name" value="'+v('book_name')+'"></label>'+
  '<label class="f">Level<input type="text" id="bf_level" value="'+v('level')+'" style="width:90px"></label>'+
  '<label class="f">Unit 라벨<select id="bf_label">'+['Unit','Part','Lesson'].map(x=>'<option'+((b?b.unit_label:'Unit')===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label>'+
  '<label class="f">Unit 수<input type="number" id="bf_n" min="1" value="'+(b?unitsOf(b).length:12)+'"></label>'+
  '<label class="f">Completion Test<select id="bf_test"><option value="1"'+(!b||b.completion_test_required?' selected':'')+'>있음</option><option value="0"'+(b&&!b.completion_test_required?' selected':'')+'>없음 (완료 즉시 다음 교재)</option></select></label>'+
  '<label class="f">Pass 점수 %<input type="number" id="bf_pass" min="0" max="100" value="'+v('pass_score')+'" placeholder="기본 '+num(S.rules.COMPLETION_TEST_DEFAULT.pass_score,80)+'"></label>'+
  '<label class="f">다음 교재<select id="bf_next"><option value="">— 경로 끝 —</option>'+opt(others,b?b.next_book_id:'',x=>x.book_name)+'</select></label>'+
  '<label class="f">선수 교재<select id="bf_pre"><option value="">— 없음 —</option>'+opt(others,b?b.prerequisite_book_id:'',x=>x.book_name)+'</select></label>'+
  '<label class="f">교재 가격 (원)<input type="number" id="bf_price" min="0" step="500" value="'+v('price')+'" placeholder="예: 5000" style="width:100px"></label>'+
  '<label class="f">예상 세션 수<input type="number" id="bf_exp" min="1" value="'+v('expected_sessions')+'" placeholder="비우면 Unit×'+num(S.rules.STAGNATION.multiplier,1.5)+'"></label>'+
  (cat==='WRITING'?'<label class="f">기대 분량 (문장 수)<input type="number" id="bf_wt" min="1" value="'+h(b&&b.writing_target!=null?b.writing_target:8)+'" title="이 교재 한 Unit의 글에서 기대하는 문장 수 — 자기표현 점수의 기준"></label>':'')+
  (cat==='VOCAB'?'<label class="f">리뷰 테스트 주기 (Unit 수)<input type="number" id="bf_rv" min="0" value="'+h(b&&b.review_every!=null?b.review_every:0)+'" placeholder="예: 5" title="이 Unit 수마다 리뷰 테스트 차례를 알려줍니다. 0이면 사용 안 함"></label>':'')+
  (()=>{const g=b?gridOf(b):[];const lv=g.length?g[0].level:'';const s1=g.length?g[0].season:'';const s2=g.length?g[g.length-1].season:'';return '<label class="f">맵 Level<select id="bf_lv"><option value="">맵 밖</option>'+LEVELS.map(L=>'<option value="'+L.no+'"'+(lv===L.no?' selected':'')+'>'+String(L.no).padStart(2,'0')+' '+L.name+'</option>').join('')+'</select></label><label class="f">Season<span><select id="bf_s1">'+SEASONS.map(x=>'<option'+(s1===x?' selected':'')+'>'+x+'</option>').join('')+'</select> ~ <select id="bf_s2">'+SEASONS.map(x=>'<option'+((s2||s1)===x?' selected':'')+'>'+x+'</option>').join('')+'</select></span></label><label class="f">대안 순서<select id="bf_alt"><option value="0"'+(!b||!b.alt?' selected':'')+'>1번째</option><option value="1"'+(b&&b.alt===1?' selected':'')+'>2번째 (or)</option></select></label>';})()+
  (b?'<label class="f">사용<select id="bf_active"><option value="1"'+(b.active?' selected':'')+'>사용 중</option><option value="0"'+(!b.active?' selected':'')+'>사용 안 함</option></select></label>':'')+
  '</div><div class="row" style="margin-top:10px"><label class="f" style="flex:1;min-width:280px">숙제 안내 문구 (알림장에 자동 삽입)<input type="text" id="bf_hw" value="'+h(b?(b.hw_template==null?HW_DEFAULT[cat]:b.hw_template):(HW_DEFAULT[cat]||''))+'" style="width:100%"></label></div><p class="note" style="margin:6px 0 0">{교재} = 교재명 · {단원} = 숙제 대상 Unit (학원에서 한 교재는 오늘 한 Unit, 집에서 하는 교재는 다음 Unit) · {다음단원} = 다음 Unit. 비우면 알림장에 넣지 않습니다.</p>'+
  '<div class="bar" style="margin-top:12px"><button class="btn p" data-act="saveBook" data-cat="'+cat+'" data-id="'+(b?b.id:'')+'">저장</button><a class="btn" href="#/curriculum?cat='+cat+'">취소</a></div></div>';
}
function viewCurriculum(q){
  const cat=CATS.includes(q.cat)?q.cat:'GRAMMAR';const bs=S.books.filter(b=>b.category===cat);const chains=chainOf(cat);const edit=q.edit?byId(S.books,q.edit):null;
  const inUse=b=>S.tracks.filter(t=>t.active&&t.book_id===b.id).length;const ph=S.books.filter(b=>b.units_placeholder&&gridOf(b).length).length;
  const offMap=S.books.filter(b=>!gridOf(b).length);
  return '<div class="bar"><div><h1>Curriculum Path</h1><p class="sub" style="margin:0">EPL Growth Curriculum — 5 Level × 4 Skill × 4 Season. 강사는 이 경로를 실행하고, 시스템이 다음 Unit과 다음 교재를 계산합니다.</p></div><span class="sp"></span><a class="btn p" href="#/curriculum?cat='+cat+'&add=1">+ 교재 추가</a><a class="btn" href="#/curriculum?cat='+cat+'&levels=1">Level 이름 편집</a></div>'+
  (q.add?bookForm(cat,null):'')+
  (ph?'<div class="ban">맵 교재 '+ph+'권의 Unit 수는 임시값(문법·독해·라이팅 12, 단어 30)입니다. 실제 목차에 맞게 편집하면 * 표시가 사라집니다. 지금 쓰는 교재부터 고치면 됩니다.</div>':'')+
  (()=>{const c=parseCell(q.cell);return '<div class="panel"><div class="bar"><h2 style="margin:0">성장 맵 (마스터)</h2><span class="sp"></span></div><p class="note"><b>맵 안에 교재를 넣으려면 칸을 클릭하세요.</b> 빈 칸의 "+ 교재 넣기"를 누르면 그 칸에 새 교재를 만들거나 기존 교재를 넣을 수 있고, 교재가 있는 칸(✎)은 이름·Unit 수 수정, 대안(or) 추가, 빼기가 됩니다. 편집 패널은 맵 바로 위에 열립니다.</p>'+(c?cellEditor(c):'')+(q.levels?levelEditor():'')+renderMap(null,{selected:c?c.key:''})+'</div>';})()+
  '<div class="tabs">'+CATS.map(c=>'<a href="#/curriculum?cat='+c+'" class="'+(c===cat?'on':'')+'">'+CAT_L[c]+'</a>').join('')+'</div>'+
  '<div class="bar"><span class="note">'+CAT_L[cat]+' 교재 목록'+(offMap.filter(b=>b.category===cat).length?' · 맵 밖 교재 '+offMap.filter(b=>b.category===cat).length+'권 (칸 편집에서 "기존 교재 넣기"로 맵에 배치)':'')+'</span><span class="sp"></span><a class="btn" href="#/curriculum?cat='+cat+'&add=1">+ '+CAT_S[cat]+' 교재 추가</a></div>'+
  (edit?bookForm(cat,edit):'')+
  '<div class="panel tw"><table class="t"><thead><tr><th>교재</th><th>맵 위치</th><th>Unit</th><th>Completion Test</th><th>Pass</th><th>다음 교재</th><th>숙제 문구</th><th>사용 학생</th><th></th></tr></thead><tbody>'+
  bs.slice().sort((a,c)=>{const ga=gridOf(a),gc=gridOf(c);const ka=ga.length?ga[0].level*10+ga[0].season:99,kc=gc.length?gc[0].level*10+gc[0].season:99;return ka-kc||(a.alt||0)-(c.alt||0)||a.book_name.localeCompare(c.book_name,'ko');}).map(b=>{const g=gridOf(b);const nb=nextBookOf(b);return '<tr'+(b.active?'':' style="opacity:.55"')+'><td><b>'+h(b.book_name)+'</b>'+(b.active?'':' <span class="note">(사용 안 함)</span>')+(b.prerequisite_book_id?'<div class="note">선수: '+h((byId(S.books,b.prerequisite_book_id)||{}).book_name||'?')+'</div>':'')+'</td><td>'+(g.length?'L'+g[0].level+' S'+g[0].season+(g.length>1?'~'+g[g.length-1].season:'')+(b.alt?' (or)':''):'<span class="note">맵 밖</span>')+'</td><td>'+unitsOf(b).length+' '+h(b.unit_label)+(b.units_placeholder?'<span class="note">*</span>':'')+'</td><td>'+(b.completion_test_required?'있음':'없음')+'</td><td>'+(b.completion_test_required?passScoreOf(b)+'%':'—')+'</td><td>'+(nb?h(nb.book_name)+(b.next_book_id?'':' <span class="note">(맵)</span>'):badge('b-muted','경로 끝'))+'</td><td class="note">'+h(b.hw_template==null?HW_DEFAULT[b.category]:b.hw_template)+'</td><td>'+inUse(b)+'명</td><td><a href="#/curriculum?cat='+cat+'&edit='+b.id+'">편집</a></td></tr>';}).join('')+
  '</tbody></table></div>';
}

// --- Completion Tests ---
function viewTests(q){
  const rows=S.completion_tests.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')||b.attempt_no-a.attempt_no);
  const isLatest=ct=>{const t=byId(S.tracks,ct.track_id);const l=t?latestTestOf(t):null;return l&&l.id===ct.id;};
  const who=ct=>'<a href="#/student/'+ct.student_id+'"><b>'+h(nameOf(S.students,ct.student_id))+'</b></a>';
  const bk=ct=>h((byId(S.books,ct.book_id)||{}).book_name||'');
  const pending=rows.filter(t=>t.status==='READY_FOR_TEST'||t.status==='RETEST_REQUIRED');
  const scheduled=rows.filter(t=>t.status==='TEST_SCHEDULED');
  const review=rows.filter(t=>t.status==='REVIEW_REQUIRED'&&isLatest(t));
  const history=rows.filter(t=>t.status==='PASS'||(t.status==='REVIEW_REQUIRED'&&!isLatest(t)));
  const today=todayISO();
  const tb=(S.meta.tools||{}).test_builder;
  return '<div class="bar"><div><h1>성취테스트 (교재 시험)</h1><p class="sub" style="margin:0">교재의 마지막 Unit이 끝나면 여기에 자동으로 나타납니다. 시험지는 성취테스트 빌더에서 만들고, 여기서는 상태와 점수만 관리합니다.</p></div><span class="sp"></span>'+(tb?'<a class="btn p" href="'+h(tb)+'" target="_blank" rel="noopener">성취테스트 빌더 열기 ↗</a>':'')+'</div>'+
  '<div class="bar"><label class="f">채점 강사<select id="gradeTeacher">'+opt(S.teachers,myId(S.teachers[0].id))+'</select></label><label class="f">기준일<input type="date" id="testDate" value="'+today+'"></label></div>'+
  '<div class="panel"><h2>Test 준비됨 · 재시험 대기 ('+pending.length+')</h2>'+(pending.length?'<div class="tw"><table class="t"><thead><tr><th>학생</th><th>교재</th><th>attempt</th><th>상태</th><th>기준</th><th>시험일</th></tr></thead><tbody>'+pending.map(ct=>'<tr><td>'+who(ct)+'</td><td>'+bk(ct)+'</td><td>'+ct.attempt_no+'</td><td>'+badge('b-brass',TEST_ST[ct.status])+'</td><td>'+ct.pass_score_snapshot+'%</td><td><input type="date" id="sd_'+ct.id+'" value="'+addDays(today,1)+'"> <button class="btn s" data-act="schedTest" data-id="'+ct.id+'">시험일 지정</button></td></tr>').join('')+'</tbody></table></div>':'<p class="note">없음</p>')+'</div>'+
  '<div class="panel"><h2>시험일 지정됨 · 채점 대기 ('+scheduled.length+')</h2>'+(scheduled.length?'<div class="tw"><table class="t"><thead><tr><th>학생</th><th>교재</th><th>attempt</th><th>시험일</th><th>기준</th><th>점수</th></tr></thead><tbody>'+scheduled.map(ct=>'<tr><td>'+who(ct)+'</td><td>'+bk(ct)+'</td><td>'+ct.attempt_no+'</td><td>'+h(ct.scheduled_date)+'</td><td>'+ct.pass_score_snapshot+'%</td><td><input type="number" id="gs_'+ct.id+'" min="0" placeholder="점수"> / <input type="number" id="gt_'+ct.id+'" min="1" value="100"> <button class="btn b s" data-act="gradeTest" data-id="'+ct.id+'">채점</button></td></tr>').join('')+'</tbody></table></div>':'<p class="note">없음</p>')+'</div>'+
  '<div class="panel"><h2>복습 필요 ('+review.length+')</h2>'+(review.length?'<div class="tw"><table class="t"><thead><tr><th>학생</th><th>교재</th><th>attempt</th><th>점수</th><th>기준</th><th></th></tr></thead><tbody>'+review.map(ct=>'<tr><td>'+who(ct)+'</td><td>'+bk(ct)+'</td><td>'+ct.attempt_no+'</td><td>'+badge('b-bad',ct.pct+'%')+'</td><td>'+ct.pass_score_snapshot+'%</td><td><button class="btn s" data-act="retest" data-id="'+ct.id+'">복습 완료 → 재시험 준비</button></td></tr>').join('')+'</tbody></table></div>':'<p class="note">없음</p>')+'</div>'+
  '<div class="panel"><h2>이력 ('+history.length+')</h2>'+(history.length?'<div class="tw"><table class="t"><thead><tr><th>학생</th><th>교재</th><th>attempt</th><th>결과</th><th>점수</th><th>기준</th><th>시행일</th><th>채점</th></tr></thead><tbody>'+history.map(ct=>'<tr><td>'+who(ct)+'</td><td>'+bk(ct)+'</td><td>'+ct.attempt_no+'</td><td>'+badge(ct.status==='PASS'?'b-good':'b-bad',ct.status==='PASS'?'PASS':'FAIL')+'</td><td>'+(ct.pct!=null?ct.pct+'%':'—')+'</td><td>'+ct.pass_score_snapshot+'%</td><td>'+h(ct.taken_at||'')+'</td><td>'+h(nameOf(S.teachers,ct.graded_by))+'</td></tr>').join('')+'</tbody></table></div>':'<p class="note">없음</p>')+'</div>';

function spark(pts,min,max){
  if(!pts.length)return '<span class="note">기록 없음</span>';
  const W=240,H=48,pad=4;const n=pts.length;const step=n>1?(W-2*pad)/(n-1):0;const y=v=>H-pad-((v-min)/(max-min))*(H-2*pad);
  const path=pts.map((p,i)=>(i?'L':'M')+(pad+i*step).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>'<circle cx="'+(pad+i*step).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="2.4" fill="var(--brass)"><title>'+h(p.x+' · '+p.v)+'</title></circle>').join('');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="추이"><line x1="'+pad+'" y1="'+y(min).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+y(min).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><path d="'+path+'" fill="none" stroke="var(--brass)" stroke-width="1.6"/>'+dots+'</svg>';
}

// --- EPL Growth Curriculum map (5 Levels × 4 Skills × 4 Seasons) ---
function renderMap(s,opts){
  opts=opts||{};const cellsBy={};for(const cat of CATS)cellsBy[cat]=mapCells(cat);
  const lvlColor=['var(--navy)','var(--brass)','#5f7f7a','var(--brass-ink)','var(--muted)'];
  let rows='';
  const sel=opts.selected||'';
  for(const L of levelsOf()){
    CATS.forEach((cat,ci)=>{
      rows+='<tr class="lvl-'+L.no+'">'+(ci===0?'<td class="lvcell" rowspan="4" style="border-left-color:'+lvlColor[L.no-1]+'"><div class="no">'+String(L.no).padStart(2,'0')+'</div><div class="nm">'+h(L.name)+'</div><div class="tag">'+h(L.tag)+'</div></td>':'')+'<td class="sk">'+CAT_MAP[cat]+'</td>';
      for(const se of SEASONS){
        const cell=cellsBy[cat].find(c=>c.level===L.no&&c.season===se);
        const key=cellKey(L.no,cat,se);
        if(!cell){rows+=(!s?'<td class="cell st-EMPTY st-MASTER'+(sel===key?' st-EDIT':'')+'" data-act="cellEdit" data-cell="'+key+'" title="빈 칸 · 클릭해서 교재 추가"><span class="plus">+ 교재 넣기</span></td>':'<td class="cell st-EMPTY"></td>');continue;}
        const names=cell.books.map(b=>b.book_name);
        if(!s){rows+='<td class="cell st-MASTER'+(sel===key?' st-EDIT':'')+'" data-act="cellEdit" data-cell="'+key+'" title="클릭해서 이 칸 편집">'+cell.books.map(b=>h(b.book_name)+(b.units_placeholder?'<span class="note"> '+unitsOf(b).length+'U*</span>':'<span class="note"> '+unitsOf(b).length+'U</span>')).join('<span class="note"> or </span>')+'<span class="mk pen">✎</span></td>';continue;}
        const st=cellStatus(s,cell);const act=st==='ACTIVE'?activeTracks(s.id).find(t=>cell.books.some(b=>b.id===t.book_id)):null;
        const label=act?bookOf(act).book_name:names.join(' or ');
        rows+='<td class="cell st-'+st+'" data-act="mapPick" data-sid="'+s.id+'" data-books="'+cell.books.map(b=>b.id).join('|')+'" title="'+h(names.join(' / '))+(st==='ACTIVE'&&act&&act.next_unit_id?' · 다음 '+h(unitLong(bookOf(act),act.next_unit_id)):'')+'"><span>'+h(label)+'</span>'+(st==='DONE'?'<span class="mk">✓</span>':st==='ACTIVE'?'<span class="mk">진행'+(act&&act.next_unit_id?' · '+h(unitShort(bookOf(act),act.next_unit_id)):'')+'</span>':'')+'</td>';
      }
      rows+='</tr>';
    });
  }
  return '<div class="tw"><table class="gmap"><thead><tr><th class="lv" colspan="2">LEVEL / SKILL</th>'+SEASONS.map(se=>'<th>Season '+se+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function areaRows(r,auto){
  const names=(r.areas&&r.areas.length)?r.areas.map(a=>a.name):(S.meta.report_areas||DEFAULT_REPORT_AREAS);
  return names.map(name=>{const cur=(r.areas||[]).find(a=>a.name===name);const level=normLevel(cur&&cur.level?cur.level:(cur&&cur.score!=null?levelOf(cur.score):(auto[name]!=null?levelOf(auto[name]):'보통')));return{name,level,score:level?levelScore(level):null,auto:auto[name]!=null?levelOf(auto[name]):null,fallback:auto[name]==null&&!(cur&&(cur.level||cur.score!=null))};});
}
function radarSvg(rows,prev){
  const n=rows.length;if(n<3)return '';const cx=170,cy=122,R=76;const ang=i=>-Math.PI/2+i*2*Math.PI/n;const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  const ring=k=>'<polygon points="'+rows.map((_,i)=>pt(i,R*k/3).map(v=>v.toFixed(1)).join(',')).join(' ')+'" fill="none" stroke="var(--line)" stroke-width="1"/>';
  const axes=rows.map((_,i)=>{const [x,y]=pt(i,R);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';}).join('');
  const vals=rows.map(a=>a.score==null?0:a.score);
  const poly=rows.map((_,i)=>pt(i,R*vals[i]/3).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots=rows.map((_,i)=>{const [x,y]=pt(i,R*vals[i]/3);return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="var(--navy)"/>';}).join('');
  const labels=rows.map((a,i)=>{const [x,y]=pt(i,R+14);const anchor=Math.abs(Math.cos(ang(i)))<0.2?'middle':Math.cos(ang(i))>0?'start':'end';return '<text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" font-size="11" text-anchor="'+anchor+'" fill="var(--ink)">'+h(a.name)+'</text>';}).join('');
  let prevPoly='';if(prev&&rows.some(a=>prev[a.name])){const pv=rows.map(a=>prev[a.name]?levelScore(prev[a.name]):0);prevPoly='<polygon points="'+rows.map((_,i)=>pt(i,R*pv[i]/3).map(v=>v.toFixed(1)).join(',')).join(' ')+'" fill="var(--brass)" fill-opacity=".08" stroke="var(--brass)" stroke-width="1.5" stroke-dasharray="4 3"/>';}
  return '<svg viewBox="0 0 340 244" width="340" height="244" style="max-width:100%;height:auto" class="spark" role="img" aria-label="영역별 성취도">'+[1,2,3].map(ring).join('')+axes+prevPoly+'<polygon points="'+poly+'" fill="var(--navy)" fill-opacity=".12" stroke="var(--navy)" stroke-width="2"/>'+dots+labels+'</svg>';
}

  (()=>{const ph=[];for(const x of sessionsOf(s.id))if(ymOf(x.session_date)===ym)for(const a of x.activities)if(a.photo_id)ph.push({id:a.photo_id,date:x.session_date});return ph.length?'<div class="rp-areas" style="padding-top:0"><h3 class="rp-h">✍️ 이 달의 글</h3><div class="rp-gallery">'+ph.slice(-3).map(p=>'<figure>'+photoTag(p.id,'rp-photo')+'<figcaption class="note">'+h(fmtDateK(p.date))+'</figcaption></figure>').join('')+'</div></div>':'';})()+

function viewAlerts(q){

  const today=todayISO();const inc=incompleteList(addDays(today,-7),addDays(today,-1),loc);

  else body=resolved.length?'<div class="tw"><table class="t"><thead><tr><th>학생</th><th>예외</th><th>권한</th><th>처리</th><th>발생 → 해결</th></tr></thead><tbody>'+resolved.slice(0,60).map(a=>'<tr><td>'+h(nameOf(S.students,a.student_id))+'</td><td>'+h(RULE_L[a.rule_code]||EVENT_TYPES[a.rule_code]||a.rule_code)+'<div class="note">'+h(a.message)+'</div></td><td>'+badge(LEVEL_CLS[a.authority_level]||'b-muted',LEVEL_L[a.authority_level]||'')+'</td><td>'+h(nameOf(S.teachers,a.handled_by))+(a.handle_note?'<div class="note">'+h(a.handle_note)+'</div>':'')+'</td><td class="note">'+h(a.created_at)+' → '+h(a.resolved_at)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">없음</div>';
  return '<h1>할 일</h1><p class="sub">시스템이 잡아낸 것만 여기 옵니다. 할 일마다 누가 결정하는지·기준·처리 방법·기한이 붙어 있습니다. 강사 단독은 바로 끝내고, 나머지는 보고하거나 결정을 요청하면 됩니다.</p>'+
  '<div class="bar">'+tabs+'<span class="sp"></span><label class="f">지점<select class="hq" data-k="loc"><option value="">전체</option>'+opt(S.locations,loc)+'</select></label>'+(isDirector()?'<button class="btn" data-act="runRules">규칙 전체 실행</button>':'')+'</div><div class="panel">'+body+'</div>';

  const v=(x,suf)=>x==null?'—':x+(suf||'');
  const rows=[
    ['재원생 (신규 · 퇴원)',d=>cell(d,d.m.active+' <span class="note">(+'+d.m.enrolled+' / −'+d.m.withdrawn+')</span>','active',d.b.active)],

  ];

const ISSUE_ST={PLANNED:'안내 예정',ISSUED:'지급 (결제 안내 대기)',NOTIFIED:'결제 안내함',PAID:'입금 확인'};
const ISSUE_BG={PLANNED:'var(--warn-soft)',ISSUED:'var(--surface-2)',NOTIFIED:'var(--brass-soft)',PAID:'var(--paid-soft)'};
function payNotice(it){const s=studentOf(it.student_id),b=byId(S.books,it.book_id);return fillTemplate(S.meta.pay_template||DEFAULT_PAY_TEMPLATE,{학원:S.meta.academy_name||'EPL 영어학원',학생:s?s.name:'',교재:(b?b.book_name:'')+(it.qty>1?' '+it.qty+'권':''),금액:it.price!=null?won(it.price*it.qty):'',계좌:S.meta.bank_account||'',지급일:fmtDateK(it.date)});}
const won=n=>n==null||n===''?'':Number(n).toLocaleString()+'원';
function issuesOf(sid,bookId){return S.issues.filter(i=>i.student_id===sid&&(!bookId||i.book_id===bookId));}
function studentNeeds(sid){return activeTracks(sid).map(t=>({t,b:bookOf(t)})).filter(x=>x.b&&!S.issues.some(i=>i.student_id===sid&&i.book_id===x.b.id&&i.status!=='PLANNED'));}
function issueNeeds(loc){const out=[];for(const s of S.students){if(s.status!=='ACTIVE'||(loc&&s.location_id!==loc))continue;for(const t of activeTracks(s.id)){const b=bookOf(t);if(!b)continue;if(S.issues.some(i=>i.student_id===s.id&&i.book_id===b.id&&i.status!=='PLANNED'))continue;out.push({s,t,b,planned:S.issues.find(i=>i.student_id===s.id&&i.book_id===b.id&&i.status==='PLANNED')||null});}}return out.sort((a,b)=>(a.s.homeroom_teacher_id||'').localeCompare(b.s.homeroom_teacher_id||'')||a.s.name.localeCompare(b.s.name,'ko'));}
function stockOf(bookId,teacherId){const r=S.stock.find(x=>x.book_id===bookId&&(x.teacher_id||'')===(teacherId||''));return r?num(r.qty,0):0;}
function setStock(bookId,teacherId,qty){let r=S.stock.find(x=>x.book_id===bookId&&(x.teacher_id||'')===(teacherId||''));if(!r){r={book_id:bookId,teacher_id:teacherId||'',qty:0};S.stock.push(r);}r.qty=num(qty,0);return r;}
function issueBook(sid,bookId,teacherId,status,qty,price,date,note){const s=studentOf(sid),b=byId(S.books,bookId);if(!s||!b)return null;
  let it=S.issues.find(i=>i.student_id===sid&&i.book_id===bookId&&i.status==='PLANNED');
  if(!it){it={id:uid('is'),student_id:sid,book_id:bookId,teacher_id:teacherId||s.homeroom_teacher_id||null,date:date||todayISO(),qty:Math.max(1,num(qty,1)),price:price==null||price===''?(b.price!=null?b.price:null):num(price),status:'PLANNED',note:note||''};S.issues.push(it);}
  else{if(teacherId)it.teacher_id=teacherId;it.date=date||it.date;it.qty=Math.max(1,num(qty,it.qty));if(price!=null&&price!=='')it.price=num(price);if(note)it.note=note;}
  if(status!=='PLANNED'&&it.status==='PLANNED'){const holder=it.teacher_id||'';const cur=stockOf(bookId,holder);if(cur>0||S.stock.some(x=>x.book_id===bookId&&(x.teacher_id||'')===holder))setStock(bookId,holder,cur-it.qty);}
  it.status=status||'PLANNED';return it;}
function viewBooks(q){
  const tab=q.tab||'need';const loc=q.loc||'';const me=currentUser();const tch=q.tch||'';
  const teachers=S.teachers.filter(t=>t.role!=='DIRECTOR');const holders=[...teachers,{id:'',name:'공용'}];

  if(tab==='need'){const needs=issueNeeds(loc).filter(x=>!tch||x.s.homeroom_teacher_id===tch);
    body=needs.length?'<div class="tw"><table class="t"><thead><tr><th>담임</th><th>학생</th><th>교재</th><th>시작</th><th>담당 재고</th><th>수량 · 가격 · 지급일</th><th></th></tr></thead><tbody>'+needs.map(x=>{const hid=x.s.homeroom_teacher_id||'';const st=stockOf(x.b.id,hid),sh=stockOf(x.b.id,'');const k=x.s.id+'_'+x.b.id;return '<tr'+(x.planned?' style="background:var(--warn-soft,rgba(200,140,40,.08))"':'')+'><td>'+h(nameOf(S.teachers,x.s.homeroom_teacher_id))+'</td><td><a href="#/student/'+x.s.id+'"><b>'+h(x.s.name)+'</b></a>'+(x.planned?'<div class="note">안내 예정 '+h(x.planned.date)+'</div>':'')+'</td><td>'+h(x.b.book_name)+'<div class="note">'+CAT_S[x.b.category]+(x.b.price!=null?' · '+won(x.b.price):'')+'</div></td><td class="note">'+h(x.t.started_at||'')+'</td><td>'+(st>0?badge('b-good',st+'권'):sh>0?badge('b-muted','공용 '+sh+'권'):badge('b-bad','없음'))+'</td><td style="white-space:nowrap"><input type="number" id="iq_'+k+'" value="'+(x.planned?x.planned.qty:1)+'" min="1" style="width:52px"> <input type="number" id="ip_'+k+'" value="'+h(x.planned&&x.planned.price!=null?x.planned.price:(x.b.price!=null?x.b.price:''))+'" placeholder="가격" step="500" style="width:80px"> <input type="date" id="id_'+k+'" value="'+todayISO()+'"></td><td style="white-space:nowrap">'+(x.planned?'':'<button class="btn s" data-act="issue" data-sid="'+x.s.id+'" data-book="'+x.b.id+'" data-st="PLANNED">안내 예정</button> ')+'<button class="btn s p" data-act="issue" data-sid="'+x.s.id+'" data-book="'+x.b.id+'" data-st="ISSUED">지급</button></td></tr>';}).join('')+'</tbody></table></div><div class="bar" style="margin-top:10px"><button class="btn" data-act="issueAllExisting" data-loc="'+loc+'" data-tch="'+tch+'">이 목록 전부 "이미 받음"으로 정리 ('+needs.length+'건)</button><span class="note">처음 시작할 때 한 번 — 예전에 이미 준 교재를 재고 차감 없이 지급 완료로 표시합니다.</span></div><p class="note">학생에게 교재가 설정되면 자동으로 여기에 올라오고, 지급을 누르면 담당 선생님 재고에서 빠지고 <b>결제 안내</b> 탭(실장)으로 넘어갑니다. 가격은 교재 편집(커리큘럼)에서 기본값을 넣어 두면 자동으로 채워집니다.</p>':'<div class="empty">지급할 교재가 없습니다. 모든 재원생이 교재를 받았습니다.</div>';}
  else if(tab==='pay'){const its=S.issues.filter(i=>(i.status==='ISSUED'||i.status==='NOTIFIED')).map(i=>({i,s:studentOf(i.student_id),b:byId(S.books,i.book_id)})).filter(x=>x.s&&(!loc||x.s.location_id===loc)&&(!tch||x.s.homeroom_teacher_id===tch)).sort((a,b)=>(a.i.status===b.i.status?0:a.i.status==='ISSUED'?-1:1)||(a.i.date||'').localeCompare(b.i.date||''));
    const wait=its.filter(x=>x.i.status==='ISSUED'),sent=its.filter(x=>x.i.status==='NOTIFIED');const sum=its.reduce((n,x)=>n+(x.i.price||0)*x.i.qty,0);
    body='<div class="bar" style="margin-bottom:8px"><span class="note">안내 대기 <b>'+wait.length+'</b> · 입금 대기 <b>'+sent.length+'</b> · 미수금 <b>'+won(sum)+'</b></span><span class="sp"></span>'+(wait.length?'<button class="btn" data-act="payCopyAll" data-loc="'+loc+'" data-tch="'+tch+'">안내 문구 전체 복사 ('+wait.length+')</button><button class="btn" data-act="payNotifyAll" data-loc="'+loc+'" data-tch="'+tch+'">전체 안내함 처리</button>':'')+'</div>'+
    (its.length?'<div class="tw"><table class="t"><thead><tr><th>상태</th><th>학생</th><th>교재</th><th>지급일 · 담당</th><th>금액</th><th></th></tr></thead><tbody>'+its.map(x=>'<tr style="background:'+ISSUE_BG[x.i.status]+'"><td>'+badge(x.i.status==='NOTIFIED'?'b-brass':'b-muted',x.i.status==='NOTIFIED'?'안내함':'안내 대기')+'</td><td><a href="#/student/'+x.s.id+'"><b>'+h(x.s.name)+'</b></a><div class="note">'+h(nameOf(S.locations,x.s.location_id))+'</div></td><td>'+h(x.b?x.b.book_name:'?')+(x.i.qty>1?' ×'+x.i.qty:'')+'</td><td class="note">'+h(x.i.date)+' · '+h(nameOf(S.teachers,x.i.teacher_id))+'</td><td style="white-space:nowrap"><input type="number" id="pp_'+x.i.id+'" value="'+h(x.i.price!=null?x.i.price:'')+'" step="500" placeholder="가격" style="width:84px"></td><td style="white-space:nowrap"><button class="btn s" data-act="payCopy" data-id="'+x.i.id+'">문구 복사</button> '+(x.i.status==='ISSUED'?'<button class="btn s b" data-act="paySet" data-id="'+x.i.id+'" data-st="NOTIFIED">안내함</button> ':'')+'<button class="btn s p" data-act="paySet" data-id="'+x.i.id+'" data-st="PAID">입금 확인</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">결제 안내할 건이 없습니다.</div>')+
    '<p class="note">흐름: 담당 선생님이 <b>지급</b> → 실장이 <b>문구 복사 → 학부모 전송 → 안내함</b> → 입금 확인되면 <b>입금 확인</b>(보라색). 안내 문구와 계좌는 설정 → 알림장 템플릿 아래에서 바꿉니다.</p>';}
  else if(tab==='stock'){const low=[];
    body='<div class="tw"><table class="t"><thead><tr><th>교재</th>'+holders.map(t=>'<th>'+h(t.name)+'</th>').join('')+'<th>합계</th><th>대기</th></tr></thead><tbody>'+books.map(b=>{const need=issueNeeds(loc).filter(x=>x.b.id===b.id).length;const tot=holders.reduce((n,t)=>n+stockOf(b.id,t.id),0);if(need>tot)low.push(b.book_name);return '<tr'+(need>tot?' style="background:var(--bad-soft)"':'')+'><td><b>'+h(b.book_name)+'</b><div class="note">'+CAT_S[b.category]+(b.price!=null?' · '+won(b.price):'')+'</div></td>'+holders.map(t=>'<td><input type="number" class="stk" data-book="'+b.id+'" data-t="'+t.id+'" value="'+stockOf(b.id,t.id)+'" min="0" style="width:56px"></td>').join('')+'<td><b>'+tot+'</b></td><td>'+(need?badge(need>tot?'b-bad':'b-brass',need+'명'):'')+'</td></tr>';}).join('')+'</tbody></table></div>'+
    '<div class="bar" style="margin-top:10px"><button class="btn p" data-act="saveStock">재고 저장</button><span class="note">숫자를 고치고 저장 — 입고·반납·실사 모두 여기서. 빨간 줄 = 대기 인원보다 재고가 적음'+(low.length?': '+low.map(h).join(', '):'')+'</span></div>'+
    '<div class="row" style="margin-top:10px;border-top:1px solid var(--line-2);padding-top:10px"><label class="f">입고<select id="in_book">'+opt(books,'',b=>b.book_name)+'</select></label><label class="f">담당<select id="in_t">'+holders.map(t=>'<option value="'+t.id+'"'+(me&&me.id===t.id?' selected':'')+'>'+h(t.name)+'</option>').join('')+'</select></label><label class="f">수량<input type="number" id="in_q" value="5" min="1" style="width:64px"></label><button class="btn" data-act="stockIn">입고 처리</button></div>';}
  else{const cur=todayISO().slice(0,7);const months=[];let ym=cur;for(let i=0;i<7;i++){months.unshift(ym);ym=prevYm(ym);}
    const rows=S.students.filter(s=>s.status==='ACTIVE'&&(!loc||s.location_id===loc)&&(!tch||s.homeroom_teacher_id===tch)).sort((a,b)=>(a.homeroom_teacher_id||'').localeCompare(b.homeroom_teacher_id||'')||a.name.localeCompare(b.name,'ko'));
    const cell=(s,m)=>{const its=S.issues.filter(i=>i.student_id===s.id&&ymOf(i.date)===m);if(!its.length)return '<td></td>';const st=its.some(i=>i.status==='PLANNED')?'PLANNED':its.every(i=>i.status==='PAID')?'PAID':its.some(i=>i.status==='NOTIFIED')?'NOTIFIED':'ISSUED';return '<td style="background:'+ISSUE_BG[st]+'">'+its.map(i=>'<span class="link" data-act="issueEdit" data-id="'+i.id+'" style="cursor:pointer">'+h((byId(S.books,i.book_id)||{}).book_name||'?')+(i.qty>1?' ×'+i.qty:'')+(i.price?'('+h(won(i.price))+')':'')+(i.status==='PLANNED'?' <small>예정</small>':'')+'</span>').join(', ')+'</td>';};
    const ed=q.edit?byId(S.issues,q.edit):null;
    body=(ed?'<div class="panel" style="border-color:var(--brass)"><div class="bar"><b>'+h(nameOf(S.students,ed.student_id))+' · '+h((byId(S.books,ed.book_id)||{}).book_name||'')+'</b><span class="sp"></span><a class="btn s" href="#/books?tab=log'+(loc?'&loc='+loc:'')+'">닫기</a></div><div class="row" style="margin-top:8px"><label class="f">상태<select id="ie_st">'+Object.entries(ISSUE_ST).map(([k,v])=>'<option value="'+k+'"'+(ed.status===k?' selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="f">날짜<input type="date" id="ie_date" value="'+h(ed.date)+'"></label><label class="f">수량<input type="number" id="ie_q" value="'+ed.qty+'" min="1" style="width:60px"></label><label class="f">가격<input type="number" id="ie_p" value="'+h(ed.price!=null?ed.price:'')+'" step="500" style="width:90px"></label><label class="f">담당<select id="ie_t">'+opt(S.teachers,ed.teacher_id||'')+'</select></label><label class="f" style="flex:1;min-width:160px">메모<input type="text" id="ie_n" value="'+h(ed.note||'')+'" style="width:100%"></label><button class="btn p" data-act="issueSave" data-id="'+ed.id+'">저장</button><button class="btn d" data-act="issueDel" data-id="'+ed.id+'">삭제</button></div></div>':'')+
    '<div class="tw"><table class="t" style="font-size:13px"><thead><tr><th>담임</th><th>학생</th>'+months.map(m=>'<th>'+Number(m.slice(5,7))+'월</th>').join('')+'</tr></thead><tbody>'+rows.map(s=>'<tr><td class="note">'+h(nameOf(S.teachers,s.homeroom_teacher_id))+'</td><td><b>'+h(s.name)+'</b></td>'+months.map(m=>cell(s,m)).join('')+'</tr>').join('')+'</tbody></table></div><p class="note">기존 "교재입력" 시트와 같은 모양입니다. <span style="background:var(--paid-soft);padding:0 6px">보라</span> = 입금 확인 · <span style="background:var(--brass-soft);padding:0 6px">금색</span> = 결제 안내함 · 회색 = 지급(안내 전) · <span style="background:var(--warn-soft);padding:0 6px">주황</span> = 안내 예정. 항목을 누르면 고칠 수 있습니다.</p>';}
  return '<div class="bar"><div><h1>교재 지급 · 재고</h1><p class="sub" style="margin:0">담당 선생님별로 누가 어떤 교재를 받았고, 손에 몇 권 남았는지. 지급은 학생 교재 설정에서 자동으로 올라옵니다.</p></div><span class="sp"></span><label class="f">지점<select class="hq" data-k="loc"><option value="">전체</option>'+opt(S.locations,loc)+'</select></label><label class="f">담임<select class="hq" data-k="tch"><option value="">전체</option>'+opt(teachers,tch)+'</select></label></div>'+tabs+'<div class="panel">'+body+'</div>';

function route(){const raw=location.hash.replace(/^#\/?/,'')||'home';const i=raw.indexOf('?');const path=i<0?raw:raw.slice(0,i);const qs=i<0?'':raw.slice(i+1);const parts=path.split('/');const q={};if(qs)for(const kv of qs.split('&')){const j=kv.indexOf('=');const k=j<0?kv:kv.slice(0,j);const v=j<0?'':kv.slice(j+1);try{q[decodeURIComponent(k)]=decodeURIComponent(v);}catch(e){q[k]=v;}}return{name:parts[0]||'home',id:parts[1]||null,q};}
function nav(name,id,q){const hash='#/'+name+(id?'/'+id:'')+(q&&Object.keys(q).length?'?'+qstr(q):'');if(location.hash===hash)render();else location.hash=hash;}
function applyTheme(){const t=(S.meta&&S.meta.theme)||'auto';if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;}
function attachPhotos(sess,acts){for(const a of acts){if(!a.photo_blob)continue;const act=sess.activities.find(x=>x.track_id===a.track_id&&x.activity_type==='INDIVIDUAL_PROGRESS');if(!act)continue;const id=sess.id+':'+a.track_id;act.photo_id=id;putPhoto(id,a.photo_blob).then(ok=>{if(!ok)toast('사진 저장 실패');});}for(const k of Object.keys(PENDING_PHOTOS))delete PENDING_PHOTOS[k];persist();}
function readSchedules(prev){const days=[...document.querySelectorAll('.wd:checked')].map(x=>Number(x.value));const time=($('#sf_time')&&$('#sf_time').value)||'14:00';return days.map(weekday=>{const old=(prev||[]).find(x=>x.weekday===weekday)||{};return{weekday,time,ip_time:old.ip_time||null,teacher_id:old.teacher_id||null};});}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);toast('복사됨');return;}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('복사됨');}catch(e){toast('복사하지 못했습니다. 직접 선택해 복사하세요.');}
  document.body.removeChild(ta);
}
function noticeTextOf(x){const ta=$('#nt_cm_'+x.id);return ta?ta.value:x.daily_comment;}
function noticeRows(date,loc){return S.sessions.filter(x=>x.session_date===date&&(!loc||x.location_id===loc)).map(x=>({x,s:studentOf(x.student_id)})).filter(r=>r.s).sort((a,b)=>{const ta=(a.s.schedules.find(y=>y.weekday===wdOf(date))||{}).time||'99',tb=(b.s.schedules.find(y=>y.weekday===wdOf(date))||{}).time||'99';return ta.localeCompare(tb)||a.s.name.localeCompare(b.s.name,'ko');});}

function ask(msg,opts){opts=opts||{};return new Promise(res=>{let m=$('#modal');if(!m){m=document.createElement('div');m.id='modal';document.body.appendChild(m);}
  m.innerHTML='<div class="mbox" role="dialog" aria-modal="true"><div>'+h(msg)+'</div><div class="mbar">'+(opts.alert?'':'<button class="btn" id="mdNo">취소</button>')+'<button class="btn p" id="mdOk">'+(opts.alert?'확인':'계속')+'</button></div></div>';
  m.classList.add('on');const done=v=>{m.classList.remove('on');m.innerHTML='';document.removeEventListener('keydown',kd);res(v);};const kd=e=>{if(e.key==='Escape')done(false);if(e.key==='Enter')done(true);};document.addEventListener('keydown',kd);
  $('#mdOk').onclick=()=>done(true);const no=$('#mdNo');if(no)no.onclick=()=>done(false);m.onclick=e=>{if(e.target===m)done(false);};setTimeout(()=>$('#mdOk').focus(),30);});}
function say(msg){return ask(msg,{alert:true});}

  async delLocation(el){const l=locOf(el.dataset.id);if(!l)return;if(S.locations.length<=1){toast('지점은 최소 1개 필요합니다.');return;}if(S.students.some(x=>x.location_id===l.id&&x.status!=='WITHDRAWN')||S.teachers.some(t=>t.location_id===l.id)){toast('학생이나 강사가 배정된 지점은 삭제할 수 없습니다.');return;}if(!await ask(l.name+' 지점을 삭제할까요?'))return;S.locations=S.locations.filter(x=>x.id!==l.id);for(const x of S.students)if(x.location_id===l.id)x.location_id=S.locations[0].id;persist();toast('삭제됨');render();},
  issue(el){const k=el.dataset.sid+'_'+el.dataset.book;const q=$('#iq_'+k)?$('#iq_'+k).value:1,p=$('#ip_'+k)?$('#ip_'+k).value:'',d=$('#id_'+k)?$('#id_'+k).value:todayISO();const s=studentOf(el.dataset.sid);const it=issueBook(el.dataset.sid,el.dataset.book,myId(s?s.homeroom_teacher_id:null),el.dataset.st,q,p,d,'');if(!it)return;persist();toast((s?s.name:'')+' · '+ISSUE_ST[it.status]);render();},
  async issueAllExisting(el){const needs=issueNeeds(el.dataset.loc||'').filter(x=>!el.dataset.tch||x.s.homeroom_teacher_id===el.dataset.tch);if(!needs.length)return;if(!await ask(needs.length+'건을 "이미 지급됨"으로 표시합니다. 재고는 차감하지 않습니다. 계속할까요?'))return;
    for(const x of needs){if(x.planned){x.planned.status='ISSUED';continue;}S.issues.push({id:uid('is'),student_id:x.s.id,book_id:x.b.id,teacher_id:x.s.homeroom_teacher_id||null,date:x.t.started_at||todayISO(),qty:1,price:x.b.price!=null?x.b.price:null,status:'ISSUED',note:'기존 지급분 정리'});}
    persist();toast(needs.length+'건 정리됨');render();},
  paySet(el){const it=byId(S.issues,el.dataset.id);if(!it)return;const p=$('#pp_'+it.id);if(p&&p.value!=='')it.price=num(p.value);it.status=el.dataset.st;if(el.dataset.st==='PAID')it.paid_at=todayISO();if(el.dataset.st==='NOTIFIED')it.notified_at=todayISO();persist();toast(ISSUE_ST[it.status]);render();},
  payCopy(el){const it=byId(S.issues,el.dataset.id);if(!it)return;const p=$('#pp_'+it.id);if(p&&p.value!=='')it.price=num(p.value);copyText(payNotice(it));},
  payCopyAll(el){const its=S.issues.filter(i=>i.status==='ISSUED').filter(i=>{const s=studentOf(i.student_id);return s&&(!el.dataset.loc||s.location_id===el.dataset.loc)&&(!el.dataset.tch||s.homeroom_teacher_id===el.dataset.tch);});if(!its.length)return;copyText(its.map(payNotice).join('\n\n────────────\n\n'));},
  payNotifyAll(el){const its=S.issues.filter(i=>i.status==='ISSUED').filter(i=>{const s=studentOf(i.student_id);return s&&(!el.dataset.loc||s.location_id===el.dataset.loc)&&(!el.dataset.tch||s.homeroom_teacher_id===el.dataset.tch);});for(const i of its){i.status='NOTIFIED';i.notified_at=todayISO();}persist();toast(its.length+'건 안내함 처리');render();},
  saveStock(){for(const el of document.querySelectorAll('.stk'))setStock(el.dataset.book,el.dataset.t,Math.max(0,num(el.value,0)));persist();toast('재고 저장');render();},
  stockIn(){const b=$('#in_book').value,t=$('#in_t').value,q=Math.max(1,num($('#in_q').value,1));setStock(b,t,stockOf(b,t)+q);persist();toast('입고 +'+q);render();},
  issueEdit(el){const r=route();nav('books',null,Object.assign({},r.q,{tab:'log',edit:el.dataset.id}));},
  issueSave(el){const it=byId(S.issues,el.dataset.id);if(!it)return;const was=it.status;it.status=$('#ie_st').value;it.date=$('#ie_date').value||it.date;it.qty=Math.max(1,num($('#ie_q').value,1));it.price=$('#ie_p').value===''?null:num($('#ie_p').value);it.teacher_id=$('#ie_t').value||null;it.note=$('#ie_n').value.trim();
    if(was==='PLANNED'&&it.status!=='PLANNED'){const hd=it.teacher_id||'';setStock(it.book_id,hd,stockOf(it.book_id,hd)-it.qty);}persist();toast('저장됨');const r=route();nav('books',null,{tab:'log',loc:r.q.loc||''});},
  async issueDel(el){const it=byId(S.issues,el.dataset.id);if(!it)return;if(!await ask('이 지급 기록을 삭제할까요? (재고는 되돌리지 않습니다)'))return;S.issues=S.issues.filter(x=>x.id!==it.id);persist();const r=route();nav('books',null,{tab:'log',loc:r.q.loc||''});},
  addTeacher(){const name=$('#tf_name').value.trim();if(!name){toast('이름을 입력하세요.');return;}const pin=($('#tf_pin')&&$('#tf_pin').value.trim())||null;if(pin&&!/^\d{4,6}$/.test(pin)){toast('PIN은 숫자 4~6자리');return;}S.teachers.push({id:uid('t'),name,role:$('#tf_role').value,pin});persist();render();},
  async delTeacher(el){const id=el.dataset.id;const t=byId(S.teachers,id);if(!t)return;if(S.teachers.length<=1){toast('강사는 최소 1명 필요합니다.');return;}const me=currentUser();if(me&&me.id===id){toast('로그인 중인 본인은 삭제할 수 없습니다.');return;}
    const rest=S.teachers.filter(x=>x.id!==id);if(!rest.some(x=>x.role==='DIRECTOR')){toast('원장(관리자)은 최소 1명 남아야 합니다.');return;}
    const kids=S.students.filter(s=>s.homeroom_teacher_id===id);const slots=[];for(const s of S.students)for(const sc of (s.schedules||[]))if(sc.teacher_id===id)slots.push(sc);
    const to=(me&&me.id!==id?me:null)||rest.find(x=>x.role==='DIRECTOR')||rest[0];
    if(!await ask(t.name+' 강사를 삭제합니다.'+(kids.length?'\n담임 학생 '+kids.length+'명은 '+to.name+'에게 넘어갑니다 (학생 정보에서 바꿀 수 있음).':'')+(slots.length?'\n시간표 배정 '+slots.length+'건은 미배정이 됩니다.':'')+'\n기존 세션·기록의 강사 이름은 그대로 남습니다. 계속할까요?'))return;
    for(const s of kids)s.homeroom_teacher_id=to.id;for(const sc of slots){sc.teacher_id=null;sc.ip_time=null;}
    S.teachers=rest;persist();toast(t.name+' 삭제'+(kids.length?' · 담임 '+kids.length+'명 → '+to.name:''));render();},
  addBook(){const title=$('#ob_title').value.trim();if(!title){toast('제목을 입력하세요.');return;}S.original_books.push({id:uid('ob'),title,series:$('#ob_series').value.trim(),ar_level:num($('#ob_ar').value,0),active:true});persist();render();},
  delBook(el){S.original_books=S.original_books.filter(b=>b.id!==el.dataset.id);persist();render();},
  export(){const box=$('#dataBox');box.value=JSON.stringify(S,null,1);box.focus();box.select();toast('JSON을 복사해 두세요.');},
  import(){const box=$('#dataBox');try{const o=migrate(JSON.parse(box.value));if(!o||!Array.isArray(o.students)||!Array.isArray(o.books))throw new Error('형식이 다릅니다');S=o;persist();applyTheme();toast('가져오기 완료');render();}catch(e){toast('가져오기 실패: '+e.message);}},
  async reset(){if(!await ask('모든 데이터를 지우고 처음 상태(노션 재원생 명단 97명)로 되돌립니다. 계속할까요?'))return;resetToSeed();applyTheme();toast('시드 데이터로 초기화됨');render();}
};

document.addEventListener('submit',e=>{if(e.target&&e.target.id==='loginForm'){e.preventDefault();ACT.login();}if(e.target&&e.target.id==='cloudLoginForm'){e.preventDefault();ACT.cloudLogin();}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;if(el.type!=='checkbox')e.preventDefault();try{const r=fn(el);if(r&&typeof r.catch==='function')r.catch(err=>{console.error(err);toast('오류: '+err.message);});}catch(err){console.error(err);toast('오류: '+err.message);}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.classList.contains('hq')){const r=route();r.q[el.dataset.k]=el.value;nav(r.name,r.id,r.q);return;}
  if(el.classList.contains('hwTrack')){const row=el.closest('.hwrow');const box=$('#hwRows');if(!row||!box)return;const hc=activeTracks(box.dataset.sid).filter(x=>x.next_unit_id||x.category==='VOCAB');const t=el.value==='__custom'?null:byId(S.tracks,el.value);row.outerHTML=hwRow(row.dataset.i,t,hc,'');if(!t){const f=$('#hwName_'+row.dataset.i);if(f)f.focus();}return;}
  if(el.classList.contains('ipTrack')){const t=byId(S.tracks,el.value);const body=$('#ipBody_'+el.dataset.i);if(t&&body)body.innerHTML=ipBody(el.dataset.i,t);return;}
  if(el.classList.contains('vtU')){const r=$('#vtR_'+el.dataset.t);if(r){r.hidden=el.value!=='__review';if(!r.hidden)r.focus();}return;}
  if(el.classList.contains('ipst')){const box=$('#ov_'+el.dataset.i);if(box)box.hidden=el.value!=='OTHER';return;}
  if(el.classList.contains('wph')){const f=el.files&&el.files[0];if(!f)return;const key=el.dataset.i!=null?el.dataset.i:el.dataset.id;shrinkImage(f,1200).then(b=>{PENDING_PHOTOS[key]=b;const pv=$('#wph_prev_'+key);if(pv)pv.innerHTML='<img src="'+URL.createObjectURL(b)+'" class="wphoto" alt="미리보기"> 저장하면 기록에 붙습니다';});return;}
  if(el.classList.contains('tf_book')){const b=byId(S.books,el.value);const row=el.closest('tr');row.querySelector('.tf_unit').innerHTML=b?nextUnitOptions(b,firstUnit(b)?firstUnit(b).id:''):'';const m=row.querySelector('.tf_mode');if(b){m.value=defaultMode(b.category);m.disabled=b.category==='VOCAB';}const rd=row.querySelector('input[name="defTrack"]');if(rd)rd.disabled=!b||m.value!=='ACADEMY';return;}
  if(el.classList.contains('tf_mode')){const row=el.closest('tr');const rd=row.querySelector('input[name="defTrack"]');if(rd){rd.disabled=el.value!=='ACADEMY';if(rd.disabled)rd.checked=false;}return;}
  if(el.id==='theme'){S.meta.theme=el.value;applyTheme();persist();return;}
  if(el.classList.contains('tloc')){const t=byId(S.teachers,el.dataset.id);if(t){t.location_id=el.value||null;persist();toast('강사 지점 저장');}return;}
});
function recalcRubric(i){
  const box=document.querySelector('.rbox[data-i="'+i+'"]');if(!box)return;const target=num(box.dataset.target,8);
  const n=$('#ev_n_'+i).value,e=$('#ev_e_'+i).value;const ideas=document.querySelectorAll('.idea[data-i="'+i+'"]:checked').length;const own=$('#ev_own_'+i).checked;
  const parts=[];
  if(n!==''){$('#rb_acc_'+i).value=scoreAccuracy(n,e===''?0:e);$('#rb_expr_'+i).value=scoreExpression(n,target,own);parts.push(n+'문장 중 오류 '+(e===''?0:e)+' → 문장력 '+$('#rb_acc_'+i).value,'기대 '+target+'문장 대비 → 자기표현 '+$('#rb_expr_'+i).value);}
  if(ideas>0||n!==''){$('#rb_idea_'+i).value=scoreIdea(ideas);parts.push('사고 체크 '+ideas+'/5 → 사고력 '+$('#rb_idea_'+i).value);}
  const sum=$('#rbsum_'+i);if(sum)sum.textContent=parts.length?'자동 계산: '+parts.join(' · ')+' (직접 고칠 수 있음)':'';
}
document.addEventListener('change',e=>{const el=e.target;if(el.classList.contains('rbe'))recalcRubric(el.dataset.i);});
document.addEventListener('input',e=>{const el=e.target;if(el.classList.contains('rbe')&&el.type==='number'){recalcRubric(el.dataset.i);return;}if(!el.classList.contains('vt'))return;const tid=el.dataset.t;const p=pct1($('#vt_'+tid).value,$('#vtT_'+tid).value);const j=$('#vtj_'+tid);if(!j)return;
  if(p==null){j.textContent='점수를 입력하면 자동 판정 · 안 봤으면 비워두세요';j.className='note';return;}
  const R=S.rules;const res=p>=num(R.VOCAB_THRESHOLD.vocab_pass,90)?'PASS':p>=num(R.VOCAB_THRESHOLD.vocab_check,80)?'CHECK':'RETEST';
  j.innerHTML=badge(res==='PASS'?'b-good':res==='CHECK'?'b-warn':'b-bad',p+'% · '+res+(res==='PASS'||(res==='CHECK'&&R.VOCAB_CHECK_MODE.mode!=='REPEAT')?' → 다음 Unit':' → 같은 Unit'));j.className='';
});

const ROUTES={login:viewLogin,books:viewBooks,home:viewHome,students:viewStudents,student:viewStudent,session:viewSession,chart:viewChart,map:viewMap,report:viewReport,reports:viewReports,curriculum:viewCurriculum,tests:viewTests,alerts:viewAlerts,admin:viewAdmin,notices:viewNotices,approvals:viewApprovals,manuals:viewManuals,manual:viewManual,authority:viewAuthority,dashboard:viewDashboard,timetable:viewTimetable,rank:viewRank,board:viewBoard};
const NAV_TEACHER=[['home','오늘'],['students','학생'],['timetable','시간표'],['alerts','할 일'],['notices','알림장','more'],['books','교재 지급','more'],['reports','리포트','more'],['manuals','매뉴얼','more'],['rank','랭킹','more'],['curriculum','커리큘럼','more'],['tests','교재 시험','more']];
const NAV_DIRECTOR=[['dashboard','대시보드'],['approvals','결정'],['alerts','할 일'],['home','오늘'],['students','학생'],['timetable','시간표'],['notices','알림장','more'],['books','교재 지급','more'],['reports','리포트','more'],['manuals','매뉴얼','more'],['rank','랭킹','more'],['authority','권한표','more'],['curriculum','커리큘럼','more'],['tests','교재 시험','more'],['admin','설정','more']];
function renderNav(){const dir=isDirector();const items=dir?NAV_DIRECTOR:NAV_TEACHER;const pend=(S.approvals||[]).filter(a=>!a.decision).length;const todo=(S.alerts||[]).filter(a=>a.status==='OPEN'||a.status==='ACKNOWLEDGED').length;let needN=0;try{needN=issueNeeds().length;}catch(e){console.error(e);}
  $('#nav').innerHTML=items.map(([r,l])=>'<a href="#/'+r+'" data-r="'+r+'">'+l+(r==='approvals'&&pend?' <span class="badge b-brass" style="padding:0 6px">'+pend+'</span>':'')+(r==='alerts'&&todo?' <span class="badge b-bad" style="padding:0 6px">'+todo+'</span>':'')+(r==='books'&&needN?' <span class="badge b-brass" style="padding:0 6px">'+needN+'</span>':'')+'</a>').join('');const me=currentUser();const w=$('#whoami');if(w)w.textContent=me?me.name+' · '+roleL(me):'';cloudSetStatus(cloudStatus.text,cloudStatus.cls);}
function render(){
  const r=route();const me=currentUser();
  if(cloudOn()&&!cloudAuthed()&&r.name!=='board'){document.body.classList.add('login');document.body.classList.remove('kiosk');$('#app').innerHTML=viewCloudLogin();const f=$('#cl_pass');if(f)f.focus();return;}
  if(!me&&r.name!=='board'){document.body.classList.add('login');document.body.classList.remove('kiosk');$('#app').innerHTML=viewLogin(r.q);const f=$('#lg_user');if(f)f.focus();return;}
  document.body.classList.remove('login');if(r.name==='login'){nav(isDirector()?'dashboard':'home');return;}
  const fn=ROUTES[r.name]||viewHome;let html;
  try{html=(r.name==='student'||r.name==='session'||r.name==='chart'||r.name==='map'||r.name==='report'||r.name==='manual')?fn(r.id,r.q):fn(r.q);}catch(err){console.error(err);html='<div class="empty">화면을 그리는 중 오류가 났습니다: '+h(err.message)+'<br><br><button class="btn" data-act="reset">시드 데이터로 초기화</button></div>';}
  $('#app').innerHTML=html;hydratePhotos();document.body.classList.toggle('kiosk',r.name==='board');clearInterval(render._bd);if(r.name==='board')render._bd=setInterval(()=>{const c=$('#bd_clock');if(c)c.textContent=new Date().toTimeString().slice(0,5);},30000);
  const active=r.name==='session'?'home':(r.name==='student'||r.name==='chart'||r.name==='map')?'students':r.name==='report'?'reports':r.name==='manual'?'manuals':r.name;
  try{renderNav();}catch(e){console.error(e);$('#nav').innerHTML=(isDirector()?NAV_DIRECTOR:NAV_TEACHER).map(([r,l])=>'<a href="#/'+r+'" data-r="'+r+'">'+l+'</a>').join('');}document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===active));
  window.scrollTo(0,0);
}
function fillMissingNotices(){let n=0;for(const x of S.sessions){if(!x.daily_comment){if(!x.homework_notice)x.homework_notice=genHomeworkNotice(x);x.daily_comment=genComment(x);n++;}}if(n)persist();}
S=loadState();fillMissingNotices();applyTheme();cloudBoot();
window.addEventListener('hashchange',render);window.addEventListener('beforeunload',e=>{if(cloudAuthed()&&(CLOUD_DIRTY||dirtyGet())){cloudPush(false);e.preventDefault();e.returnValue='아직 서버에 저장되지 않은 기록이 있습니다.';}});
if(!location.hash)location.hash='#/home';
render();
