<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPL OS v0.2 — 개별진도 운영 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ebe9e4;--surface:#f7f6f3;--surface-2:#ffffff;--ink:#1c2128;--muted:#676c74;--line:#d6d2ca;--line-2:#e6e3dd;
  --navy:#1b2a41;--on-navy:#f2efe8;--brass:#a8843f;--brass-ink:#7e6127;--brass-soft:#f1eadb;
  --paid:#5b4b8a;--paid-soft:#e9e3f4;--good:#3b7a5a;--good-soft:#e3efe8;--warn:#9a6a1f;--warn-soft:#f3e8d1;--bad:#a94438;--bad-soft:#f4e1de;--info:#4f6a8a;--info-soft:#e3e9f0;
  --title:#1b2a41;--r:8px;--r-sm:5px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paid-soft:#2d2742;--bg:#10161f;--surface:#171f2a;--surface-2:#1d2735;--ink:#e6e4df;--muted:#98a0aa;--line:#2b3644;--line-2:#232d3a;--title:#e6e4df;--brass:#c6a35a;--brass-ink:#d9bb78;--brass-soft:#2a2519;--good:#7fbf9c;--good-soft:#1c2c24;--warn:#d1a55a;--warn-soft:#2c2416;--bad:#e08a7f;--bad-soft:#33201d;--info:#8fa9c8;--info-soft:#1e2733;}
}
:root[data-theme="dark"]{--bg:#10161f;--surface:#171f2a;--surface-2:#1d2735;--ink:#e6e4df;--muted:#98a0aa;--line:#2b3644;--line-2:#232d3a;--title:#e6e4df;--brass:#c6a35a;--brass-ink:#d9bb78;--brass-soft:#2a2519;--good:#7fbf9c;--good-soft:#1c2c24;--warn:#d1a55a;--warn-soft:#2c2416;--bad:#e08a7f;--bad-soft:#33201d;--info:#8fa9c8;--info-soft:#1e2733;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:var(--on-navy)}
.top .in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:22px;letter-spacing:-.01em;color:var(--on-navy);text-decoration:none;white-space:nowrap}
.brand small{font-family:'IBM Plex Sans KR','Pretendard',system-ui,sans-serif;font-weight:400;font-size:12px;opacity:.7;margin-left:8px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{color:var(--on-navy);opacity:.72;text-decoration:none;padding:6px 10px;border-radius:var(--r-sm);font-size:14px}
nav a.on{opacity:1;background:rgba(255,255,255,.12)}
.qk input[type=text],.qk input[type=number],.qk select{padding:5px 8px}
nav a:hover{opacity:1}
main{max-width:1120px;margin:0 auto;padding:22px 20px 70px}
h1{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:26px;line-height:1.2;margin:0 0 4px;color:var(--title)}
h2{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:18px;margin:0 0 10px;color:var(--title)}
h3{font-size:15px;font-weight:600;margin:14px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.bar .sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;max-width:100%}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.5}
.b-good{background:var(--good-soft);color:var(--good)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-muted{background:var(--line-2);color:var(--muted)}.b-brass{background:var(--brass-soft);color:var(--brass-ink)}
.btn{font:inherit;font-size:14px;font-weight:500;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;line-height:1.4}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.b{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.s{padding:4px 10px;font-size:13px}
.btn.d{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);max-width:100%}
input[type=number]{width:84px}
input[type=text]{min-width:120px}
textarea{width:100%;min-height:64px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.st{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.st:first-child{border-top:0}
.st .time{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:22px;font-weight:500;color:var(--title);line-height:1.1}
.st .time small{display:block;font-family:'IBM Plex Sans KR','Pretendard',system-ui,sans-serif;font-size:12px;color:var(--muted);margin-top:4px}
.st .who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.st .who .nm{font-size:17px;font-weight:600;color:var(--ink);text-decoration:none}
.st .who .ar{color:var(--muted);font-size:13px}
.st .who .sp{flex:1}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.slot{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;min-height:64px}
.slot .k{font-size:12px;color:var(--muted)}
.slot .u{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;color:var(--brass-ink);line-height:1.15}
.slot .u.small{font-size:15px;font-family:inherit;font-weight:500}
.slot .bk{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{font-size:13px;color:var(--muted)}
.confirm{border-left:3px solid var(--brass);padding:12px 16px;background:var(--brass-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;margin:12px 0}
.confirm .big{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:19px;color:var(--title);margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:var(--r-sm);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.srow{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line-2)}
.srow:first-of-type{border-top:0}
.srow .n{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:20px;color:var(--brass-ink);font-weight:600;line-height:1.2}
.srow .ttl{font-weight:600;margin-bottom:6px}
.srow .auto{color:var(--muted);font-size:13px;margin-left:6px}
.radios{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.pick-h{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;border-bottom:1px solid var(--line-2);padding-bottom:4px}
.pick-bk{display:block;width:100%;text-align:left;font:inherit;font-size:13px;padding:5px 8px;margin:2px 0;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;color:var(--muted);cursor:pointer}
.pick-bk:hover{border-color:var(--brass);color:var(--ink);background:var(--surface-2)}
.pick-bk.mine{color:var(--ink);font-weight:600;background:var(--surface-2);border-color:var(--line)}
.pick-bk.used{opacity:.45}
.line .lbl{min-width:150px}
.srow .ttl{margin-bottom:4px}
.chip-opt{cursor:pointer}
.chip-opt input{position:absolute;opacity:0;width:0;height:0}
.chip-opt span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;background:var(--surface-2);color:var(--ink);line-height:1.3}
.chip-opt input:checked+span{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.chip-opt input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
details.more{display:inline-block}
details.more>summary{list-style:none;cursor:pointer;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:inline-block;background:var(--surface-2)}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{color:var(--ink)}
details.more>*:not(summary){margin-top:6px}
.radios label{display:flex;align-items:center;gap:5px;font-size:14px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tabs a{font-size:14px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);color:var(--ink);text-decoration:none}
.tabs a.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.chain{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.chain .bk{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:6px 10px;font-size:13px}
.chain .bk.off{opacity:.5}
.chain .arr{color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--info);cursor:pointer;font:inherit;text-decoration:underline}
a{color:var(--info)}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 8px;font-size:13px;background:var(--surface-2)}
.hist span.done{border-color:var(--good);color:var(--good)}
.hist span.cur{border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.ban{border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;margin-bottom:12px}
.spark{display:block;max-width:100%;height:auto}
.bar-track{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;min-width:80px}
.bar-fill{height:100%;background:var(--brass)}
.metric{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric .m{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.metric .m .v{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;color:var(--title);line-height:1.1}
.metric .m .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.metric .m .d{font-size:12px;color:var(--muted);margin-top:4px}
.notes .n1{padding:10px 0;border-top:1px solid var(--line-2)}
.notes .n1:first-child{border-top:0}
.notes .meta{font-size:12px;color:var(--muted);margin-bottom:3px}
.rep{white-space:pre-line;line-height:1.7}
.rep h3{margin:12px 0 4px}
.gmap{width:100%;border-collapse:collapse;font-size:13px;border:2px solid var(--title);background:var(--surface-2)}
.gmap th{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;font-size:15px;text-align:center;padding:10px;border-bottom:2px solid var(--title);border-left:1px solid var(--line);color:var(--title)}
.gmap th.lv{font-family:inherit;font-size:11px;letter-spacing:.14em;color:var(--muted);text-align:left;font-weight:500;padding-left:14px}
.gmap td{border:1px solid var(--line-2);padding:8px 10px;vertical-align:middle}
.gmap td.lvcell{width:150px;border-left:6px solid var(--navy);vertical-align:top;padding:12px;background:var(--surface)}
.gmap .lvcell .no{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:26px;font-weight:600;color:var(--title);line-height:1}
.gmap .lvcell .nm{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:18px;font-weight:600;color:var(--ink);margin-top:4px}
.gmap .lvcell .tag{font-size:12px;color:var(--muted);margin-top:2px}
.gmap td.sk{width:104px;font-size:11px;letter-spacing:.1em;color:var(--muted);padding-left:14px;white-space:nowrap}
.gmap td.cell{cursor:pointer;min-width:150px}
.gmap td.cell.st-DONE{background:var(--line-2);color:var(--ink)}
.gmap td.cell .mk{float:right;margin-left:8px}
.gmap td.cell.st-DONE .mk{color:var(--good)}
.gmap td.cell.st-ACTIVE{outline:2px solid var(--brass);outline-offset:-2px;background:var(--brass-soft);font-weight:600;color:var(--ink)}
.gmap td.cell.st-ACTIVE .mk{color:var(--brass-ink);font-size:11px;font-weight:500}
.gmap td.cell.st-TODO{color:var(--muted)}
.gmap td.cell.st-MASTER{cursor:pointer;color:var(--ink)}
.gmap td.cell.st-MASTER:hover{outline:2px solid var(--muted);outline-offset:-2px}
.gmap td.cell.st-EDIT{outline:2px solid var(--brass)!important;outline-offset:-2px;background:var(--brass-soft)}
.gmap td.cell .plus{display:inline-block;font-size:12px;color:var(--brass-ink);border:1px dashed var(--brass);border-radius:999px;padding:2px 10px;background:var(--surface-2)}
.gmap td.cell .pen{color:var(--muted);font-size:12px;opacity:.6}
.gmap td.cell.st-MASTER:hover .pen{opacity:1;color:var(--brass-ink)}
.gmap td.cell.st-EMPTY{background:repeating-linear-gradient(45deg,transparent,transparent 6px,var(--line-2) 6px,var(--line-2) 7px);cursor:default}
.gmap td.cell:not(.st-EMPTY):not(.st-MASTER):hover{outline:2px solid var(--muted);outline-offset:-2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--surface-2);font-size:13px}
.chip b{color:var(--brass-ink);margin-right:6px;font-weight:600}
.pbar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;margin:8px 0}
.pbar div{height:100%;background:var(--brass)}
.lg{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;border:1px solid var(--line)}
.lg-done{background:var(--line-2)}.lg-act{border-color:var(--brass);background:var(--brass-soft)}.lg-todo{background:var(--surface-2)}
.rcard{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;max-width:760px;margin:0 auto 20px;color:var(--ink)}
.rc-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--title);padding-bottom:10px;margin-bottom:14px}
.rc-brand{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;color:var(--title)}
.rc-course{font-size:12px;letter-spacing:.12em;color:var(--muted);margin-top:2px}
.rc-ym{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:18px;color:var(--brass-ink)}
.rc-student{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.rc-name{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:26px;font-weight:600}
.rc-areas{width:100%;border-collapse:collapse;margin-bottom:10px}
.rc-areas td{padding:6px 4px;border-bottom:1px solid var(--line-2);font-size:14px}
.rc-areas td.rc-stars{text-align:right;color:var(--brass-ink);letter-spacing:2px;font-size:15px}
.rc-facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:6px 0 14px}
.rc-sec{margin-top:12px;break-inside:avoid}
.rc-sec h3{margin:0 0 4px;font-size:14px;color:var(--title)}
.rc-body{white-space:pre-line;line-height:1.75;font-size:14px}
.rc-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:18px;padding-top:8px;font-size:12px;color:var(--muted)}
.tt td,.tt th{text-align:center;padding:4px 6px}
.tt .tt-slot{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:600;color:var(--title);white-space:nowrap}
.tt .tt-cell{min-width:96px;height:30px;cursor:pointer;border-left:1px solid var(--line-2)}
.tt .tt-cell:hover{background:var(--brass-soft)}
.tt .tt-target{outline:1px dashed var(--brass);outline-offset:-2px}
.tt .tt-dup{background:var(--bad-soft)}
.tt .tt-name{display:inline-block;color:var(--ink);text-decoration:none;padding:1px 6px;border-radius:var(--r-sm)}
.tt .tt-name.on{background:var(--navy);color:var(--on-navy)}
.tt .tt-empty{color:var(--line)}
.print-only{display:none}
.rp-layout{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.rp-layout{grid-template-columns:1fr}}
.rp-form{background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:16px}
.rp-form .f{color:rgba(255,255,255,.75);margin-bottom:8px}
.rp-form input,.rp-form select,.rp-form textarea{width:100%;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--on-navy)}
.rp-form textarea{min-height:64px}
.rp-form .note{color:rgba(255,255,255,.6)}
.rp-form .rp-grp{font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.6);margin:14px 0 6px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px}
.rp-form .rp-grp:first-child{border-top:0;margin-top:0;padding-top:0}
.rp-form .rp-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.rp-form .rp-row select{width:100px}
.rp-form details summary{color:rgba(255,255,255,.7)}
.rpcard{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;color:var(--ink)}
#modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;place-items:center;z-index:50;padding:20px}
#modal.on{display:grid}
#modal .mbox{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:20px 22px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);white-space:pre-line;font-size:14px;line-height:1.55}
#modal .mbar{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#captureHost{position:fixed;left:-20000px;top:0;width:794px;background:#fff;z-index:-1}
#captureHost .rpcard{width:794px;min-height:1123px;border:0;border-radius:0;display:flex;flex-direction:column;background:#fff;color:#1a1f2b}
#captureHost .rpcard .rp-foot{margin-top:auto}
.rp-head{background:var(--navy);color:var(--on-navy);padding:22px 26px;display:flex;justify-content:space-between;align-items:center}
.rp-brand{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:26px;font-weight:600}

function ensureHwLineInTemplate(meta){
  if(!meta||meta.tpl_hw_added)return false;const tpl=typeof meta.comment_template==='string'?meta.comment_template:'';meta.tpl_hw_added=true;

// Adds the Growth Curriculum books to a book list (matching existing books by name) — used by seed() and by migration.
function ensureMapBooks(books){
  const ids=new Set(books.map(b=>b.id));
  for(const [level,cat,season,spec] of GROWTH_MAP){
    spec.split('|').forEach((name,alt)=>{
      let b=books.find(x=>x.category===cat&&normName(x.book_name)===normName(name))||books.find(x=>normName(x.book_name)===normName(name));
      if(!b){let id='b_'+slug(name);let k=2;while(ids.has(id))id='b_'+slug(name)+'_'+(k++);ids.add(id);
        b=mkBook(id,cat,name,'L'+level,'Unit',cat==='VOCAB'?30:12,cat==='GRAMMAR'||cat==='READING_HW',null,null,null,null);b.units_placeholder=true;books.push(b);}
      if(!Array.isArray(b.grid))b.grid=[];
      if(!b.grid.some(c=>c.level===level&&c.season===season))b.grid.push({level,season});
      b.alt=alt;
      if(cat==='WRITING'&&b.writing_target==null)b.writing_target=WRITING_TARGET_BY_LEVEL[level]||8;
    });
  }
  return books;
}

const MERGE_COLLECTIONS=['students','teachers','locations','books','tracks','sessions','alerts','events','approvals','manuals','assessments','chart_notes','monthly_reports','overrides','completion_tests','original_books','issues','stock','authority_rules','sessions_void'];

  if(m.completeRate!=null&&(m.completeRate<90||(b.completeRate!=null&&m.completeRate<b.completeRate-10)))f.complete='완료율 '+m.completeRate+'%';

function newTrack(sid,cat,bookId,curUnitId,mode,date){

const gridOf=b=>(b&&Array.isArray(b.grid)?b.grid:[]).slice().sort((x,y)=>x.level-y.level||x.season-y.season);

function mapCells(cat){const cells=[];for(const L of levelsOf())for(const se of SEASONS){const books=S.books.filter(b=>b.category===cat&&gridOf(b).some(c=>c.level===L.no&&c.season===se)).sort((a,b)=>(a.alt||0)-(b.alt||0));if(books.length)cells.push({level:L.no,season:se,key:cellKey(L.no,cat,se),books});}return cells;}

  if(!b)return null;if(b.next_book_id)return byId(S.books,b.next_book_id);
  const g=gridOf(b);if(!g.length)return null;const lastC=g[g.length-1];

  for(let j=i+1;j<cells.length;j++){const cands=cells[j].books.filter(x=>x.id!==b.id&&x.active!==false);if(cands.length)return cands.find(x=>(x.alt||0)===(b.alt||0))||cands[0];}

// --- growth map per student ---
function cellStatus(s,cell){
  const sid=s.id;const trs=S.tracks.filter(t=>t.student_id===sid&&cell.books.some(b=>b.id===t.book_id));
  if(trs.some(t=>t.active))return 'ACTIVE';

}
function mapStats(s){let done=0,active=0,total=0;const per={};for(const cat of CATS){for(const c of mapCells(cat)){total++;const st=cellStatus(s,c);if(st==='DONE')done++;else if(st==='ACTIVE')active++;}}return{done,active,total,todo:total-done-active,pct:total?Math.round(done/total*100):0};}

// --- 세션 되돌리기 · 삭제 · 다시 입력 (잘못 입력한 기록 정정) ---
// 같은 날짜에 기록이 여러 건이면 마지막 것만 '유효 기록'으로 본다 (포인트 · 알림장 집계)
function sessionsOnDay(sid,date){return S.sessions.filter(x=>x.student_id===sid&&x.session_date===date);}
function primaryOfDay(sid,date){const l=sessionsOnDay(sid,date);let p=null;for(const x of l){if(!p){p=x;continue;}const a=x.created_at||'',b=p.created_at||'';if(a>b||(a===b&&S.sessions.indexOf(x)>S.sessions.indexOf(p)))p=x;}return p;}
const isPrimarySession=x=>primaryOfDay(x.student_id,x.session_date)===x;
function recalcStreaks(t){
  const ss=sessionsOf(t.student_id);let hw=0,wr=0,vr=0,hwEnd=false,wrEnd=false,vrEnd=false;
  for(let i=ss.length-1;i>=0;i--)for(const a of ss[i].activities){if(a.track_id!==t.id)continue;

    if(a.activity_type==='VOCAB_TEST'&&a.result&&a.result!=='NA'&&!vrEnd){if(a.result==='RETEST')vr++;else vrEnd=true;}}

// 세션이 바꾼 진도 상태를 되돌린다. 그 Unit이 아직 '현재 Unit'일 때만 되돌리고, 이후 세션으로 더 나간 교재는 그대로 두고 알려 준다.
function revertSession(sess){
  const notes=[];const date=sess.session_date;const R=S.rules;
  for(let i=sess.activities.length-1;i>=0;i--){const a=sess.activities[i];if(!a.track_id||!a.unit_id)continue;const t=byId(S.tracks,a.track_id);if(!t)continue;const b=bookOf(t);if(!b)continue;
    const advancing=a.activity_type==='VOCAB_TEST'?(a.result==='PASS'||(a.result==='CHECK'&&R.VOCAB_CHECK_MODE.mode!=='REPEAT')):(a.status==='COMPLETED');

      if(t.current_unit_id===a.unit_id){
        const prev=prevUnitOf(b,a.unit_id);t.current_unit_id=prev?prev.id:null;t.next_unit_id=a.unit_id;t.repeat_count=0;
        if(t.status==='TEST_REQUIRED'||t.status==='PATH_END'){t.status='IN_PROGRESS';S.completion_tests=S.completion_tests.filter(x=>!(x.track_id===t.id&&(x.status==='READY_FOR_TEST'||x.status==='TEST_SCHEDULED')&&x.created_at===date));for(const al of S.alerts)if(al.track_id===t.id&&al.rule_code==='PATH_END'&&al.status!=='RESOLVED'){al.status='RESOLVED';al.resolved_at=todayISO();}}
        if(!t.active&&t.status==='COMPLETED'&&t.ended_at===date){const nt=S.tracks.find(x=>x.student_id===t.student_id&&x.category===t.category&&x.active&&x.started_at===date&&x.id!==t.id);const used=nt&&S.sessions.some(y=>y.id!==sess.id&&y.activities.some(z=>z.track_id===nt.id));
          if(nt&&!used){S.tracks=S.tracks.filter(x=>x.id!==nt.id);if(studentOf(t.student_id)&&studentOf(t.student_id).default_track_id===nt.id)studentOf(t.student_id).default_track_id=t.id;t.active=true;t.ended_at=null;t.status='IN_PROGRESS';}
          else notes.push(b.book_name+': 다음 교재가 이미 시작되어 되돌리지 않음');}
      }else notes.push(b.book_name+' '+unitShort(b,a.unit_id)+': 이후 진도가 있어 되돌리지 않음 (교재 설정에서 조정)');
    }else if(t.repeat_count>0)t.repeat_count-=1;

function deleteSession(id,reason){
  const x=byId(S.sessions,id);if(!x)return null;
  const notes=revertSession(x);
  S.sessions=S.sessions.filter(y=>y.id!==id);S.overrides=S.overrides.filter(o=>o.session_id!==id);
  for(const t of S.tracks.filter(t=>t.student_id===x.student_id))recalcStreaks(t);

// --- exception engine ---
const COMPUTED_RULES=['HW_MISS','HW_MISS_DIRECTOR','UNIT_REPEAT','VOCAB_RETEST','QUIZ_LOW','STAGNATION','WRITING_MISS','DECLINE','OVERRIDE_REPEAT','TEST_DUE_RTP','TEST_DUE_NELT'];
const rubricAvg=r=>{if(!r)return null;const v=[r.acc,r.idea,r.expr].filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null;};
function evaluateStudent(sid,date){
  const R=S.rules;const active=[];const created=[];const today=date||todayISO();
  const add=(rule,track_id,severity,message,action)=>{active.push(rule+'|'+(track_id||''));const al=raiseAlert({student_id:sid,track_id:track_id||null,rule_code:rule,severity,message,action,created_at:today});if(al)created.push(al);};
  const trs=activeTracks(sid);const sess=sessionsOf(sid);
  for(const t of trs){
    const b=bookOf(t);if(!b)continue;
    if(t.delivery_mode==='HOME'&&(t.hw_miss_streak||0)>=num(R.HW_MISS.streak,2))add('HW_MISS',t.id,'WARN',b.book_name+' · '+(t.category==='VOCAB'?'온라인 학습':'숙제')+' 미완료 '+t.hw_miss_streak+'회 연속','학부모 연락 · 숙제 루틴 확인');
    if(t.next_unit_id){const n=unitAttempts(t,t.next_unit_id);if(n>=num(R.UNIT_REPEAT.count,3))add('UNIT_REPEAT',t.id,'ACTION',b.book_name+' · '+unitLong(b,t.next_unit_id)+' 반복 '+n+'회','Teacher Check Required');}
    if(t.category==='VOCAB'&&(t.vocab_retest_streak||0)>=num(R.VOCAB_RETEST.streak,2))add('VOCAB_RETEST',t.id,'WARN',b.book_name+' · RETEST '+t.vocab_retest_streak+'회 연속','단어 학습 방식 점검');
    if(t.category==='WRITING'&&(t.writing_miss_streak||0)>=num(R.WRITING_MISS.streak,3))add('WRITING_MISS',t.id,'WARN',b.book_name+' · Writing 미완료 '+t.writing_miss_streak+'회 연속','Writing 시간 확보');
    const expected=b.expected_sessions?num(b.expected_sessions):Math.ceil(unitsOf(b).length*num(R.STAGNATION.multiplier,1.5));
    const used=trackSessions(t);
    if(expected>0&&used>expected)add('STAGNATION',t.id,'WARN',b.book_name+' · 세션 '+used+'회 (기준 '+expected+'회 초과)','진도 점검');
  }
  // 숙제 미제출 누적 → 원장 보고 (기간 내 횟수)
  {const RD=R.HW_MISS_DIRECTOR||{count:3,days:30};const since=addDays(today,-num(RD.days,30));const miss=hwMissList(sid,since,today);
    if(miss.length>=num(RD.count,3))add('HW_MISS_DIRECTOR',null,'ACTION','최근 '+num(RD.days,30)+'일 숙제 미제출 '+miss.length+'회 ('+miss.slice(-3).map(m=>m.date.slice(5)).join(', ')+')','담임 통화 후 원장 보고');}
  // RTP · NELT 재검사 시기 (마지막 테스트일 기준)
  for(const [kind,key] of [['RTP','rtp_months'],['NELT','nelt_months']]){const due=testDueInfo(sid,kind,today);if(due&&due.due)add('TEST_DUE_'+kind,null,'WARN',kind+' 마지막 테스트 '+(due.last?due.last+' ('+due.monthsAgo+'개월 전)':'기록 없음')+' → 재검사 시기','2주 안에 '+kind+' 실시 → 평가 기록 입력');}
  const w=num(R.DECLINE.window,5);
  if(sess.length>=2*w){
    const rec=sess.slice(-w).map(sessionPct).filter(x=>x!=null),prev=sess.slice(-2*w,-w).map(sessionPct).filter(x=>x!=null);
    if(rec.length&&prev.length){const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;const drop=avg(prev)-avg(rec);if(drop>=num(R.DECLINE.drop_pp,15))add('DECLINE',null,'INFO','최근 '+w+'세션 평균 정답률 '+Math.round(drop)+'%p 하락','원인 확인');}
  }
  const since=addDays(today,-num(R.OVERRIDE_REPEAT.days,30));
  const ov=S.overrides.filter(o=>o.student_id===sid&&o.created_at>=since).length;
  if(ov>=num(R.OVERRIDE_REPEAT.count,3))add('OVERRIDE_REPEAT',null,'INFO',num(R.OVERRIDE_REPEAT.days,30)+'일 내 Override '+ov+'회','Admin: Curriculum Rule 검토');
  for(const a of S.alerts){
    if(a.student_id!==sid||a.status==='RESOLVED'||!COMPUTED_RULES.includes(a.rule_code))continue;
    if(!active.includes(a.rule_code+'|'+(a.track_id||''))){a.status='RESOLVED';a.resolved_at=today;}
  }
  return created;
}

// --- curriculum admin ---
function regenUnits(b,n){
  const us=unitsOf(b);n=Math.max(1,Math.floor(num(n,us.length)));
  if(n>us.length){for(let i=us.length+1;i<=n;i++)b.units.push({id:b.id+'_u'+i,seq_no:i,unit_name:b.unit_label+' '+i,is_final:false});}
  else if(n<us.length){
    const rm=us.slice(n).map(u=>u.id);
    if(S.tracks.some(t=>t.active&&t.book_id===b.id&&(rm.includes(t.current_unit_id)||rm.includes(t.next_unit_id))))return false;
    b.units=b.units.filter(u=>!rm.includes(u.id));
  }
  const all=unitsOf(b);all.forEach((u,i)=>{u.is_final=i===all.length-1;});return true;
}
function chainOf(cat){
  const bs=S.books.filter(b=>b.category===cat);const targets=new Set(bs.map(b=>b.next_book_id).filter(Boolean));
  const roots=bs.filter(b=>!targets.has(b.id));const chains=[];
  for(const r of roots){const c=[];let cur=r;const seen=new Set();while(cur&&!seen.has(cur.id)){seen.add(cur.id);c.push(cur);cur=cur.next_book_id?byId(S.books,cur.next_book_id):null;}chains.push(c);}
  return chains;
}

function fillTemplate(tpl,vars){
  return String(tpl||'').split('\n').map(line=>{
    let hasVar=false,allEmpty=true;
    const out=line.replace(/\{([^{}]+)\}/g,(m,k)=>{hasVar=true;const v=vars[k.trim()];const str=v==null?'':String(v);if(str.trim()!=='')allEmpty=false;return str;});
    if(hasVar&&allEmpty)return null;
    return out.replace(/ {2,}/g,' ').replace(/ +$/,'');
  }).filter(l=>l!==null).join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function hwLine(b,unitId,nextUnitId){const tpl=(b.hw_template==null?HW_DEFAULT[b.category]:b.hw_template)||'';if(!tpl.trim())return '';return fillTemplate(tpl,{교재:b.book_name,단원:unitId?unitLong(b,unitId):'',다음단원:nextUnitId?unitLong(b,nextUnitId):''});}

function timetable(locId,wd){

function assignSlot(sid,wd,teacherId,ipTime){const s=studentOf(sid);if(!s)return null;let sc=s.schedules.find(x=>x.weekday===wd);const loc=locOf(s.location_id);if(!sc){sc={weekday:wd,time:null,ip_time:null,teacher_id:null};s.schedules.push(sc);}

function hourLoad(locId,wd){const out={};for(const s of S.students){if(s.status!=='ACTIVE'||s.location_id!==locId)continue;const sc=s.schedules.find(x=>x.weekday===wd);if(!sc||!sc.ip_time)continue;const hr=Math.floor(toMin(sc.ip_time)/60);out[hr]=(out[hr]||0)+1;}return out;}
function autoAssign(locId,wd,redo){
  const loc=locOf(locId);if(!loc)return{assigned:0,failed:[]};const slots=slotsOf(loc);const teachers=teachersOf(locId);if(!teachers.length)return{assigned:0,failed:[],reason:'강사 없음'};
  const cap=Math.max(1,num(loc.max_per_hour,8));const lead=num(loc.lead_min,45);const maxWait=lead+60;
  const all=S.students.filter(s=>s.status==='ACTIVE'&&s.location_id===locId).map(s=>({s,sc:s.schedules.find(x=>x.weekday===wd)})).filter(x=>x.sc&&x.sc.time);
  if(redo)for(const x of all){x.sc.ip_time=null;x.sc.teacher_id=null;}
  const todo=all.filter(x=>!x.sc.ip_time||!x.sc.teacher_id).sort((a,b)=>toMin(a.sc.time)-toMin(b.sc.time)||a.s.name.localeCompare(b.s.name,'ko'));

  let assigned=0;const failed=[];
  for(const x of todo){const arr=toMin(x.sc.time);let done=false;
    for(const sl of slots){const m=toMin(sl);if(m<arr+lead)continue;if(m>arr+maxWait)break;const hr=Math.floor(m/60);if((hour[hr]||0)>=cap)continue;
      const pref=teachers.find(t=>t.id===x.s.homeroom_teacher_id);const order=pref?[pref,...teachers.filter(t=>t.id!==pref.id)]:teachers;

}

  if(x.original_book_title||x.original_book_id)d.book+=num(P.book_read,5);if(x.attitude===5)d.attitude+=num(P.attitude5,2);
  for(const a of x.activities){const bk=byId(S.books,a.book_id);
    if(a.activity_type==='INDIVIDUAL_PROGRESS'){if(a.status==='COMPLETED'||a.status==='REPEAT')d.unit+=num(P.unit_done,10);if(a.work)d.writing+=num(P.writing_piece,5);}
    if(a.activity_type==='HOMEWORK_CHECK'&&(a.status==='COMPLETED'||a.status==='REPEAT')){if(bk&&bk.category==='VOCAB')d.online+=num(P.online_done,2);else d.hw+=num(P.hw_done,3);}
    if(a.activity_type==='VOCAB_TEST'){if(a.result==='PASS')d.vocab+=num(P.vocab_pass,5);else if(a.result==='CHECK')d.vocab+=num(P.vocab_check,2);}}
  for(const ct of S.completion_tests)if(ct.student_id===x.student_id&&ct.status==='PASS'&&ct.taken_at===x.session_date)d.test+=num(P.test_pass,50);
  d.total=Object.values(d).reduce((a,b)=>a+b,0);return d;
}
function pointsText(d){return Object.keys(POINT_L).filter(k=>d[k]).map(k=>POINT_L[k]+' '+d[k]).join(' · ');}
function pointsOf(sid,ym){
  const d={unit:0,hw:0,online:0,vocab:0,test:0,attitude:0,book:0,writing:0};
  for(const x of sessionsOf(sid)){if(ymOf(x.session_date)!==ym)continue;if(!isPrimarySession(x))continue;const e=sessionPoints(x);for(const k of Object.keys(d))d[k]+=e[k];}
  d.total=Object.values(d).reduce((a,b)=>a+b,0);return d;
}

// --- 데스크 랭크 보드 (기존 EPL RANK SYSTEM 화면 재현) ---
function posOf(s){const trs=activeTracks(s.id);const def=defaultTrack(s);const order=def?[def,...trs.filter(t=>t.id!==def.id)]:trs;for(const t of order){const g=gridOf(bookOf(t));if(g.length)return{level:g[0].level,season:g[0].season};}let best=null;for(const t of trs){const g=gridOf(bookOf(t));if(g.length&&(!best||g[0].level>best.level))best={level:g[0].level,season:g[0].season};}return best;}
function recentRankUps(days){const since=addDays(todayISO(),-(days||14));const out=[];for(const s of S.students){if(s.status!=='ACTIVE')continue;const now=posOf(s);if(!now)continue;const ended=S.tracks.filter(t=>t.student_id===s.id&&!t.active&&t.status==='COMPLETED'&&t.ended_at&&t.ended_at>=since);for(const t of ended){const g=gridOf(bookOf(t));if(g.length&&g[0].level<now.level){out.push({s,from:g[0].level,to:now.level,date:t.ended_at});break;}}}return out.sort((a,b)=>b.date.localeCompare(a.date));}
function viewBoard(q){
  const loc=q.loc||'';const rows=S.students.filter(s=>s.status==='ACTIVE'&&(!loc||s.location_id===loc)).map(s=>({s,pos:posOf(s)})).filter(x=>x.pos);
  const ups=recentRankUps(14);const upIds=new Set(ups.map(u=>u.s.id));const icons={1:'✦',2:'▣',3:'✎',4:'◆',5:'♛'};const cls={1:'t1',2:'t2',3:'t3',4:'t4',5:'t5'};
  const tier=L=>{const list=rows.filter(x=>x.pos.level===L.no).sort((a,b)=>b.pos.season-a.pos.season||a.s.name.localeCompare(b.s.name,'ko'));
    return '<div class="bd-tier '+cls[L.no]+'"><div class="bd-tl"><div class="bd-no">'+String(L.no).padStart(2,'0')+'</div><div class="bd-ic">'+icons[L.no]+'</div><div class="bd-nm">'+h(L.name.toUpperCase())+'</div></div><div class="bd-cards">'+(list.length?list.map(x=>'<div class="bd-card'+(upIds.has(x.s.id)?' up':'')+'"><div class="bd-ring">'+icons[L.no]+'</div><div class="bd-name">'+h(x.s.name)+'</div><div class="bd-pos">'+x.pos.level+'-'+x.pos.season+'</div></div>').join(''):Array.from({length:4}).map(()=>'<div class="bd-card empty"><div class="bd-ring">'+icons[L.no]+'</div></div>').join(''))+'</div></div>';};
  const up=ups[0];
  return '<div class="bd"><div class="bd-top"><div class="bd-live">● LIVE · '+h(nameOf(S.locations,loc)||'전체')+' · <span id="bd_clock">'+new Date().toTimeString().slice(0,5)+'</span></div><div class="bd-title"><span class="bd-crown">♛</span> EPL <span class="bd-white">RANK SYSTEM</span></div><div class="bd-sub">READ · BUILD · EXPRESS · CREATE · INSPIRE</div></div>'+
  levelsOf().slice().reverse().map(tier).join('')+
  '<div class="bd-foot"><div class="bd-ticker">🏆 <span class="bd-rl">RECENT RANK-UP</span> '+(up?'<b>'+h(up.s.name)+'</b> 학생이 <b>'+h((levelsOf().find(L=>L.no===up.to)||{}).name||'').toUpperCase()+'</b> 등급으로 승급했습니다':'이번 2주 승급 없음 — 다음 승급자를 기다립니다')+'</div><div class="bd-brand">EPL · EMPOWER · PRACTICE · LITERACY</div></div>'+
  '<div class="bd-ctl noprint"><a href="#/board" class="'+(loc?'':'on')+'">전체</a>'+S.locations.map(l=>'<a href="#/board?loc='+l.id+'" class="'+(loc===l.id?'on':'')+'">'+h(l.name)+'</a>').join('')+'<a href="#/rank">포인트 랭킹</a><a href="#/home">OS로 돌아가기</a></div></div>';
}

const PENDING_PHOTOS={};
function photoDB(){return new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return res(null);const r=indexedDB.open('epl_photos',1);r.onupgradeneeded=()=>{r.result.createObjectStore('photos');};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});}
async function putPhoto(id,blob){const db=await photoDB();if(!db)return false;return new Promise(res=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);});}
async function getPhoto(id){const db=await photoDB();if(!db)return null;return new Promise(res=>{const tx=db.transaction('photos','readonly');const q=tx.objectStore('photos').get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}
function shrinkImage(file,max){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,(max||1200)/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);res(b||file);},'image/jpeg',0.82);};img.onerror=()=>res(file);img.src=url;});}
async function hydratePhotos(){const els=document.querySelectorAll('img[data-photo]');for(const el of els){const id=el.dataset.photo;if(!id||el.src)continue;const b=await getPhoto(id);if(b)el.src=URL.createObjectURL(b);else el.alt='사진 없음(다른 기기에 저장됨)';}}

function studentCard(s,sch,date){

  const tests=activeTracks(s.id).filter(t=>t.status==='TEST_REQUIRED'||t.status==='RETEST_REQUIRED'||t.status==='REVIEW_REQUIRED');
  const comp=completionOf(s,date);const todo=al.filter(a=>a.status==='OPEN'||a.status==='ACKNOWLEDGED');
  const compBadge=comp==='DONE'?badge('b-good','완료 (기록 + 알림장)'):comp==='NOT_SENT'?badge('b-warn','기록됨 · 알림장 미발송'):comp==='ABSENT'?badge('b-muted','결석'):(date<todayISO()?badge('b-bad','세션 미기록'):'');
  return '<div class="st"><div class="time">'+h(sch.time)+'<small>'+h(nameOf(S.locations,s.location_id))+'</small></div><div>'+
  '<div class="who"><a class="nm" href="#/student/'+s.id+'">'+h(s.name)+'</a><span class="ar">AR '+h(s.ar_level)+'</span>'+(sch.ip_time?'<span class="note">개별진도 '+h(sch.ip_time)+(sch.teacher_id?' · '+h(nameOf(S.teachers,sch.teacher_id)):'')+'</span>':'<a class="note" href="#/timetable?loc='+s.location_id+'&wd='+wdOf(date)+'&pick='+s.id+'" style="color:var(--warn)">슬롯 미배정</a>')+'<a class="note" href="#/map/'+s.id+'">맵</a><a class="note" href="#/chart/'+s.id+'">차트</a><a class="note" href="#/archive/'+s.id+'">아카이브</a>'+compBadge+
  (comp==='NO_SESSION'?'<button class="btn s" data-act="absent" data-id="'+s.id+'" data-date="'+date+'">결석</button>':'')+
  todo.map(a=>'<a href="#/alerts" style="text-decoration:none">'+badge(SEV_CLS[a.severity]||'b-info','⚠ '+(RULE_L[a.rule_code]||EVENT_TYPES[a.rule_code]||a.rule_code)+' · '+LEVEL_L[a.authority_level||'TEACHER']+(a.due_at?' · ~'+a.due_at:''))+'</a>').join('')+
  tests.map(t=>{const ct=latestTestOf(t);return badge('b-brass','TEST · '+bookOf(t).book_name+' · '+(ct?(TEST_ST[ct.status]||ct.status):(TRACK_ST[t.status]||t.status))+(ct&&ct.scheduled_date?' '+ct.scheduled_date:''));}).join('')+
  studentNeeds(s.id).map(x=>'<span class="badge b-brass" title="교재를 건네줬으면 누르세요 · 재고 차감 · 실장에게 결제 안내 넘어감" style="cursor:pointer" data-act="issue" data-sid="'+s.id+'" data-book="'+x.b.id+'" data-st="ISSUED">📘 '+h(x.b.book_name)+' 지급 ✓</span>').join('')+
  '<span class="sp"></span><a class="btn p s" href="#/session/'+s.id+'?date='+date+'">세션 입력</a></div>'+
  '<div class="slots">'+slotHtml('숙제 검사',sd.hw)+slotHtml('오늘 교재',sd.ip,sd.def?sd.def.id:null)+slotHtml('단어 Test',sd.vt)+'</div>'+quickRow(s,sd,date,comp)+'</div></div>';
}
function quickRow(s,sd,date,comp){
  if(date>todayISO())return '';
  if(comp==='DONE'||comp==='NOT_SENT'){const x=S.sessions.filter(y=>y.student_id===s.id&&y.session_date===date).pop();return '<div class="row qk" style="margin-top:8px"><span class="note">'+(comp==='DONE'?'오늘 끝':'알림장만 남음')+'</span>'+(x?'<button class="btn s p" data-act="shareComment" data-id="'+x.id+'">알림장 공유</button><button class="btn s" data-act="copyComment" data-id="'+x.id+'">복사</button><a class="btn s" href="#/notices?date='+date+'&focus='+x.id+'">알림장 수정</a><label class="note"><input type="checkbox" data-act="toggleSent" data-id="'+x.id+'"'+(x.sent?' checked':'')+'> 보냄</label><button class="link note" data-act="redoSession" data-sid="'+s.id+'" data-date="'+date+'" title="오늘 기록을 지우고 다시 입력 (진도 되돌림)">기록 수정</button>':'')+'<a class="note" href="#/student/'+s.id+'">기록 보기</a></div>';}
  if(comp==='ABSENT')return '';
  if(!activeTracks(s.id).length)return '<div class="row qk" style="margin-top:8px"><a class="btn s" href="#/student/'+s.id+'?edit=tracks">교재 먼저 설정</a></div>';
  const vt=sd.vt.find(t=>t.next_unit_id);
  return '<div class="row qk" style="margin-top:8px"><input type="text" id="qk_b_'+s.id+'" list="bookList" placeholder="오늘 읽은 원서" style="min-width:170px">'+(vt?'<span><input type="number" id="qk_v_'+s.id+'" placeholder="단어" min="0" style="width:64px"> / <input type="number" id="qk_vt_'+s.id+'" value="12" min="1" style="width:56px"></span>':'')+'<label class="note" style="display:flex;align-items:center;gap:4px">태도<select id="qk_a_'+s.id+'">'+[5,4,3,2,1].map(v=>'<option value="'+v+'">'+'★'.repeat(v)+'</option>').join('')+'</select></label>'+(sd.ip.some(t=>t.category==='WRITING'&&t.next_unit_id)?'<label class="btn s" style="cursor:pointer" title="오늘 쓴 글 사진">📷<input type="file" accept="image/*" capture="environment" class="wph" data-id="'+s.id+'" hidden></label><span id="wph_prev_'+s.id+'" class="note"></span>':'')+'<button class="btn b s" data-act="quickSave" data-id="'+s.id+'" data-date="'+date+'">저장</button><a class="note" href="#/session/'+s.id+'?date='+date+'">자세히 (부분·반복·라이팅 점수)</a></div>';
}

}

  return '<h1>학생</h1><p class="sub">이름을 클릭하면 현재 상태가 바로 보입니다. ★ = 오늘 교재 기본값.</p>'+
  '<div class="bar"><span class="sp"></span><a class="btn p" href="#/students?add=1">+ 학생 추가</a></div>'+
  (q.add?'<div class="panel"><h2>학생 추가</h2>'+studentForm(null)+'<div class="bar" style="margin-top:12px"><button class="btn p" data-act="addStudent">추가하고 교재 설정하기</button><a class="btn" href="#/students">취소</a></div></div>':'')+
  '<div class="panel tw"><table class="t"><thead><tr><th>이름</th><th>지점</th><th>AR</th><th>담임</th><th>진행 중인 교재 · 다음 Unit</th><th>Alert</th><th>상태</th><th></th></tr></thead><tbody>'+
  rows.map(s=>{const al=openAlertsOf(s.id).length;return '<tr><td><a href="#/student/'+s.id+'"><b>'+h(s.name)+'</b></a></td><td>'+h(nameOf(S.locations,s.location_id))+'</td><td>'+h(s.ar_level)+'</td><td>'+h(nameOf(S.teachers,s.homeroom_teacher_id))+'</td><td>'+cell(s)+'</td><td>'+(al?badge('b-bad',al):'')+'</td><td>'+({ACTIVE:'재원',PAUSED:'휴원',WITHDRAWN:'퇴원'}[s.status]||h(s.status))+'</td><td style="white-space:nowrap"><a href="#/map/'+s.id+'">맵</a> · <a href="#/chart/'+s.id+'">차트</a></td></tr>';}).join('')+
  '</tbody></table></div>';
}

  const ip=x.activities.filter(a=>a.activity_type==='INDIVIDUAL_PROGRESS').map(a=>{const b=byId(S.books,a.book_id);return '<div>'+h(b?b.book_name:'')+' <b>'+(a.status==='REVIEW'?h(a.lesson_note||'복습·오답'):h(unitShort(b,a.unit_id))+' '+MARK[a.status]+(a.lesson_note?' '+h(a.lesson_note):''))+'</b>'+(a.rubric?' <span class="note">'+RUBRIC.map(([k,l])=>a.rubric[k]!=null?l[0]+a.rubric[k]:'').filter(Boolean).join('·')+'</span>':'')+(a.work?'<div class="note">「'+h(a.work)+'」</div>':'')+(a.photo_id?photoTag(a.photo_id):'')+'</div>';}).join('');
  const vt=x.activities.find(a=>a.activity_type==='VOCAB_TEST');const vb=vt?byId(S.books,vt.book_id):null;

function viewStudent(id,q){
  const s=studentOf(id);if(!s)return notFound('학생');
  const sess=sessionsOf(id).slice().reverse();const last=sess[0];const al=openAlertsOf(id);const trs=activeTracks(id);const def=defaultTrack(s);const lastAR=latestAssessment(id,'AR');const lastNELT=latestAssessment(id,'NELT');const asl=assessmentsOf(id).slice().reverse();
  const trRow=t=>{const b=bookOf(t);let extra='';if(t.category==='VOCAB'){const la=lastActivity(id,t.id);if(la&&la.pct!=null)extra=' '+badge(la.result==='PASS'?'b-good':la.result==='CHECK'?'b-warn':'b-bad',la.result+' '+la.pct+'%');}
    const iss=S.issues.filter(i=>i.student_id===id&&i.book_id===b.id&&i.status!=='PLANNED').pop();return '<tr><td>'+(def&&t.id===def.id?'★ ':'')+'<b>'+h(b.book_name)+'</b><div class="note">'+CAT_S[t.category]+' · '+(iss?'<span style="color:'+(iss.status==='PAID'?'var(--paid)':'var(--brass-ink)')+'">'+h(ISSUE_ST[iss.status])+' '+h(iss.date)+'</span>':'<button class="btn s" data-act="issue" data-sid="'+id+'" data-book="'+b.id+'" data-st="ISSUED" style="padding:0 6px;font-size:11px">📘 교재 지급</button>')+'</div></td><td>'+(t.current_unit_id?h(unitShort(b,t.current_unit_id)):'<span class="note">시작 전</span>')+'</td><td><b style="color:var(--brass-ink)">'+(t.next_unit_id?h(unitShort(b,t.next_unit_id)):'—')+'</b></td><td>'+(t.delivery_mode==='HOME'?(t.category==='VOCAB'?'집 (온라인) · 학원 Test':'집 (숙제)'):'학원 (개별진도)')+'</td><td>'+trackBadge(t)+(t.next_unit_id?' <span class="note">'+remainingUnits(t)+' 남음</span>':'')+extra+'</td></tr>';};
  const testRows=trs.map(t=>{const b=bookOf(t);const ct=latestTestOf(t);if(!ct)return b.completion_test_required?'<tr><td>'+h(b.book_name)+'</td><td>'+badge('b-muted','NOT_READY')+'</td><td>'+(t.next_unit_id?remainingUnits(t)+' Unit 남음':'')+' · pass '+passScoreOf(b)+'%</td></tr>':'';return '<tr><td>'+h(b.book_name)+'</td><td>'+badge(ct.status==='PASS'?'b-good':ct.status==='REVIEW_REQUIRED'?'b-bad':'b-brass',TEST_ST[ct.status]||ct.status)+'</td><td>attempt '+ct.attempt_no+(ct.scheduled_date?' · '+ct.scheduled_date:'')+(ct.pct!=null?' · '+ct.pct+'%':'')+' · pass '+ct.pass_score_snapshot+'%</td></tr>';}).join('');
  const histTrack=byId(S.tracks,q.hist)||def||trs[0]||null;let hist='';
  if(histTrack){const b=bookOf(histTrack);const us=unitsOf(b);const doneIdx=us.findIndex(u=>u.id===histTrack.current_unit_id);
    hist='<div class="bar"><label class="f">교재<select class="hq" data-k="hist">'+opt(S.tracks.filter(t=>t.student_id===id).sort((a,b)=>(a.active===b.active?0:a.active?-1:1)),histTrack.id,t=>bookOf(t).book_name+(t.active?'':' (종료)'))+'</select></label></div>'+
    '<div class="hist">'+us.map((u,i)=>{const n=unitAttempts(histTrack,u.id);const cls=i<=doneIdx?'done':(u.id===histTrack.next_unit_id?'cur':'');return '<span class="'+cls+'" title="세션 '+n+'회">'+h(unitShort(b,u.id))+(n?' <small>×'+n+'</small>':'')+'</span>';}).join('')+'</div>'+
    '<p class="note" style="margin-top:8px">완료(초록) · 다음 Unit(금색) · ×n = 그 Unit에 쓴 세션 수. Override '+S.overrides.filter(o=>o.track_id===histTrack.id).length+'회 · Completion Test '+S.completion_tests.filter(x=>x.track_id===histTrack.id).length+'회</p>';}
  return '<div class="bar"><div><h1>'+h(s.name)+(s.grade?' <span class="note" style="font-size:14px;font-weight:400">'+h(s.grade)+'</span>':'')+'</h1><p class="sub" style="margin:0">AR '+h(s.ar_level)+' · 담임 '+h(nameOf(S.teachers,s.homeroom_teacher_id))+' · '+h(nameOf(S.locations,s.location_id))+' · '+(s.schedules.length?s.schedules.map(x=>WD[x.weekday]).join('·')+' '+h(s.schedules[0].time):'등원 요일 미설정')+(s.status!=='ACTIVE'?' · '+badge('b-muted',{PAUSED:'휴원',WITHDRAWN:'퇴원'}[s.status]||s.status):'')+'</p></div><span class="sp"></span>'+
  '<a class="btn p" href="#/session/'+s.id+'">세션 입력</a><a class="btn b" href="#/map/'+s.id+'">성장 맵</a><a class="btn" href="#/chart/'+s.id+'">학생 차트</a><a class="btn" href="#/archive/'+s.id+'">아카이브</a><a class="btn" href="#/student/'+s.id+'?edit=tracks">교재 설정</a><a class="btn" href="#/student/'+s.id+'?edit=info">학생 정보</a></div>'+
  (q.edit==='tracks'?trackForm(s):'')+
  (q.edit==='info'?'<div class="panel"><h2>학생 정보</h2>'+studentForm(s)+'<div class="bar" style="margin-top:12px"><button class="btn p" data-act="saveStudent" data-id="'+s.id+'">저장</button><a class="btn" href="#/student/'+s.id+'">닫기</a></div></div>':'')+
  '<div class="panel"><h2>CURRENT STATE</h2><div class="tw"><table class="t"><thead><tr><th>교재</th><th>현재</th><th>다음</th><th>방식</th><th>상태</th></tr></thead><tbody>'+
  '<tr><td>원서 · AR</td><td colspan="4">AR <b>'+h(s.ar_level)+'</b>'+(lastAR?' <span class="note">('+h(lastAR.date)+' 테스트)</span>':'')+(lastNELT?' · NELT '+h(lastNELT.level||'')+' '+h(lastNELT.score!=null?lastNELT.score:'')+' <span class="note">('+h(lastNELT.date)+')</span>':'')+(last?' · 최근 원서 '+h(last.original_book_title||nameOf(S.original_books,last.original_book_id)||'—')+' ('+h(last.session_date)+')':'')+'</td></tr>'+
  (trs.length?trs.map(trRow).join(''):'<tr><td colspan="5"><span class="note">교재가 설정되지 않았습니다 — <a href="#/student/'+s.id+'?edit=tracks">교재 설정</a></span></td></tr>')+'</tbody></table></div></div>'+
  '<div class="panel"><h2>사건 기록 (결석 · 문의 · 불만 · 휴원 · 퇴원)</h2>'+(()=>{const evs=S.events.filter(e=>e.student_id===id).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return (evs.length?'<div class="tw"><table class="t"><thead><tr><th>날짜</th><th>종류</th><th>내용</th><th>상태</th><th>담당</th></tr></thead><tbody>'+evs.slice(0,10).map(e=>'<tr><td style="white-space:nowrap">'+h(e.date)+'</td><td>'+badge(e.type==='COMPLAINT'||e.type==='WITHDRAW'?'b-bad':e.type==='ABSENCE'?'b-muted':'b-warn',EVENT_TYPES[e.type])+'</td><td>'+h(e.note)+(e.makeup_date?'<div class="note">보강 '+h(e.makeup_date)+'</div>':'')+'</td><td>'+(e.status==='DONE'?badge('b-good','완료'):'<a href="#/alerts">'+badge('b-warn','처리 중')+'</a>')+'</td><td class="note">'+h(nameOf(S.teachers,e.teacher_id))+'</td></tr>').join('')+'</tbody></table></div>':'<p class="note">기록 없음.</p>')+
  '<div class="row noprint" style="margin-top:10px;border-top:1px solid var(--line-2);padding-top:10px"><label class="f">종류<select id="ev_type">'+Object.entries(EVENT_TYPES).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></label><label class="f">날짜<input type="date" id="ev_date" value="'+todayISO()+'"></label><label class="f">강사<select id="ev_teacher">'+opt(S.teachers,myId(s.homeroom_teacher_id))+'</select></label><label class="f" style="flex:1;min-width:220px">한 줄 (사실만)<input type="text" id="ev_note" style="width:100%" placeholder="예: 독해 숙제 양이 많다는 어머니 전화"></label><button class="btn p" data-act="addEvent" data-id="'+s.id+'">기록</button></div><p class="note" style="margin:6px 0 0">기록하면 결정 권한표에 따라 예외 처리함에 들어갑니다 — 결석·문의는 강사 단독, 불만은 보고, 휴원·퇴원은 원장 결정.</p>';})()+'</div>'+
  '<div class="panel"><h2>평가 기록 (AR · NELT)</h2>'+(asl.length?'<div class="tw"><table class="t"><thead><tr><th>날짜</th><th>종류</th><th>점수 · 지수</th><th>레벨</th><th>영역별 · 메모</th><th></th></tr></thead><tbody>'+asl.map(a=>'<tr><td style="white-space:nowrap">'+h(a.date)+'</td><td>'+badge(a.kind==='AR'?'b-brass':a.kind==='NELT'?'b-info':'b-muted',a.kind)+'</td><td><b>'+h(a.score!=null?a.score:'—')+'</b></td><td>'+h(a.level||'')+'</td><td class="note">'+h([a.detail,a.note].filter(Boolean).join(' · '))+'</td><td><button class="btn s d" data-act="delAssess" data-id="'+a.id+'">삭제</button></td></tr>').join('')+'</tbody></table></div>':'<p class="note">아직 평가 기록이 없습니다. AR 테스트 지수와 NELT 결과를 여기에 쌓으면 차트의 추이가 됩니다.</p>')+
  '<div class="row noprint" style="margin-top:10px;border-top:1px solid var(--line-2);padding-top:10px"><label class="f">종류<select id="as_kind">'+ASSESS_KINDS.map(k=>'<option>'+k+'</option>').join('')+'</select></label><label class="f">날짜<input type="date" id="as_date" value="'+todayISO()+'"></label><label class="f">점수 · 지수<input type="text" id="as_score" placeholder="AR 2.4 / NELT 412" style="width:120px"></label><label class="f">레벨<input type="text" id="as_level" placeholder="NELT Level 4" style="width:120px"></label><label class="f" style="flex:1;min-width:200px">영역별 점수 · 메모<input type="text" id="as_detail" placeholder="Listening 78 · Reading 70 …" style="width:100%"></label><button class="btn p" data-act="addAssess" data-id="'+s.id+'">기록 추가</button></div></div>'+
  '<div class="grid g2"><div class="panel"><h2>성취테스트 상태</h2>'+(testRows?'<table class="t"><tbody>'+testRows+'</tbody></table>':'<p class="note">Completion Test가 있는 교재가 없습니다.</p>')+'</div>'+
  '<div class="panel"><h2>ALERTS</h2>'+(al.length?'<table class="t"><tbody>'+al.map(a=>'<tr><td>'+badge(SEV_CLS[a.severity]||'b-info',RULE_L[a.rule_code]||a.rule_code)+'</td><td>'+h(a.message)+'<div class="note">'+h(a.action)+' · '+h(a.created_at)+'</div></td><td style="white-space:nowrap">'+(a.status==='OPEN'?'<button class="btn s" data-act="ack" data-id="'+a.id+'">확인</button> ':'')+'<button class="btn s" data-act="resolve" data-id="'+a.id+'">해결</button></td></tr>').join('')+'</tbody></table>':'<p class="note">없음 — 정상 진행 중입니다.</p>')+'</div></div>'+
  '<div class="panel"><h2>진도 시트 (RECENT SESSIONS)</h2>'+(sess.length?'<div class="tw"><table class="t"><thead><tr><th>회차</th><th>날짜</th><th>원서</th><th>숙제</th><th>온라인</th><th>교재 · Lesson</th><th>단어 Test</th><th>태도</th><th>숙제 안내</th><th>알림장</th><th>강사</th></tr></thead><tbody>'+sess.slice(0,q.all?999:8).map(sessRow).join('')+'</tbody></table></div>'+(sess.length>8&&!q.all?'<p><a href="#/student/'+s.id+'?all=1">전체 '+sess.length+'회 보기</a></p>':''):'<p class="note">아직 세션 기록이 없습니다.</p>')+'</div>'+
  '<div class="panel"><h2>PROGRESS HISTORY</h2>'+(hist||'<p class="note">교재를 먼저 설정하세요.</p>')+'</div>';
}

// --- Session Entry ---
function seRow(n,title,body){return '<div class="srow"><div class="n">'+n+'</div><div><div class="ttl">'+title+'</div>'+body+'</div></div>';}
function chip(name,v,l,checked){return '<label class="chip-opt"><input type="radio" name="'+name+'" value="'+v+'"'+(checked?' checked':'')+'><span>'+l+'</span></label>';}
function hwRow(i,t,cands,custom){const n='st_hw_'+i;const isC=!t;const vocab=t&&t.category==='VOCAB';const b=t?bookOf(t):null;
  const sel='<select class="hwTrack" data-i="'+i+'">'+opt(cands,t?t.id:'',x=>x.category==='VOCAB'?'온라인 학습':CAT_S[x.category]+' · '+bookOf(x).book_name)+'<option value="__custom"'+(isC?' selected':'')+'>직접 입력…</option></select>';
  const mid=isC?'<input type="text" class="hwName" id="hwName_'+i+'" placeholder="숙제 이름 (예: 독서록 1편)" value="'+h(custom||'')+'" style="min-width:180px">':(vocab?'':'<select class="hwUnit" id="hwUnit_'+i+'" title="숙제로 낸 Unit">'+opt(unitsOf(b),t.next_unit_id||'',u=>u.unit_name)+'</select>');
  return '<div class="hwrow line" data-i="'+i+'">'+sel+mid+'<div class="chips">'+chip(n,'COMPLETED','했음',true)+chip(n,'PARTIAL','일부함',false)+chip(n,'NOT_DONE','안 함',false)+(vocab||isC?'':chip(n,'REPEAT','했지만 한 번 더',false))+'</div><button class="link note" data-act="hwRemove" data-i="'+i+'" style="text-decoration:none">✕</button></div>';}
function ipBody(i,t){
  const b=bookOf(t);const nx=t.next_unit_id;const n='st_ip_'+i;
  if(!nx)return '<div class="line"><span class="lbl">'+h(TRACK_ST[t.status]||t.status)+' <span class="note">(교재 끝 · 복습만 기록)</span></span><input type="hidden" name="'+n+'" value="REVIEW"><input type="text" class="ln" id="ln_'+i+'" placeholder="메모 (예: 오답노트 p.12)"></div>';
  // 오늘 진행한 Unit을 바로 고른다 (기본값 = 시스템이 계산한 다음 Unit). 바꾸면 그 Unit이 오늘 기록이 되고 다음 Unit은 그 뒤로 이어진다.
  return '<div class="line"><span class="lbl">오늘 <select id="ipUnit_'+i+'" class="ipUnitSel" data-i="'+i+'" data-nx="'+h(nx)+'" title="오늘 진행한 Unit — 시트·실제 진도와 다르면 여기서 바로 고르세요">'+opt(unitsOf(b),nx,u=>u.unit_name)+'</select>'+(b.units_placeholder||!b.grid||!b.grid.length?'<button class="link note" data-act="ipUnitAdd" data-i="'+i+'" data-book="'+h(b.id)+'" title="이 교재에 Unit 하나 추가" style="text-decoration:none;margin-left:4px">+Unit</button>':'')+(t.progress_note?'<span class="note" title="진도 시트에 적힌 진도" style="margin-left:6px">시트: '+h(t.progress_note)+'</span>':'')+'</span><div class="chips">'+chip(n,'COMPLETED','완료',true)+chip(n,'PARTIAL','다 못함',false)+chip(n,'REPEAT','한 번 더',false)+chip(n,'REVIEW','복습·오답',false)+'</div><input type="text" id="ipReason_'+i+'" placeholder="다른 Unit인 이유 (선택)" style="min-width:120px" hidden><input type="text" class="ln" id="ln_'+i+'" placeholder="메모" style="min-width:90px;width:140px"></div>'+rubricRow(i,t);
}
function rubricRow(i,t){
  if(!t||t.category!=='WRITING')return '';
  const b=bookOf(t);const target=num(b.writing_target,8);
  const sel=k=>'<select id="rb_'+k+'_'+i+'" class="rb"><option value="">—</option>'+[5,4,3,2,1].map(v=>'<option value="'+v+'">'+v+'</option>').join('')+'</select>';
  return '<div class="line" style="margin-top:6px"><label class="btn s" style="cursor:pointer">📷 오늘 쓴 글 사진<input type="file" accept="image/*" capture="environment" class="wph" data-i="'+i+'" hidden></label><span id="wph_prev_'+i+'" class="note"></span></div>'+
  '<details class="rbox" data-i="'+i+'" data-target="'+target+'" style="margin-top:6px"><summary class="note" style="cursor:pointer">라이팅 점수 (선택) ▸</summary><div class="row" style="margin-top:6px">'+RUBRIC.map(([k,l])=>'<label class="f">'+l+sel(k)+'</label>').join('')+'<label class="f" style="flex:1;min-width:160px">작품<input type="text" id="wk_'+i+'" placeholder="제목 또는 사진 링크"></label><span id="rbsum_'+i+'" class="note"></span></div>'+
  '<details style="margin-top:6px"><summary class="note" style="cursor:pointer">세어서 계산 (기대 '+target+'문장) · <button class="link" data-act="toggleRubricHelp" data-i="'+i+'">기준</button></summary><div class="row" style="margin-top:6px"><label class="f">총 문장<input type="number" class="rbe" data-i="'+i+'" id="ev_n_'+i+'" min="0"></label><label class="f">오류 문장<input type="number" class="rbe" data-i="'+i+'" id="ev_e_'+i+'" min="0"></label><div class="chips">'+IDEA_CHECKS.map(([k,l])=>'<label class="chip-opt"><input type="checkbox" class="rbe idea" data-i="'+i+'" value="'+k+'"><span>'+l+'</span></label>').join('')+'<label class="chip-opt"><input type="checkbox" class="rbe" data-i="'+i+'" id="ev_own_'+i+'"><span>자기 표현</span></label></div></div>'+rubricHelp(i)+'</details></details>';
}
function rubricHelp(i){
  return '<div id="rbh_'+i+'" hidden style="margin-top:8px"><div class="tw"><table class="t" style="font-size:13px"><thead><tr><th>점수</th>'+RUBRIC.map(([k,l])=>'<th>'+l+'</th>').join('')+'</tr></thead><tbody>'+[5,4,3,2,1].map(v=>'<tr><td><b>'+v+'</b></td>'+RUBRIC.map(([k])=>'<td>'+h(RUBRIC_ANCHORS[k][v-1])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="note" style="margin:6px 0 0">계산 규칙 — 문장력: 오류 문장 ÷ 총 문장 = 0 → 5, 20% 이하 → 4, 50% 이하 → 3, 그 이상 → 2, 전부 오류·2문장 미만 → 1. 사고력: 체크 개수가 점수(0~1개 → 1). 자기표현: 총 문장 ÷ 기대 분량 50% 미만 → 1, 80% 미만 → 2, 100% 미만 → 3, 충족 → 4, 자기 표현 체크 시 +1. 글을 안 쓴 날은 비워 두세요.</p></div>';
}
function ipRowHtml(i,t,cands,defId){
  return '<div class="iprow" data-i="'+i+'" style="margin-bottom:8px;padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r-sm)"><div class="line" style="margin-bottom:4px"><select class="ipTrack" data-i="'+i+'">'+opt(cands,t.id,x=>CAT_S[x.category]+' · '+bookOf(x).book_name+(x.id===defId?' ★':''))+'</select><button class="link note" data-act="ipRemove" data-i="'+i+'" style="text-decoration:none">✕ 오늘 안 함</button></div><div class="ipBody" id="ipBody_'+i+'">'+ipBody(i,t)+'</div></div>';
}
function viewSession(id,q){
  const s=studentOf(id);if(!s)return notFound('학생');
  const date=q.date||todayISO();const loc=locOf(s.location_id);const order=(loc&&loc.flow_order&&loc.flow_order.length)?loc.flow_order:SLOTS;
  const trs=activeTracks(id);if(!trs.length)return '<h1>세션 입력 · '+h(s.name)+'</h1><div class="empty">교재가 설정되지 않은 학생입니다. <a href="#/student/'+s.id+'?edit=tracks">교재 설정</a>을 먼저 하세요.</div>';
  const sd=slotData(id);let n=0;const rows=[];
  const already=S.sessions.filter(x=>x.student_id===id&&x.session_date===date).length;
  for(const k of order){
    if(k==='BOOK'){n++;rows.push(seRow(n,'원서','<div class="line"><input type="text" id="seBookTitle" list="bookList" placeholder="오늘 읽은 원서" style="min-width:220px"><input type="text" id="seRec" placeholder="북토킹 녹음 링크 (선택)" style="min-width:180px"></div>'+bookDatalist()));}
    else if(k==='HW'){n++;const hc=trs.filter(t=>t.next_unit_id||t.category==='VOCAB');const hwInit=trs.filter(t=>t.category==='VOCAB'||(t.delivery_mode==='HOME'&&t.next_unit_id));rows.push(seRow(n,'숙제 검사','<div id="hwRows" data-sid="'+s.id+'" data-n="'+hwInit.length+'">'+hwInit.map((t,i)=>hwRow(i,t,hc)).join('')+'</div><div class="line"><button class="btn s" data-act="hwAdd">+ 숙제 과목 추가</button><span class="note">학생 교재 중 고르거나 직접 입력</span></div>'));}
    else if(k==='IP'){n++;const cands=sd.ip;let init=[];const first=byId(cands,q.ip)||sd.def||cands[0];if(first)init.push(first);if(order.includes('WR')){for(const t of cands)if(t.category==='WRITING'&&!init.includes(t))init.push(t);}
      rows.push(seRow(n,'오늘 교재',cands.length?'<div id="ipRows" data-sid="'+s.id+'" data-n="'+init.length+'">'+init.map((t,i)=>ipRowHtml(i,t,cands,sd.def?sd.def.id:null)).join('')+'</div><div class="line"><button class="btn s" data-act="ipAdd">+ 교재 하나 더</button><button class="btn s" data-act="toggleQb">+ 새 교재 만들기</button></div><div id="qbHost" hidden>'+quickBookForm(s.id,'session')+'</div>':'<span class="note">학원에서 진행하는 교재가 없습니다 (모든 교재가 숙제 방식). </span><button class="btn s" data-act="toggleQb">+ 새 교재 만들기</button><div id="ipRows" data-sid="'+s.id+'" data-n="0"></div><div id="qbHost" hidden>'+quickBookForm(s.id,'session')+'</div>'));}
    else if(k==='VT'){for(const t of sd.vt){const b=bookOf(t);n++;const rd=reviewDue(t);rows.push(seRow(n,'단어 · '+h(b.book_name),t.next_unit_id?'<div class="line"><select id="vtU_'+t.id+'" class="vtU" data-t="'+t.id+'" title="시험 본 Unit">'+opt(unitsOf(b),rd?'':t.next_unit_id,u=>u.unit_name)+'<option value="__review"'+(rd?' selected':'')+'>리뷰 테스트…</option></select><input type="text" id="vtR_'+t.id+'" placeholder="범위 (예: Unit 1-5)" value="'+h(rd||'')+'" style="width:130px"'+(rd?'':' hidden')+'><span><input type="number" class="vt" data-t="'+t.id+'" id="vt_'+t.id+'" min="0" placeholder="점수"> / <input type="number" class="vt" data-t="'+t.id+'" id="vtT_'+t.id+'" min="1" value="12"></span><span id="vtj_'+t.id+'" class="note">'+(rd?'리뷰 테스트 차례입니다 ('+h(rd)+')':'안 봤으면 비워두기')+'</span></div>':'<span class="note">'+h(TRACK_ST[t.status]||t.status)+'</span>'));}}
  }
  const D=(EDIT_DRAFT&&EDIT_DRAFT.sid===id&&EDIT_DRAFT.date===date)?EDIT_DRAFT:null;

function spark(pts,min,max){
  if(!pts.length)return '<span class="note">기록 없음</span>';
  const W=240,H=48,pad=4;const n=pts.length;const step=n>1?(W-2*pad)/(n-1):0;const y=v=>H-pad-((v-min)/(max-min))*(H-2*pad);
  const path=pts.map((p,i)=>(i?'L':'M')+(pad+i*step).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const dots=pts.map((p,i)=>'<circle cx="'+(pad+i*step).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="2.4" fill="var(--brass)"><title>'+h(p.x+' · '+p.v)+'</title></circle>').join('');
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="추이"><line x1="'+pad+'" y1="'+y(min).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+y(min).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><path d="'+path+'" fill="none" stroke="var(--brass)" stroke-width="1.6"/>'+dots+'</svg>';
}

// --- EPL Growth Curriculum map (5 Levels × 4 Skills × 4 Seasons) ---
function renderMap(s,opts){
  opts=opts||{};const cellsBy={};for(const cat of CATS)cellsBy[cat]=mapCells(cat);
  const lvlColor=['var(--navy)','var(--brass)','#5f7f7a','var(--brass-ink)','var(--muted)'];
  let rows='';
  const sel=opts.selected||'';
  for(const L of levelsOf()){
    CATS.forEach((cat,ci)=>{
      rows+='<tr class="lvl-'+L.no+'">'+(ci===0?'<td class="lvcell" rowspan="4" style="border-left-color:'+lvlColor[L.no-1]+'"><div class="no">'+String(L.no).padStart(2,'0')+'</div><div class="nm">'+h(L.name)+'</div><div class="tag">'+h(L.tag)+'</div></td>':'')+'<td class="sk">'+CAT_MAP[cat]+'</td>';
      for(const se of SEASONS){
        const cell=cellsBy[cat].find(c=>c.level===L.no&&c.season===se);
        const key=cellKey(L.no,cat,se);
        if(!cell){rows+=(!s?'<td class="cell st-EMPTY st-MASTER'+(sel===key?' st-EDIT':'')+'" data-act="cellEdit" data-cell="'+key+'" title="빈 칸 · 클릭해서 교재 추가"><span class="plus">+ 교재 넣기</span></td>':'<td class="cell st-EMPTY"></td>');continue;}
        const names=cell.books.map(b=>b.book_name);
        if(!s){rows+='<td class="cell st-MASTER'+(sel===key?' st-EDIT':'')+'" data-act="cellEdit" data-cell="'+key+'" title="클릭해서 이 칸 편집">'+cell.books.map(b=>h(b.book_name)+(b.units_placeholder?'<span class="note"> '+unitsOf(b).length+'U*</span>':'<span class="note"> '+unitsOf(b).length+'U</span>')).join('<span class="note"> or </span>')+'<span class="mk pen">✎</span></td>';continue;}
        const st=cellStatus(s,cell);const act=st==='ACTIVE'?activeTracks(s.id).find(t=>cell.books.some(b=>b.id===t.book_id)):null;
        const label=act?bookOf(act).book_name:names.join(' or ');
        rows+='<td class="cell st-'+st+'" data-act="mapPick" data-sid="'+s.id+'" data-books="'+cell.books.map(b=>b.id).join('|')+'" title="'+h(names.join(' / '))+(st==='ACTIVE'&&act&&act.next_unit_id?' · 다음 '+h(unitLong(bookOf(act),act.next_unit_id)):'')+'"><span>'+h(label)+'</span>'+(st==='DONE'?'<span class="mk">✓</span>':st==='ACTIVE'?'<span class="mk">진행'+(act&&act.next_unit_id?' · '+h(unitShort(bookOf(act),act.next_unit_id)):'')+'</span>':'')+'</td>';
      }
      rows+='</tr>';
    });
  }
  return '<div class="tw"><table class="gmap"><thead><tr><th class="lv" colspan="2">LEVEL / SKILL</th>'+SEASONS.map(se=>'<th>Season '+se+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

  const chips=CATS.map(cat=>{const t=activeTracks(id).find(x=>x.category===cat);if(!t)return '<span class="chip"><b>'+CAT_S[cat]+'</b><span class="note">미설정</span></span>';const b=bookOf(t);const g=gridOf(b);const L=g.length?levelsOf().find(x=>x.no===g[0].level):null;return '<span class="chip"><b>'+CAT_S[cat]+'</b>'+h(b.book_name)+(L?' <span class="note">('+h(L.name)+')</span>':' <span class="note">(맵 밖 교재)</span>')+'</span>';}).join('');

  '<div class="noprint" style="display:flex;gap:6px"><button class="btn" data-act="print">인쇄 / PDF</button><a class="btn" href="#/chart/'+s.id+'">학생 차트</a><a class="btn p" href="#/student/'+s.id+'">학생 상세</a></div></div>'+

  renderMap(s)+
  '<div class="bar" style="margin-top:10px"><span class="note"><span class="lg lg-done"></span> 완료 &nbsp; <span class="lg lg-act"></span> 진행 중 &nbsp; <span class="lg lg-todo"></span> 남음</span><span class="sp"></span><span class="note">'+h(S.meta.academy_name||'EPL')+' · '+S.locations.map(l=>h(l.name)).join(' · ')+'</span></div>'+
  '<p class="note noprint">각 스킬 행에서 지금 진행 중인 칸을 클릭하세요. 스킬마다 따로 기록됩니다 (Reading·Grammar·Writing·Vocabulary 독립). 클릭한 칸은 진행 중이 되고 그 앞 칸은 완료로 표시되며, Unit은 1부터 시작합니다(교재 설정에서 변경).</p>';
}

function starsTxt(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):'—';}
function areaRows(r,auto){
  const names=(r.areas&&r.areas.length)?r.areas.map(a=>a.name):(S.meta.report_areas||DEFAULT_REPORT_AREAS);
  return names.map(name=>{const cur=(r.areas||[]).find(a=>a.name===name);const level=normLevel(cur&&cur.level?cur.level:(cur&&cur.score!=null?levelOf(cur.score):(auto[name]!=null?levelOf(auto[name]):'보통')));return{name,level,score:level?levelScore(level):null,auto:auto[name]!=null?levelOf(auto[name]):null,fallback:auto[name]==null&&!(cur&&(cur.level||cur.score!=null))};});
}
function radarSvg(rows,prev){
  const n=rows.length;if(n<3)return '';const cx=170,cy=122,R=76;const ang=i=>-Math.PI/2+i*2*Math.PI/n;const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  const ring=k=>'<polygon points="'+rows.map((_,i)=>pt(i,R*k/3).map(v=>v.toFixed(1)).join(',')).join(' ')+'" fill="none" stroke="var(--line)" stroke-width="1"/>';
  const axes=rows.map((_,i)=>{const [x,y]=pt(i,R);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';}).join('');
  const vals=rows.map(a=>a.score==null?0:a.score);
  const poly=rows.map((_,i)=>pt(i,R*vals[i]/3).map(v=>v.toFixed(1)).join(',')).join(' ');
  const dots=rows.map((_,i)=>{const [x,y]=pt(i,R*vals[i]/3);return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" fill="var(--navy)"/>';}).join('');
  const labels=rows.map((a,i)=>{const [x,y]=pt(i,R+14);const anchor=Math.abs(Math.cos(ang(i)))<0.2?'middle':Math.cos(ang(i))>0?'start':'end';return '<text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" font-size="11" text-anchor="'+anchor+'" fill="var(--ink)">'+h(a.name)+'</text>';}).join('');
  let prevPoly='';if(prev&&rows.some(a=>prev[a.name])){const pv=rows.map(a=>prev[a.name]?levelScore(prev[a.name]):0);prevPoly='<polygon points="'+rows.map((_,i)=>pt(i,R*pv[i]/3).map(v=>v.toFixed(1)).join(',')).join(' ')+'" fill="var(--brass)" fill-opacity=".08" stroke="var(--brass)" stroke-width="1.5" stroke-dasharray="4 3"/>';}
  return '<svg viewBox="0 0 340 244" width="340" height="244" style="max-width:100%;height:auto" class="spark" role="img" aria-label="영역별 성취도">'+[1,2,3].map(ring).join('')+axes+prevPoly+'<polygon points="'+poly+'" fill="var(--navy)" fill-opacity=".12" stroke="var(--navy)" stroke-width="2"/>'+dots+labels+'</svg>';
}

function alertRow(a){

  else if(lvl==='TEACHER')btn=(ev&&ev.type==='ABSENCE'?'<input type="date" id="mk_'+a.id+'" value="'+h(ev.makeup_date||'')+'" title="보강일"> ':'')+'<input type="text" id="hn_'+a.id+'" placeholder="처리 메모 (선택)" style="width:160px"> <button class="btn s p" data-act="handle" data-id="'+a.id+'">처리 완료</button>';

  '<div class="row" style="margin-top:6px">'+btn+(a.status==='OPEN'&&lvl==='TEACHER'?'':'')+'</div></div></div>';

function viewAlerts(q){
  const f=q.f||'OPEN';const loc=q.loc||'';const ids=new Set(S.students.filter(s=>!loc||s.location_id===loc).map(s=>s.id));

  const reported=all.filter(a=>a.status==='REPORTED');const resolved=all.filter(a=>a.status==='RESOLVED').sort((a,b)=>(b.resolved_at||'').localeCompare(a.resolved_at||''));
  const today=todayISO();const inc=incompleteList(addDays(today,-7),addDays(today,-1),loc);
  const tabs='<div class="tabs" style="margin:0"><a href="#/alerts?f=OPEN'+(loc?'&loc='+loc:'')+'" class="'+(f==='OPEN'?'on':'')+'">처리할 것 '+open.length+'</a><a href="#/alerts?f=REPORTED'+(loc?'&loc='+loc:'')+'" class="'+(f==='REPORTED'?'on':'')+'">보고·요청 중 '+reported.length+'</a><a href="#/alerts?f=INCOMPLETE'+(loc?'&loc='+loc:'')+'" class="'+(f==='INCOMPLETE'?'on':'')+'">완료 기준 미충족 '+inc.length+'</a><a href="#/alerts?f=RESOLVED'+(loc?'&loc='+loc:'')+'" class="'+(f==='RESOLVED'?'on':'')+'">해결됨</a></div>';
  let body='';
  if(f==='OPEN')body=open.length?open.map(alertRow).join(''):'<div class="empty">처리할 예외가 없습니다.</div>';
  else if(f==='REPORTED')body=reported.length?reported.map(alertRow).join(''):'<div class="empty">보고·요청 중인 건이 없습니다.</div>';
  else if(f==='INCOMPLETE')body=inc.length?'<p class="note">최근 7일, 등원 예정이었는데 세션 기록이 없거나 알림장이 발송되지 않은 날입니다. 결석이었다면 Home에서 그 날짜로 "결석"을 눌러 주세요.</p><div class="tw"><table class="t"><thead><tr><th>날짜</th><th>학생</th><th>상태</th><th></th></tr></thead><tbody>'+inc.map(x=>'<tr><td>'+h(x.date)+' ('+WD[wdOf(x.date)]+')</td><td><a href="#/student/'+x.student.id+'">'+h(x.student.name)+'</a></td><td>'+(x.kind==='NO_SESSION'?badge('b-bad','세션 미기록'):badge('b-warn','알림장 미발송'))+'</td><td>'+(x.kind==='NO_SESSION'?'<a class="btn s" href="#/session/'+x.student.id+'?date='+x.date+'">세션 입력</a> <button class="btn s" data-act="absent" data-id="'+x.student.id+'" data-date="'+x.date+'">결석이었음</button>':'<a class="btn s" href="#/notices?date='+x.date+'">알림장 보드</a>')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">최근 7일 완료 기준을 모두 충족했습니다.</div>';
  else body=resolved.length?'<div class="tw"><table class="t"><thead><tr><th>학생</th><th>예외</th><th>권한</th><th>처리</th><th>발생 → 해결</th></tr></thead><tbody>'+resolved.slice(0,60).map(a=>'<tr><td>'+h(nameOf(S.students,a.student_id))+'</td><td>'+h(RULE_L[a.rule_code]||EVENT_TYPES[a.rule_code]||a.rule_code)+'<div class="note">'+h(a.message)+'</div></td><td>'+badge(LEVEL_CLS[a.authority_level]||'b-muted',LEVEL_L[a.authority_level]||'')+'</td><td>'+h(nameOf(S.teachers,a.handled_by))+(a.handle_note?'<div class="note">'+h(a.handle_note)+'</div>':'')+'</td><td class="note">'+h(a.created_at)+' → '+h(a.resolved_at)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">없음</div>';
  return '<h1>할 일</h1><p class="sub">시스템이 잡아낸 것만 여기 옵니다. 할 일마다 누가 결정하는지·기준·처리 방법·기한이 붙어 있습니다. 강사 단독은 바로 끝내고, 나머지는 보고하거나 결정을 요청하면 됩니다.</p>'+
  '<div class="bar">'+tabs+'<span class="sp"></span><label class="f">지점<select class="hq" data-k="loc"><option value="">전체</option>'+opt(S.locations,loc)+'</select></label>'+(isDirector()?'<button class="btn" data-act="runRules">규칙 전체 실행</button>':'')+'</div><div class="panel">'+body+'</div>';
}

// --- 원장 주간 대시보드 ---

  if(!isDirector())return roleGate();
  const ws=q.week||weekStartOf(todayISO());const locs=S.locations;const cols=[{id:'',name:'전체'},...locs];
  const data=cols.map(c=>{const m=weekMetrics(c.id,ws);const b=weekBaseline(c.id,ws);return{c,m,b,f:weekFlags(m,b)};});
